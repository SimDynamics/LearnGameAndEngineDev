name: One-time lesson text verification
on:
  push:
    branches: [Codex]
    paths:
      - .github/workflows/one-time-lesson-text.yml
      - scripts/maintenance/repair_lesson_text_details.py
      - native/presentation/windows/lesson_text_display_tests.cpp
      - native/narration/worker/test_windows_symbol_speech.py
      - native/narration/worker/test_windows_symbol_speech.kt
permissions:
  contents: write
concurrency:
  group: one-time-lesson-text-Codex
  cancel-in-progress: false
jobs:
  verify-and-publish:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 20
      - name: Create isolated native QA project without editing presets
        shell: python
        run: |
          from pathlib import Path
          import os, re
          root=Path.cwd()
          qa=Path(os.environ['RUNNER_TEMP'])/'lesson-text-qa'
          qa.mkdir(parents=True,exist_ok=True)
          text=(root/'cmake/native_build_config.hpp.in').read_text(encoding='utf-8')
          text=text.replace('@CMAKE_SOURCE_DIR@',root.as_posix()).replace('@LGAED_DEFAULT_PROFILE@','Codex')
          text=re.sub(r'@[A-Z_]+@','',text)
          (qa/'native_build_config.hpp').write_text(text,encoding='utf-8')
          cmake='''cmake_minimum_required(VERSION 3.25)
          project(LessonTextQA LANGUAGES CXX)
          set(CMAKE_CXX_STANDARD 20)
          set(CMAKE_CXX_STANDARD_REQUIRED ON)
          add_compile_definitions(UNICODE _UNICODE WIN32_LEAN_AND_MEAN NOMINMAX _WIN32_WINNT=0x0A00 WINVER=0x0A00)
          add_compile_options(/utf-8 /W4 /permissive- /Zc:__cplusplus /EHsc /Gy)
          include_directories("@ROOT@/native" "${CMAKE_CURRENT_SOURCE_DIR}")
          add_library(qa_core STATIC
            "@ROOT@/native/core/lesson.cpp"
            "@ROOT@/native/core/lesson_state.cpp"
            "@ROOT@/native/core/profile.cpp"
            "@ROOT@/native/core/cpp_project.cpp"
            "@ROOT@/native/core/view_preferences.cpp")
          add_library(qa_ui STATIC
            "@ROOT@/native/presentation/windows/cpp_fill_view.cpp"
            "@ROOT@/native/presentation/windows/order_code_view.cpp"
            "@ROOT@/native/presentation/windows/rich_text.cpp"
            "@ROOT@/native/presentation/windows/reader_theme.cpp"
            "@ROOT@/native/presentation/windows/code_editor.cpp"
            "@ROOT@/native/presentation/windows/code_gutter.cpp")
          target_link_libraries(qa_ui PUBLIC qa_core user32 gdi32 gdiplus comctl32 ole32 oleaut32 oleacc uuid windowsapp runtimeobject bcrypt shell32)
          add_executable(text_display "@ROOT@/native/presentation/windows/lesson_text_display_tests.cpp")
          target_link_libraries(text_display PRIVATE qa_ui)
          add_executable(inline_previous "@ROOT@/native/presentation/windows/inline_presentation_tests.cpp")
          target_link_libraries(inline_previous PRIVATE qa_ui)
          add_executable(order_previous "@ROOT@/native/presentation/windows/order_code_view_tests.cpp")
          target_link_libraries(order_previous PRIVATE qa_ui)
          foreach(target text_display inline_previous order_previous)
            target_sources(${target} PRIVATE "@ROOT@/native/presentation/windows/app.manifest")
          endforeach()
          enable_testing()
          add_test(NAME native.lesson_text_color COMMAND text_display color)
          add_test(NAME native.order_text_bounds COMMAND text_display geometry)
          add_test(NAME native.inline_presentation COMMAND inline_previous)
          add_test(NAME native.order_previous COMMAND order_previous)
          '''.replace('@ROOT@',root.as_posix())
          (qa/'CMakeLists.txt').write_text(cmake,encoding='utf-8')
      - name: Reproduce the defects against the original implementation
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'MSVC unavailable.' }
          $dev = Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
          $qa = Join-Path $env:RUNNER_TEMP 'lesson-text-qa'
          $command = 'call "' + $dev + '" && cmake -S "' + $qa + '" -B "' + $qa + '\build" -G Ninja -DCMAKE_BUILD_TYPE=Debug && cmake --build "' + $qa + '\build" --parallel 2'
          cmd /d /s /c $command
          if ($LASTEXITCODE -ne 0) { throw 'Baseline build failed.' }
          $PSNativeCommandUseErrorActionPreference = $false
          & "$qa\build\text_display.exe" color
          "Baseline color exit: $LASTEXITCODE"
          & "$qa\build\text_display.exe" geometry
          "Baseline geometry exit: $LASTEXITCODE"
          exit 0
      - name: Apply guarded source fixes
        id: patch
        shell: pwsh
        run: |
          python scripts/maintenance/repair_lesson_text_details.py
          if ($LASTEXITCODE -ne 0) { throw 'Repair anchor changed; no patch published.' }
          python -m py_compile native/narration/worker/build_worker.py native/narration/worker/test_windows_symbol_speech.py
          if ($LASTEXITCODE -ne 0) { throw 'Python syntax validation failed.' }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'Diff check failed.' }
      - name: Verify all changed native behavior and prior regressions
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $dev = Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
          $qa = Join-Path $env:RUNNER_TEMP 'lesson-text-qa'
          $command = 'call "' + $dev + '" && cmake --build "' + $qa + '\build" --parallel 2 && ctest --test-dir "' + $qa + '\build" --output-on-failure'
          cmd /d /s /c $command
          if ($LASTEXITCODE -ne 0) { throw 'Native verification failed; changes not published.' }
      - name: Compile and execute the real Windows-generated speech frontend
        if: ${{ !cancelled() && steps.patch.outcome == 'success' }}
        shell: pwsh
        run: |
          $folder = Join-Path $env:RUNNER_TEMP 'kotlin-2.2.10'
          $archive = Join-Path $env:RUNNER_TEMP 'kotlin-compiler-2.2.10.zip'
          Invoke-WebRequest 'https://github.com/JetBrains/kotlin/releases/download/v2.2.10/kotlin-compiler-2.2.10.zip' -OutFile $archive
          Expand-Archive $archive -DestinationPath $folder
          python native/narration/worker/test_windows_symbol_speech.py --kotlinc "$folder\kotlinc\bin\kotlinc.bat"
          if ($LASTEXITCODE -ne 0) { throw 'Real speech frontend verification failed.' }
      - name: Publish only verified changes in fast-forward batches
        shell: pwsh
        run: |
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'Diff check failed.' }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add native/presentation/windows/rich_text.cpp native/narration/worker/build_worker.py
          git commit -m 'fix(windows): recognize explicit prose literals and clarify technical symbol readings'
          if ($LASTEXITCODE -ne 0) { throw 'Speech/color commit failed.' }
          git push origin HEAD:refs/heads/Codex
          if ($LASTEXITCODE -ne 0) { throw 'Codex advanced; refusing to overwrite concurrent changes.' }
          git add native/presentation/windows/order_code_view.cpp CMakeLists.txt
          git rm scripts/maintenance/repair_lesson_text_details.py .github/workflows/one-time-lesson-text.yml
          git commit -m 'fix(windows): measure real order-card text bounds across zoom levels'
          if ($LASTEXITCODE -ne 0) { throw 'Geometry commit failed.' }
          git push origin HEAD:refs/heads/Codex
          if ($LASTEXITCODE -ne 0) { throw 'Codex advanced; no force push attempted.' }
          git status --short
          git rev-parse HEAD
      - name: Keep native test diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lesson-text-verification
          path: ${{ runner.temp }}/lesson-text-qa/build/Testing/Temporary/*.log
          if-no-files-found: ignore
          retention-days: 3
