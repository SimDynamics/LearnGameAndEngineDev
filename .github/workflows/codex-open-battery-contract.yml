name: Codex original open battery root contracts

on:
  push:
    branches: [Codex]
    paths:
      - scripts/curriculum/published_adoption_fixtures.py
      - scripts/curriculum/stable_state_layout.py
      - scripts/curriculum/test_open_battery_contract.py
      - scripts/curriculum/test_reduction_contract.py
      - scripts/curriculum/test_integer_battery_contract.py
      - .github/workflows/codex-open-battery-contract.yml
      - native/core/boolean_battery_check.hpp
      - native/core/reduction_check.hpp
      - native/core/integer_battery_check.hpp
      - app/src/main/assets/content/es/programming/programming_practice_tools/comprobaciones_repetibles/lesson_bateria_como_segundo_consumidor.json
      - app/src/main/assets/content/es/programming/programming_practice_tools/evidencia_y_diagnostico/lesson_reducir_codigo_sin_borrar_el_fallo.json
      - app/src/main/assets/content/es/programming/programming_practice_tools/evidencia_y_diagnostico/lesson_versiones_del_fuente_y_del_ejecutable.json
      - app/src/main/assets/content/es/programming/programming_practice_tools/comprobaciones_repetibles/lesson_integrar_un_proyecto_y_sostener_su_evidencia.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: windows-2022
    timeout-minutes: 6
    env:
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.longpaths
      GIT_CONFIG_VALUE_0: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select Python for native Windows QA
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify root-only authoring and full historical preservation
        run: python -B -m unittest discover -s scripts/curriculum -p test_open_battery_contract.py -v
      - name: Verify stateful reduction authoring and historical preservation
        run: python -B -m unittest discover -s scripts/curriculum -p test_reduction_contract.py -v
      - name: Verify integer CMake batteries and earlier client declarations
        run: python -B -m unittest discover -s scripts/curriculum -p test_integer_battery_contract.py -v
