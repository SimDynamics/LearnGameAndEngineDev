name: Codex isolated Win32 edition, simulation and first-case C++ runtime QA

on:
  push:
    branches: [Codex]
    paths:
      - .github/workflows/codex-course-edition-runtime.yml
      - cmake/HostedCourseEditionQA/**
      - cmake/CurricularWindows.cmake
      - cmake/native_build_config.hpp.in
      - native/platform/windows/course_edition_tests.cpp
      - native/platform/windows/catalog_loader.cpp
      - native/platform/windows/content_loader.cpp
      - native/platform/windows/general_choice_editorial_tests.cpp
      - scripts/curriculum/choice_retirement_fixture_source.py
      - scripts/curriculum/test_choice_retirement_history.py
      - scripts/curriculum/local_scalar_fixture_source.py
      - scripts/curriculum/test_local_scalar_probe_authoring.py
      - scripts/curriculum/course_edition_fixture_source.py
      - native/platform/windows/local_int_state_tests.cpp
      - native/platform/windows/local_string_state_tests.cpp
      - native/core/cpp_local_string_probe.hpp
      - native/core/lesson.hpp
      - native/platform/windows/cpp_runner.hpp
      - scripts/curriculum/test_local_string_probe_authoring.py
      - native/platform/windows/u6l19_case_split_state_tests.cpp
      - native/platform/windows/u3_runtime_semantics_tests.cpp
      - native/platform/windows/named_rule_runtime_tests.cpp
      - native/core/named_rule_check.hpp
      - native/core/named_rule_constant_variation_check.hpp
      - native/core/named_rule_battery_check.hpp
      - app/src/main/assets/content/es/programming/programming_practice_tools/comprobaciones_repetibles/lesson_nombrar_reglas_y_separar_acuerdos.json
      - native/core/rejection_diagnostic_facts.hpp
      - native/core/report_observation_check.hpp
      - app/src/main/assets/content/es/programming/programming_practice_tools/comprobaciones_repetibles/lesson_diagnosticos_para_corregir_una_peticion.json
      - app/src/main/assets/content/es/programming/programming_practice_tools/comprobaciones_repetibles/lesson_automatizar_la_revision_sin_borrar_evidencia.json
      - scripts/curriculum/test_current_batched_client_split.py
      - native/core/cpp_local_int_probe.hpp
      - native/presentation/windows/reading_gate_policy_tests.cpp
      - native/presentation/windows/technical_context_view_tests.cpp
      - native/presentation/windows/lesson_view.cpp
      - native/presentation/windows/lesson_view_tests.cpp
      - native/presentation/windows/rich_text.cpp
      - native/presentation/windows/rich_text.hpp
      - native/core/text_semantics.cpp
      - app/src/main/assets/content/es/programming/cpp_fundamentals/objetos_y_estado/lesson_*.json
      - scripts/curriculum/course_edition_fixture_source.py
      - native/core/simulation.cpp
      - native/core/simulation.hpp
      - native/core/simulation_tests.cpp
      - native/presentation/windows/simulation_view.cpp
      - native/presentation/windows/simulation_view_tests.cpp
      - native/presentation/windows/simulation_lesson_tests.cpp
      - native/presentation/windows/compiler_first_case_view_tests.cpp
      - native/platform/windows/cpp_runner.cpp
      - native/platform/windows/compiler_completion.cpp
      - docs/examples/array_runs_empty_text_simulation.json
      - docs/examples/array_runs_simulation.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-real-course-edition:
    name: Run Win32 edition, simulation and first required C++ case
    runs-on: windows-2025-vs2026
    timeout-minutes: 45
    steps:
      - name: Read the exact Codex revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select Python for original edition fixtures
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Activate hosted MSVC without modifying the product pin
        uses: ilammy/msvc-dev-cmd@v1
      - name: Identify the separate hosted build tools
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host 'Hosted QA only; the product MSVC and SDK pins are untouched.'
          Get-Command cl, cmake, ninja | Select-Object Name, Source | Format-Table | Out-Host
          cmake --version
          ninja --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Configure and link original Windows curricular reader
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $build = Join-Path $env:RUNNER_TEMP 'lgaed-course-edition-qa'
          cmake -S cmake/HostedCourseEditionQA -B $build -G Ninja -DCMAKE_BUILD_TYPE=Debug
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build $build --target lgaed_general_choice_editorial_tests lgaed_course_edition_tests lgaed_simulation_tests lgaed_simulation_view_tests lgaed_simulation_lesson_tests lgaed_compiler_first_case_view_tests lgaed_technical_context_view_tests lgaed_reading_gate_policy_tests lgaed_local_int_state_tests lgaed_local_string_state_tests lgaed_inline_feedback_view_tests lgaed_u6l19_case_split_state_tests lgaed_u3_runtime_semantics_tests lgaed_u3_named_rule_runtime_tests --parallel 3
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve earlier reading snapshots across an authenticated option review
        shell: pwsh
        run: |
          $build = Join-Path $env:RUNNER_TEMP 'lgaed-course-edition-qa'
          ctest --test-dir $build -R '^native[.]general_choice_retirement_history$' --verbose --output-on-failure --no-tests=error --output-junit (Join-Path $build 'choice-retirement-history.xml')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify U2L8 char and bool dependencies with real MSVC and StateStore
        shell: pwsh
        run: |
          $build = Join-Path $env:RUNNER_TEMP 'lgaed-course-edition-qa'
          ctest --test-dir $build -R '^native[.]current_u2l8_local_scalar_state$' --verbose --output-on-failure --no-tests=error --output-junit (Join-Path $build 'u2l8-local-scalar-state.xml')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Execute edition replacement, native quiz, scoped reset and reopen
        shell: pwsh
        run: |
          $build = Join-Path $env:RUNNER_TEMP 'lgaed-course-edition-qa'
          ctest --test-dir $build -R '^native\.course_edition$' --verbose --output-on-failure --no-tests=error --output-junit (Join-Path $build 'course-edition-runtime.xml')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Execute real arrayRunsV1 model and Win32 empty-text controls
        shell: pwsh
        run: |
          $build = Join-Path $env:RUNNER_TEMP 'lgaed-course-edition-qa'
          ctest --test-dir $build -R '^native\.simulation_(model|empty_text_controls|empty_text_lesson)$' --verbose --output-on-failure --no-tests=error --output-junit (Join-Path $build 'simulation-empty-text-runtime.xml')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Execute actual Win32 compiler with first case required and twelve optional
        shell: pwsh
        run: |
          $build = Join-Path $env:RUNNER_TEMP 'lgaed-course-edition-qa'
          ctest --test-dir $build -R '^native\.compiler_puzzles$' --verbose --output-on-failure --no-tests=error --output-junit (Join-Path $build 'compiler-first-case-win32.xml')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify active U2 semantic ranges and both real native compiler reading gates
        shell: pwsh
        run: |
          $build = Join-Path $env:RUNNER_TEMP 'lgaed-course-edition-qa'
          ctest --test-dir $build -R '^native[.](current_u2(_roles|l5_gates)|current_u2l6_native_gates)$' --verbose --output-on-failure --no-tests=error --output-junit (Join-Path $build 'current-u2-win32.xml')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify U2L6 independent reader gates and restored bookmarks
        shell: pwsh
        run: |
          $build = Join-Path $env:RUNNER_TEMP 'lgaed-course-edition-qa'
          ctest --test-dir $build -R '^native[.]current_u2l6_reading_gate$' --verbose --output-on-failure --no-tests=error --output-junit (Join-Path $build 'u2l6-reading-gate.xml')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify six active U2 local-int owners and sealed Windows state
        shell: pwsh
        run: |
          $build = Join-Path $env:RUNNER_TEMP 'lgaed-course-edition-qa'
          ctest --test-dir $build -R '^native[.]current_u2_local_int_state$' --verbose --output-on-failure --no-tests=error --output-junit (Join-Path $build 'u2-local-int-state.xml')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify U2L7 string variables through actual hosted MSVC and StateStore
        shell: pwsh
        run: |
          $build = Join-Path $env:RUNNER_TEMP 'lgaed-course-edition-qa'
          ctest --test-dir $build -R '^native[.]current_u2_local_string_state$' --verbose --output-on-failure --no-tests=error --output-junit (Join-Path $build 'u2-local-string-state.xml')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check nine current inline-fill controls through real Win32 LessonView
        shell: pwsh
        run: |
          $build = Join-Path $env:RUNNER_TEMP 'lgaed-course-edition-qa'
          ctest --test-dir $build -R '^native[.]current_inline_feedback$' --verbose --output-on-failure --no-tests=error --output-junit (Join-Path $build 'inline-feedback-win32.xml')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve historical U6L19 batch without granting new standalone cases
        shell: pwsh
        run: |
          $build = Join-Path $env:RUNNER_TEMP 'lgaed-course-edition-qa'
          ctest --test-dir $build -R '^native[.]u6l19_case_split_state$' --verbose --output-on-failure --no-tests=error --output-junit (Join-Path $build 'u6l19-case-split-state.xml')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Execute real P2 U3 diagnostic and report semantic probes with hosted MSVC
        shell: pwsh
        run: |
          $build = Join-Path $env:RUNNER_TEMP 'lgaed-course-edition-qa'
          ctest --test-dir $build -R '^native[.]u3_runtime_semantics$' --verbose --output-on-failure --no-tests=error --output-junit (Join-Path $build 'u3-runtime-semantic-probes.xml')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check named constants, independent functions and their counterfactuals in U3 with real MSVC
        shell: pwsh
        run: |
          $build = Join-Path $env:RUNNER_TEMP 'lgaed-course-edition-qa'
          ctest --test-dir $build -R '^native[.]u3_named_rules_single_file$' --verbose --output-on-failure --no-tests=error --output-junit (Join-Path $build 'u3-named-rules-win32.xml')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve native test and compile evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hosted-win32-course-edition-${{ github.sha }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/lgaed-course-edition-qa/u2l8-local-scalar-state.xml
            ${{ runner.temp }}/lgaed-course-edition-qa/choice-retirement-history.xml
            ${{ runner.temp }}/lgaed-course-edition-qa/course-edition-runtime.xml
            ${{ runner.temp }}/lgaed-course-edition-qa/simulation-empty-text-runtime.xml
            ${{ runner.temp }}/lgaed-course-edition-qa/compiler-first-case-win32.xml
            ${{ runner.temp }}/lgaed-course-edition-qa/current-u2-win32.xml
            ${{ runner.temp }}/lgaed-course-edition-qa/u2l6-reading-gate.xml
            ${{ runner.temp }}/lgaed-course-edition-qa/u2-local-int-state.xml
            ${{ runner.temp }}/lgaed-course-edition-qa/u2-local-string-state.xml
            ${{ runner.temp }}/lgaed-course-edition-qa/inline-feedback-win32.xml
            ${{ runner.temp }}/lgaed-course-edition-qa/u6l19-case-split-state.xml
            ${{ runner.temp }}/lgaed-course-edition-qa/u3-runtime-semantic-probes.xml
            ${{ runner.temp }}/lgaed-course-edition-qa/u3-named-rules-win32.xml
            ${{ runner.temp }}/lgaed-course-edition-qa/Testing/Temporary/*.log
            ${{ runner.temp }}/lgaed-course-edition-qa/CMakeFiles/CMakeConfigureLog.yaml

