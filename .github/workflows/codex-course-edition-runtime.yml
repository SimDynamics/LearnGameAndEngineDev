permissions:
  contents: read

jobs:
  run-reader-revision-named-rule:
    name: Verify named-rule feedback after preserving the mounted QA lesson
    if: ${{ github.event_name == 'push' && startsWith(github.event.head_commit.message, 'qa-reader-revision:') }}
    runs-on: windows-2025-vs2026
    timeout-minutes: 25
    steps:
      - name: Read exact Codex revision and authenticated named-rule publications
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select Python for the original named-rule fixture and authoring checks
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Activate hosted MSVC without modifying the product pin
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Build the existing Win32 feedback target and its authenticated fixture
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host 'Focused hosted Windows QA; the product toolchain pin is retained.'
          Get-Command cl, cmake, ninja | Select-Object Name, Source | Format-Table | Out-Host
          $qaNamedRuleBuild = Join-Path $env:RUNNER_TEMP 'lgaed-reader-revision-named-rule-qa'
          cmake -S cmake/HostedCourseEditionQA -B $qaNamedRuleBuild -G Ninja -DCMAKE_BUILD_TYPE=Debug
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build $qaNamedRuleBuild --target lgaed_curricular_input_lab_tests --parallel 3
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify only the original named-rule feedback view and authoring contracts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $qaNamedRuleBuild = Join-Path $env:RUNNER_TEMP 'lgaed-reader-revision-named-rule-qa'
          $qaNamedRulePattern = '^native[.]named_rule_feedback_(view|authoring)$'
          $qaNamedRuleExpected = @('native.named_rule_feedback_view', 'native.named_rule_feedback_authoring')
          $qaNamedRuleListingText = & ctest --test-dir $qaNamedRuleBuild -R $qaNamedRulePattern --show-only=json-v1
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect the original named-rule feedback selection.' }
          $qaNamedRuleListing = ($qaNamedRuleListingText -join "`n") | ConvertFrom-Json
          $qaNamedRuleActual = @($qaNamedRuleListing.tests | ForEach-Object { $_.name })
          if ($qaNamedRuleActual.Count -ne $qaNamedRuleExpected.Count -or
              (Compare-Object -ReferenceObject $qaNamedRuleExpected -DifferenceObject $qaNamedRuleActual)) {
            throw 'The named-rule feedback selection must contain exactly its two original tests.'
          }
          ctest --test-dir $qaNamedRuleBuild -R $qaNamedRulePattern --parallel 1 --verbose --output-on-failure --no-tests=error --output-junit (Join-Path $qaNamedRuleBuild 'named-rule-feedback.xml') --output-log (Join-Path $qaNamedRuleBuild 'named-rule-feedback.log')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve focused feedback and authenticated fixture evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hosted-reader-revision-named-rule-${{ github.sha }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/lgaed-reader-revision-named-rule-qa/named-rule-feedback.xml
            ${{ runner.temp }}/lgaed-reader-revision-named-rule-qa/named-rule-feedback.log
            ${{ runner.temp }}/lgaed-reader-revision-named-rule-qa/Testing/Temporary/*.log
            ${{ runner.temp }}/lgaed-reader-revision-named-rule-qa/CMakeFiles/CMakeConfigureLog.yaml
            ${{ runner.temp }}/lgaed-reader-revision-named-rule-qa/test-fixtures/named-rule-feedback/**
  run-editor-viewport:
    name: Verify original editor wheel and viewport regressions on hosted MSVC
    if: ${{ github.event_name == 'push' && startsWith(github.event.head_commit.message, 'qa-editor-viewport:') }}
    runs-on: windows-2025-vs2026
    timeout-minutes: 25
    steps:
      - name: Read exact Codex revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select Python for the hosted QA project
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Activate hosted MSVC x64 without changing the product pin
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Configure and compile the original Win32 editor tests
        shell: pwsh
        run: |
          $build = Join-Path $env:RUNNER_TEMP 'lgaed-editor-viewport-qa'
          cmake -S cmake/HostedCourseEditionQA -B $build -G Ninja -DCMAKE_BUILD_TYPE=Debug
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build $build --target lgaed_code_gutter_wheel_tests lgaed_code_editor_viewport_tests --parallel 3
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Exercise the original wheel and viewport checks
        shell: pwsh
        run: |
          $build = Join-Path $env:RUNNER_TEMP 'lgaed-editor-viewport-qa'
          ctest --test-dir $build -R '^native[.](code_gutter_wheel|code_editor_viewport)$' --verbose --output-on-failure --no-tests=error --output-junit (Join-Path $build 'editor-viewport.xml')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve native test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hosted-editor-viewport-${{ github.sha }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/lgaed-editor-viewport-qa/editor-viewport.xml
            ${{ runner.temp }}/lgaed-editor-viewport-qa/Testing/Temporary/*.log
            ${{ runner.temp }}/lgaed-editor-viewport-qa/CMakeFiles/CMakeConfigureLog.yaml
  run-prediction-final-newline:
    name: Verify optional final newlines without changing exact interior output
    if: ${{ github.event_name == 'push' && (startsWith(github.event.head_commit.message, 'qa-prediction-newline:') || startsWith(github.event.head_commit.message, 'qa-prediction:')) }}
    runs-on: windows-2025-vs2026
    timeout-minutes: 25
    steps:
      - name: Read exact Codex source and authenticated historical predictions
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select Python for the original hosted fixture generators
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Activate hosted MSVC without modifying the product pin
        uses: ilammy/msvc-dev-cmd@v1
      - name: Configure focused prediction QA
        shell: pwsh
        run: |
          $qaNewlineBuild = Join-Path $env:RUNNER_TEMP 'lgaed-prediction-newline-qa'
          cmake -S cmake/HostedCourseEditionQA -B $qaNewlineBuild -G Ninja -DCMAKE_BUILD_TYPE=Debug
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Reproduce the exact final-newline rejection on the original evaluator
        if: ${{ startsWith(github.event.head_commit.message, 'qa-prediction-newline:') }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $qaNewlineBuild = Join-Path $env:RUNNER_TEMP 'lgaed-prediction-newline-qa'
          try {
            git restore --source=bc710464beebd40447e58521e7b1988179ed326f --worktree -- native/core/lesson.cpp
            if ($LASTEXITCODE -ne 0) { throw 'Cannot select the authenticated original prediction evaluator.' }
            cmake --build $qaNewlineBuild --target lgaed_prediction_output_tests --parallel 3
            if ($LASTEXITCODE -ne 0) { throw 'The original evaluator failed to compile; this is not the reported newline rejection.' }
            ctest --test-dir $qaNewlineBuild -R '^native[.]prediction_output_endings$' --verbose --output-on-failure --no-tests=error --output-junit (Join-Path $qaNewlineBuild 'prediction-newline-original.xml')
            $qaOriginalExit = $LASTEXITCODE
            $qaOriginalLog = Join-Path $qaNewlineBuild 'Testing/Temporary/LastTest.log'
            Copy-Item $qaOriginalLog (Join-Path $qaNewlineBuild 'prediction-newline-original.log')
            if ($qaOriginalExit -eq 0 -or (Get-Content $qaOriginalLog -Raw) -notmatch 'One optional final LF was rejected') {
              throw 'The original evaluator did not reproduce the exact final-newline rejection.'
            }
          } finally {
            git restore --source=HEAD --worktree -- native/core/lesson.cpp
            if ($LASTEXITCODE -ne 0) { throw 'Cannot restore the published prediction evaluator.' }
          }
      - name: Build the repaired evaluator and original Win32 controls
        shell: pwsh
        run: |
          $qaNewlineBuild = Join-Path $env:RUNNER_TEMP 'lgaed-prediction-newline-qa'
          cmake --build $qaNewlineBuild --target lgaed_prediction_output_tests lgaed_lesson_editor_mount_tests lgaed_exact_prediction_view_tests --parallel 3
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify exact multiline answers, drafts, progress and historical predictions
        shell: pwsh
        run: |
          $qaNewlineBuild = Join-Path $env:RUNNER_TEMP 'lgaed-prediction-newline-qa'
          ctest --test-dir $qaNewlineBuild -R '^native[.](prediction_output_endings|prediction_final_newline|exact_prediction_view|(active_edition_)?prediction_newline_visible|(active_edition_)?prepared_input_predictions(_history)?)$' --verbose --output-on-failure --no-tests=error --output-junit (Join-Path $qaNewlineBuild 'prediction-newline-fixed.xml')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve original rejection and corrected native interaction evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hosted-win32-prediction-newline-${{ github.sha }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/lgaed-prediction-newline-qa/prediction-newline-original.xml
            ${{ runner.temp }}/lgaed-prediction-newline-qa/prediction-newline-original.log
            ${{ runner.temp }}/lgaed-prediction-newline-qa/prediction-newline-fixed.xml
            ${{ runner.temp }}/lgaed-prediction-newline-qa/Testing/Temporary/*.log
            ${{ runner.temp }}/lgaed-prediction-newline-qa/CMakeFiles/CMakeConfigureLog.yaml
            ${{ runner.temp }}/lgaed-prediction-newline-qa/test-fixtures/u2l9*/**
  run-active-edition-narration:
    name: Synthesize the selected input prompt with three authentic Spanish voices
    if: ${{ github.event_name == 'push' && startsWith(github.event.head_commit.message, 'qa-active-edition:') }}
    runs-on: windows-2025-vs2026
    timeout-minutes: 25
    steps:
      - name: Read the selected and archived semantic sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select Python for the isolated narration regression
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Activate hosted MSVC for the original JNI launcher
        uses: ilammy/msvc-dev-cmd@v1
      - name: Prepare locked tools and synthesize the exact prompt regression
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $qaActiveNarrationRoot = Join-Path $env:RUNNER_TEMP 'lgaed-active-edition-narration'
          $qaActiveNarrationTools = & ./scripts/windows/Prepare-NarrationCITools.ps1
          $qaActiveNarrationTools | ConvertTo-Json | Set-Content -LiteralPath "$qaActiveNarrationRoot-tools.json" -Encoding utf8
          python -B scripts/curriculum/active_edition_narration_qa.py --java-home $qaActiveNarrationTools.JavaHome --ffmpeg $qaActiveNarrationTools.FFmpeg --output-dir $qaActiveNarrationRoot 2>&1 | Tee-Object -FilePath "$qaActiveNarrationRoot-results.log" | Write-Host
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve synthesis, timing and cache evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hosted-win32-active-edition-narration-${{ github.sha }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/lgaed-active-edition-narration-tools.json
            ${{ runner.temp }}/lgaed-active-edition-narration-results.log
            ${{ runner.temp }}/lgaed-active-edition-narration/compiler.log
            ${{ runner.temp }}/lgaed-active-edition-narration/compiler-evidence.json
            ${{ runner.temp }}/lgaed-active-edition-narration/resources.json
            ${{ runner.temp }}/lgaed-active-edition-narration/runtime.json
            ${{ runner.temp }}/lgaed-active-edition-narration/narration-qa-evidence.json
            ${{ runner.temp }}/lgaed-active-edition-narration/test.log
            ${{ runner.temp }}/lgaed-active-edition-narration/test-results.json
            ${{ runner.temp }}/lgaed-active-edition-narration/failure.json
            ${{ runner.temp }}/lgaed-active-edition-narration/worker-final-stderr.log
            ${{ runner.temp }}/lgaed-active-edition-narration/worker/build-evidence.json
            ${{ runner.temp }}/lgaed-active-edition-narration/samples/**
  run-active-edition-controls:
    name: Verify edition authoring, four output answers and preserved input editors
    if: ${{ github.event_name == 'push' && startsWith(github.event.head_commit.message, 'qa-active-edition:') }}
    runs-on: windows-2025-vs2026
    timeout-minutes: 25
    steps:
      - name: Read the selected edition and authenticated historical publications
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select Python for publication contracts and fixture provenance
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Activate hosted MSVC without modifying the product pin
        uses: ilammy/msvc-dev-cmd@v1
      - name: Verify the eight explanations in the selected and archived editions
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -B scripts/curriculum/test_pending_presentation_contract.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B native/narration/worker/test_spanish_prose_boundaries.py PromptEditionSourceTest -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build the original Win32 editor and prediction controls
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host 'Focused hosted Windows QA; the product toolchain pin is retained.'
          Get-Command cl, cmake, ninja | Select-Object Name, Source | Format-Table | Out-Host
          $qaActiveEditionBuild = Join-Path $env:RUNNER_TEMP 'lgaed-active-edition-controls'
          cmake -S cmake/HostedCourseEditionQA -B $qaActiveEditionBuild -G Ninja -DCMAKE_BUILD_TYPE=Debug
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build $qaActiveEditionBuild --target lgaed_lesson_editor_mount_tests lgaed_curricular_input_lab_tests lgaed_exact_prediction_view_tests lgaed_prediction_output_tests --parallel 3
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify multiline drafts, optional final endings and the first required input case
        shell: pwsh
        run: |
