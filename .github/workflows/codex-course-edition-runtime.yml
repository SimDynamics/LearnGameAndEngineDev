permissions:
  contents: read

jobs:
  run-real-course-edition:
    name: Run Win32 edition, simulation and first required C++ case
    runs-on: windows-2025-vs2026
    timeout-minutes: 45
    steps:
      - name: Read the exact Codex revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select Python for original edition fixtures
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Activate hosted MSVC without modifying the product pin
        uses: ilammy/msvc-dev-cmd@v1
      - name: Identify the separate hosted build tools
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host 'Hosted QA only; the product MSVC and SDK pins are untouched.'
          Get-Command cl, cmake, ninja | Select-Object Name, Source | Format-Table | Out-Host
          cmake --version
          ninja --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # Real playback needs an active render endpoint. Reuse the project's
      # signed-device evaluation only for an explicitly selected automatic push.
      - name: Prepare the signed endpoint for this reader evaluation
        if: startsWith(github.event.head_commit.message, 'qa-reader-order:')
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($qaServiceName in @('AudioEndpointBuilder', 'Audiosrv')) {
            $qaService = Get-Service -Name $qaServiceName -ErrorAction Stop
            $qaService | Select-Object Name, Status, StartType | Format-Table | Out-Host
            if ($qaService.StartType -eq 'Disabled') { throw "Audio service is disabled: $qaServiceName" }
            if ($qaService.Status -eq 'Stopped') {
              $qaService.Start()
              $qaService.WaitForStatus('Running', [TimeSpan]::FromSeconds(15))
              $qaService.Refresh()
            }
            if ($qaService.Status -ne 'Running') { throw "Audio service is not running: $qaServiceName" }
          }
          $qaSdkVersion = $env:WindowsSDKVersion.TrimEnd([char[]]'\/')
          if ($qaSdkVersion -notmatch '^\d+\.\d+\.\d+\.\d+$') { throw 'The activated SDK version is invalid.' }
          $qaSignTool = Join-Path $env:WindowsSdkDir "bin\$qaSdkVersion\x64\signtool.exe"
          if (-not (Test-Path -LiteralPath $qaSignTool -PathType Leaf)) { throw 'The activated SDK SignTool is absent.' }
          Get-Item -LiteralPath $qaSignTool | Select-Object FullName, @{Name='Version';Expression={$_.VersionInfo.FileVersion}} | Format-Table | Out-Host
          $qaPython = (Get-Command python.exe -CommandType Application | Select-Object -First 1).Source
          $qaAudioLog = Join-Path $env:GITHUB_WORKSPACE ('out\qa\reader-revision-audio-{0}-{1}' -f $env:GITHUB_RUN_ID, $env:GITHUB_RUN_ATTEMPT)
          & .\scripts\windows\Prepare-VirtualAudioCI.ps1 -PythonPath $qaPython -SignToolPath $qaSignTool -LogDirectory $qaAudioLog
      - name: Configure and link original Windows curricular reader
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $build = Join-Path $env:RUNNER_TEMP 'lgaed-course-edition-qa'
          cmake -S cmake/HostedCourseEditionQA -B $build -G Ninja -DCMAKE_BUILD_TYPE=Debug
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build $build --target lgaed_lesson_reader_edit_order_tests --parallel 3
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve current reading order after edits and ordinary reopen
        if: startsWith(github.event.head_commit.message, 'qa-reader-order:')
        shell: pwsh
        run: |
          $build = Join-Path $env:RUNNER_TEMP 'lgaed-course-edition-qa'
          python -B native/presentation/windows/lesson_reader_edit_order_fixture.py --prepare-catalog .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir $build -R '^native[.]reader_revision_' --verbose --output-on-failure --no-tests=error --output-junit (Join-Path $build 'reader-revision-order.xml')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build original input controls and editorial history loaders
        shell: pwsh
        run: |
          $build = Join-Path $env:RUNNER_TEMP 'lgaed-course-edition-qa'
          cmake --build $build --target lgaed_curricular_input_lab_tests lgaed_code_format_loader_tests lgaed_general_choice_editorial_tests --parallel 3
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve composed U2L9 semantics and same-page first-case access
        shell: pwsh
        run: |
          $build = Join-Path $env:RUNNER_TEMP 'lgaed-course-edition-qa'
          ctest --test-dir $build -R '^native[.](general_choice_semantic_composition|curricular_input_lab_same_page)$' --verbose --output-on-failure --no-tests=error --output-junit (Join-Path $build 'u2l9-semantic-composition-and-reference.xml')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify active U3 laboratories and the retired source contract
        shell: pwsh
        run: |
          $build = Join-Path $env:RUNNER_TEMP 'lgaed-course-edition-qa'
          ctest --test-dir $build -R '^native[.](curricular_u3_combinations|curricular_stdout_transport|code_format_current_pilot)$' --verbose --output-on-failure --no-tests=error --output-junit (Join-Path $build 'u3-current-controls-and-history.xml')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build the remaining original native regression targets
        shell: pwsh
        run: |
          $build = Join-Path $env:RUNNER_TEMP 'lgaed-course-edition-qa'
          cmake --build $build --target lgaed_general_choice_editorial_tests lgaed_lesson_editor_mount_tests lgaed_course_edition_tests lgaed_simulation_tests lgaed_simulation_view_tests lgaed_simulation_lesson_tests lgaed_compiler_first_case_view_tests lgaed_technical_context_view_tests lgaed_reading_gate_policy_tests lgaed_local_int_state_tests lgaed_local_string_state_tests lgaed_input_dependency_state_tests lgaed_input_probe_tests lgaed_local_role_state_tests lgaed_local_role_probe_tests lgaed_local_dependency_receipt_tests lgaed_local_dependency_view_tests lgaed_exact_prediction_view_tests lgaed_inline_feedback_view_tests lgaed_u6l19_case_split_state_tests lgaed_u3_runtime_semantics_tests lgaed_u3_named_rule_runtime_tests --parallel 3
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve choice prose history and both U2L10 multiline answers
        shell: pwsh
        run: |
          $build = Join-Path $env:RUNNER_TEMP 'lgaed-course-edition-qa'
          ctest --test-dir $build -R '^native[.](general_choice_prose_history|prediction_newline_visible)$' --verbose --output-on-failure --no-tests=error --output-junit (Join-Path $build 'choice-prose-and-prediction.xml')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve historical receipts and private feedback across new attempts and reset
        shell: pwsh
        run: |
          $build = Join-Path $env:RUNNER_TEMP 'lgaed-course-edition-qa'
          ctest --test-dir $build -R '^native[.]local_dependency_receipts$' --verbose --output-on-failure --no-tests=error --output-junit (Join-Path $build 'local-dependency-receipts.xml')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify all sixteen variable and input editors through real Win32 LessonView
        shell: pwsh
        run: |
          $build = Join-Path $env:RUNNER_TEMP 'lgaed-course-edition-qa'
          ctest --test-dir $build -R '^native[.]local_dependency_view_u[23]l[0-9]+$' --verbose --output-on-failure --no-tests=error --output-junit (Join-Path $build 'local-dependency-view.xml')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve earlier reading snapshots across an authenticated option review
        shell: pwsh
        run: |
          $build = Join-Path $env:RUNNER_TEMP 'lgaed-course-edition-qa'
          ctest --test-dir $build -R '^native[.]general_choice_retirement_history$' --verbose --output-on-failure --no-tests=error --output-junit (Join-Path $build 'choice-retirement-history.xml')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify U2L8 char and bool dependencies with real MSVC and StateStore
        shell: pwsh
        run: |
          $build = Join-Path $env:RUNNER_TEMP 'lgaed-course-edition-qa'
          ctest --test-dir $build -R '^native[.]current_u2l8_local_scalar_state$' --verbose --output-on-failure --no-tests=error --output-junit (Join-Path $build 'u2l8-local-scalar-state.xml')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify U2L10 free-name scalar roles and independent snapshots with real MSVC
        shell: pwsh
        run: |
          $build = Join-Path $env:RUNNER_TEMP 'lgaed-course-edition-qa'
          ctest --test-dir $build -R '^native[.](local_role_probe|current_u2l10_local_role_state)$' --verbose --output-on-failure --no-tests=error --output-junit (Join-Path $build 'u2l10-local-roles.xml')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify U2L10 repair and U3L1 U3L2 input dependencies with real MSVC
        shell: pwsh
        run: |
          $build = Join-Path $env:RUNNER_TEMP 'lgaed-course-edition-qa'
          ctest --test-dir $build -R '^native[.]continued_input_dependency_state$' --verbose --output-on-failure --no-tests=error --output-junit (Join-Path $build 'continued-input-dependency.xml')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify U2L9 input dependencies and preserved history with real MSVC
        shell: pwsh
        run: |
          $build = Join-Path $env:RUNNER_TEMP 'lgaed-course-edition-qa'
          ctest --test-dir $build -R '^native[.]input_(probe|dependency_state)$' --verbose --output-on-failure --no-tests=error --output-junit (Join-Path $build 'u2l9-input-dependency.xml')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify current and archived U2L9 input controls and first-case access
        shell: pwsh
        run: |
          $build = Join-Path $env:RUNNER_TEMP 'lgaed-course-edition-qa'
          ctest --test-dir $build -R '^native[.](curricular_input_lab(_history)?|prepared_input_predictions(_history)?)$' --verbose --output-on-failure --no-tests=error --output-junit (Join-Path $build 'u2l9-current-history-view.xml')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Execute edition replacement, native quiz, scoped reset and reopen
        shell: pwsh
        run: |
          $build = Join-Path $env:RUNNER_TEMP 'lgaed-course-edition-qa'
          ctest --test-dir $build -R '^native\.course_edition$' --verbose --output-on-failure --no-tests=error --output-junit (Join-Path $build 'course-edition-runtime.xml')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Execute real arrayRunsV1 model and Win32 empty-text controls
        shell: pwsh
        run: |
          $build = Join-Path $env:RUNNER_TEMP 'lgaed-course-edition-qa'
          ctest --test-dir $build -R '^native\.simulation_(model|empty_text_controls|empty_text_lesson)$' --verbose --output-on-failure --no-tests=error --output-junit (Join-Path $build 'simulation-empty-text-runtime.xml')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Execute actual Win32 compiler with first case required and twelve optional
        shell: pwsh
        run: |
          $build = Join-Path $env:RUNNER_TEMP 'lgaed-course-edition-qa'
          ctest --test-dir $build -R '^native\.compiler_puzzles$' --verbose --output-on-failure --no-tests=error --output-junit (Join-Path $build 'compiler-first-case-win32.xml')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify active U2 semantic ranges and both real native compiler reading gates
        shell: pwsh
        run: |
          $build = Join-Path $env:RUNNER_TEMP 'lgaed-course-edition-qa'
          ctest --test-dir $build -R '^native[.](current_u2(_roles|l5_gates)|current_u2l6_native_gates)$' --verbose --output-on-failure --no-tests=error --output-junit (Join-Path $build 'current-u2-win32.xml')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify U2L6 independent reader gates and restored bookmarks
        shell: pwsh
        run: |
          $build = Join-Path $env:RUNNER_TEMP 'lgaed-course-edition-qa'
          ctest --test-dir $build -R '^native[.]current_u2l6_reading_gate$' --verbose --output-on-failure --no-tests=error --output-junit (Join-Path $build 'u2l6-reading-gate.xml')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify six active U2 local-int owners and sealed Windows state
        shell: pwsh
        run: |
          $build = Join-Path $env:RUNNER_TEMP 'lgaed-course-edition-qa'
          ctest --test-dir $build -R '^native[.]current_u2_local_int_state$' --verbose --output-on-failure --no-tests=error --output-junit (Join-Path $build 'u2-local-int-state.xml')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify U2L7 string variables through actual hosted MSVC and StateStore
        shell: pwsh
        run: |
          $build = Join-Path $env:RUNNER_TEMP 'lgaed-course-edition-qa'
          ctest --test-dir $build -R '^native[.]current_u2_local_string_state$' --verbose --output-on-failure --no-tests=error --output-junit (Join-Path $build 'u2-local-string-state.xml')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check nine current inline-fill controls through real Win32 LessonView
        shell: pwsh
        run: |
          $build = Join-Path $env:RUNNER_TEMP 'lgaed-course-edition-qa'
          ctest --test-dir $build -R '^native[.]current_inline_feedback$' --verbose --output-on-failure --no-tests=error --output-junit (Join-Path $build 'inline-feedback-win32.xml')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve historical U6L19 batch without granting new standalone cases
        shell: pwsh
        run: |
          $build = Join-Path $env:RUNNER_TEMP 'lgaed-course-edition-qa'
          ctest --test-dir $build -R '^native[.]u6l19_case_split_state$' --verbose --output-on-failure --no-tests=error --output-junit (Join-Path $build 'u6l19-case-split-state.xml')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Execute real P2 U3 diagnostic and report semantic probes with hosted MSVC
        shell: pwsh
        run: |
          $build = Join-Path $env:RUNNER_TEMP 'lgaed-course-edition-qa'
          ctest --test-dir $build -R '^native[.]u3_runtime_semantics$' --verbose --output-on-failure --no-tests=error --output-junit (Join-Path $build 'u3-runtime-semantic-probes.xml')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check named constants, independent functions and their counterfactuals in U3 with real MSVC
        shell: pwsh
        run: |
          $build = Join-Path $env:RUNNER_TEMP 'lgaed-course-edition-qa'
          ctest --test-dir $build -R '^native[.]u3_named_rules_single_file$' --verbose --output-on-failure --no-tests=error --output-junit (Join-Path $build 'u3-named-rules-win32.xml')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve native test and compile evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hosted-win32-course-edition-${{ github.sha }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            ${{ github.workspace }}/out/qa/reader-revision-audio-${{ github.run_id }}-${{ github.run_attempt }}/*.json
            ${{ github.workspace }}/out/qa/reader-revision-audio-${{ github.run_id }}-${{ github.run_attempt }}/*.log
            ${{ runner.temp }}/lgaed-course-edition-qa/reader-revision-runtime-*/transport.jsonl
            ${{ runner.temp }}/lgaed-course-edition-qa/reader-revision-order.xml
            ${{ runner.temp }}/lgaed-course-edition-qa/u2l9-semantic-composition-and-reference.xml
            ${{ runner.temp }}/lgaed-course-edition-qa/u3-current-controls-and-history.xml
            ${{ runner.temp }}/lgaed-course-edition-qa/choice-prose-and-prediction.xml
            ${{ runner.temp }}/lgaed-course-edition-qa/local-dependency-receipts.xml
            ${{ runner.temp }}/lgaed-course-edition-qa/local-dependency-view.xml
            ${{ runner.temp }}/lgaed-course-edition-qa/u2l10-local-roles.xml
            ${{ runner.temp }}/lgaed-course-edition-qa/continued-input-dependency.xml
            ${{ runner.temp }}/lgaed-course-edition-qa/u2l9-input-dependency.xml
