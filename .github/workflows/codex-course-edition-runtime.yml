  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-puzzle-wheel:
    name: Verify hover wheel routing with the original and repaired puzzle
    if: ${{ github.event_name == 'push' && startsWith(github.event.head_commit.message, 'qa-puzzle-wheel:') }}
    runs-on: windows-2025-vs2026
    timeout-minutes: 20
    steps:
      - name: Read exact Codex revision and original wheel implementation
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select Python for existing hosted configuration
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Activate hosted MSVC without modifying the product pin
        uses: ilammy/msvc-dev-cmd@v1
      - name: Reproduce the missing puzzle wheel handoff on the original source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $qaWheelBuild = Join-Path $env:RUNNER_TEMP 'lgaed-puzzle-wheel-qa'
          cmake -S cmake/HostedCourseEditionQA -B $qaWheelBuild -G Ninja -DCMAKE_BUILD_TYPE=Debug
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          try {
            git restore --source=d09a465e380375eefaae690a2d1d088a70e2dddf --worktree -- native/presentation/windows/cpp_fill_view.cpp
            if ($LASTEXITCODE -ne 0) { throw 'Cannot select the authenticated original wheel source.' }
            cmake --build $qaWheelBuild --target lgaed_inline_feedback_view_tests --parallel 3
            if ($LASTEXITCODE -ne 0) { throw 'Original source failed to compile; this does not reproduce the wheel defect.' }
            ctest --test-dir $qaWheelBuild -R '^native[.]puzzle_wheel$' --verbose --output-on-failure --no-tests=error --output-junit (Join-Path $qaWheelBuild 'puzzle-wheel-original.xml')
            $qaOriginalExit = $LASTEXITCODE
            $qaOriginalLog = Join-Path $qaWheelBuild 'Testing/Temporary/LastTest.log'
            Copy-Item $qaOriginalLog (Join-Path $qaWheelBuild 'puzzle-wheel-original.log')
            if ($qaOriginalExit -eq 0 -or (Get-Content $qaOriginalLog -Raw) -notmatch 'Puzzle wheel .*did not scroll the lesson') {
              throw 'The original source did not reproduce the exact missing vertical wheel handoff.'
            }
          } finally {
            git restore --source=HEAD --worktree -- native/presentation/windows/cpp_fill_view.cpp
            if ($LASTEXITCODE -ne 0) { throw 'Cannot restore the published wheel repair.' }
          }
      - name: Verify repaired hover scrolling, compiler handoff, zoom and header
        shell: pwsh
        run: |
          $qaWheelBuild = Join-Path $env:RUNNER_TEMP 'lgaed-puzzle-wheel-qa'
          cmake --build $qaWheelBuild --target lgaed_inline_feedback_view_tests --parallel 3
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir $qaWheelBuild -R '^native[.](puzzle_wheel|lesson_header)$' --verbose --output-on-failure --no-tests=error --output-junit (Join-Path $qaWheelBuild 'puzzle-wheel-fixed.xml')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve original failure and repaired native behavior
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hosted-win32-puzzle-wheel-${{ github.sha }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/lgaed-puzzle-wheel-qa/puzzle-wheel-*.xml
            ${{ runner.temp }}/lgaed-puzzle-wheel-qa/puzzle-wheel-original.log
            ${{ runner.temp }}/lgaed-puzzle-wheel-qa/Testing/Temporary/*.log
            ${{ runner.temp }}/lgaed-puzzle-wheel-qa/CMakeFiles/CMakeConfigureLog.yaml
  # Explicitly selected pushes validate only the changed header/input contracts.
  # Ordinary pushes and workflow_dispatch retain the complete default jobs below.
  run-input-decisions:
    name: Verify focused Win32 lesson header and input-decision contracts
    if: ${{ github.event_name == 'push' && startsWith(github.event.head_commit.message, 'qa-input-decisions:') }}
    runs-on: windows-2025-vs2026
    timeout-minutes: 30
    steps:
      - name: Read exact Codex revision and authenticated fixture history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select Python for authenticated input fixtures
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Activate hosted MSVC without modifying the product pin
        uses: ilammy/msvc-dev-cmd@v1
      - name: Build the original header and input contract targets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host 'Focused hosted QA only; product MSVC 14.51.36231 and cl.exe 19.51.36260.0 remain unchanged.'
          Get-Command cl, cmake, ninja | Select-Object Name, Source | Format-Table | Out-Host
          $qaInputBuild = Join-Path $env:RUNNER_TEMP 'lgaed-input-decisions-qa'
          cmake -S cmake/HostedCourseEditionQA -B $qaInputBuild -G Ninja -DCMAKE_BUILD_TYPE=Debug
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build $qaInputBuild --target lgaed_inline_feedback_view_tests lgaed_input_dependency_state_tests lgaed_input_probe_tests lgaed_local_dependency_view_tests --parallel 3
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify the header, preserved input contract and eight decision editors
        shell: pwsh
        run: |
          $qaInputBuild = Join-Path $env:RUNNER_TEMP 'lgaed-input-decisions-qa'
          ctest --test-dir $qaInputBuild -R '^native[.](lesson_header|input_probe|input_dependency_(state|authoring)|input_decision_authoring|input_decisions_view_(u3l[3-8]|u4l[1-2]))$' --verbose --output-on-failure --no-tests=error --output-junit (Join-Path $qaInputBuild 'input-decisions-focal.xml')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve focused native test and compile evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hosted-win32-input-decisions-${{ github.sha }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/lgaed-input-decisions-qa/input-decisions-focal.xml
            ${{ runner.temp }}/lgaed-input-decisions-qa/Testing/Temporary/*.log
            ${{ runner.temp }}/lgaed-input-decisions-qa/CMakeFiles/CMakeConfigureLog.yaml
            ${{ runner.temp }}/lgaed-input-decisions-qa/test-fixtures/input-decisions/**
            ${{ runner.temp }}/lgaed-input-decisions-qa/test-fixtures/u2l9-input/**
  run-guarded-arithmetic:
    name: Verify safe short-circuit observations and preserved Win32 receipts
    if: ${{ github.event_name == 'push' && startsWith(github.event.head_commit.message, 'qa-guarded-arithmetic:') }}
    runs-on: windows-2025-vs2026
    timeout-minutes: 25
    steps:
      - name: Read exact Codex revision and authenticated U3L6 publication
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select Python for unchanged and extended authoring contracts
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Activate hosted MSVC without modifying the product pin
        uses: ilammy/msvc-dev-cmd@v1
      - name: Build core, receipt and actual lesson worker checks
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host 'Focused hosted Windows QA; the product toolchain pin is retained.'
          Get-Command cl, cmake, ninja | Select-Object Name, Source | Format-Table | Out-Host
          $qaArithmeticBuild = Join-Path $env:RUNNER_TEMP 'lgaed-guarded-arithmetic-qa'
          cmake -S cmake/HostedCourseEditionQA -B $qaArithmeticBuild -G Ninja -DCMAKE_BUILD_TYPE=Debug
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build $qaArithmeticBuild --target lgaed_guarded_arithmetic_core_tests lgaed_guarded_arithmetic_state_tests lgaed_local_dependency_view_tests --parallel 3
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify safe omission, equivalent solutions, historical credit and first-case UI
        shell: pwsh
        run: |
          $qaArithmeticBuild = Join-Path $env:RUNNER_TEMP 'lgaed-guarded-arithmetic-qa'
          ctest --test-dir $qaArithmeticBuild -R '^native[.](guarded_arithmetic_(core|authoring|state|view)|joint_local_int_authoring)$' --verbose --output-on-failure --no-tests=error --output-junit (Join-Path $qaArithmeticBuild 'guarded-arithmetic.xml')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve focused arithmetic and state evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hosted-win32-guarded-arithmetic-${{ github.sha }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/lgaed-guarded-arithmetic-qa/guarded-arithmetic.xml
            ${{ runner.temp }}/lgaed-guarded-arithmetic-qa/Testing/Temporary/*.log
            ${{ runner.temp }}/lgaed-guarded-arithmetic-qa/CMakeFiles/CMakeConfigureLog.yaml
            ${{ runner.temp }}/lgaed-guarded-arithmetic-qa/test-fixtures/guarded-arithmetic/**
  run-joint-admission:
    name: Verify joint U3L5 admission decisions and preserved Win32 receipts
    if: ${{ github.event_name == 'push' && startsWith(github.event.head_commit.message, 'qa-joint-admission:') }}
    runs-on: windows-2025-vs2026
    timeout-minutes: 25
    steps:
      - name: Read exact Codex revision and authenticated joint publications
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select Python for joint authoring contracts and fixtures
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Activate hosted MSVC without modifying the product pin
        uses: ilammy/msvc-dev-cmd@v1
      - name: Build the original Windows local dependency controls
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host 'Focused hosted Windows QA; the product toolchain pin is retained.'
          Get-Command cl, cmake, ninja | Select-Object Name, Source | Format-Table | Out-Host
          $qaAdmissionBuild = Join-Path $env:RUNNER_TEMP 'lgaed-joint-admission-qa'
          cmake -S cmake/HostedCourseEditionQA -B $qaAdmissionBuild -G Ninja -DCMAKE_BUILD_TYPE=Debug
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build $qaAdmissionBuild --target lgaed_local_dependency_view_tests --parallel 3
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify joint admission observations and historical first-case access
        shell: pwsh
        run: |
          $qaAdmissionBuild = Join-Path $env:RUNNER_TEMP 'lgaed-joint-admission-qa'
          ctest --test-dir $qaAdmissionBuild -R '^native[.]joint_local_int_(authoring|admission_view)$' --verbose --output-on-failure --no-tests=error --output-junit (Join-Path $qaAdmissionBuild 'joint-admission.xml')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve focused joint admission and fixture evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hosted-win32-joint-admission-${{ github.sha }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/lgaed-joint-admission-qa/joint-admission.xml
            ${{ runner.temp }}/lgaed-joint-admission-qa/Testing/Temporary/*.log
            ${{ runner.temp }}/lgaed-joint-admission-qa/CMakeFiles/CMakeConfigureLog.yaml
            ${{ runner.temp }}/lgaed-joint-admission-qa/test-fixtures/joint-local-int/**
  run-format-fixture-history:
    name: Build authenticated format fixtures and verify original MSVC diagnostics
    if: ${{ github.event_name != 'push' || (!startsWith(github.event.head_commit.message, 'qa-input-decisions:') && !startsWith(github.event.head_commit.message, 'qa-puzzle-wheel:') && !startsWith(github.event.head_commit.message, 'qa-guarded-arithmetic:') && !startsWith(github.event.head_commit.message, 'qa-joint-admission:')) }}
    runs-on: windows-2025-vs2026
    timeout-minutes: 25
    steps:
      - name: Read complete Codex and Work publication history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select Python for the three original fixture generators
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Activate hosted MSVC without modifying the product pin
        uses: ilammy/msvc-dev-cmd@v1
      - name: Configure the original Windows loaders and diagnostic runner
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host 'Hosted QA only; product MSVC 14.51.36231 and cl.exe 19.51.36260.0 remain unchanged.'
          Get-Command cl, cmake, ninja | Select-Object Name, Source | Format-Table | Out-Host
          $qaFormatBuild = Join-Path $env:RUNNER_TEMP 'lgaed-format-fixture-history'
          cmake -S cmake/HostedCourseEditionQA -B $qaFormatBuild -G Ninja -DCMAKE_BUILD_TYPE=Debug
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build $qaFormatBuild --target lgaed_code_format_loader_tests lgaed_format_fixture_diagnostics_msvc_tests --parallel 3
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify both full publications, canonical archives and real diagnostics
        shell: pwsh
        run: |
          $qaFormatBuild = Join-Path $env:RUNNER_TEMP 'lgaed-format-fixture-history'
          ctest --test-dir $qaFormatBuild -R '^native[.]format_fixture_' --verbose --output-on-failure --no-tests=error --output-junit (Join-Path $qaFormatBuild 'format-fixture-history.xml')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve fixture and native diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hosted-format-fixture-history-${{ github.sha }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/lgaed-format-fixture-history/format-fixture-history.xml
            ${{ runner.temp }}/lgaed-format-fixture-history/Testing/Temporary/LastTest.log
            ${{ runner.temp }}/lgaed-format-fixture-history/CMakeFiles/CMakeConfigureLog.yaml
            ${{ runner.temp }}/lgaed-format-fixture-history/test-fixtures/format-history/**
  run-real-course-edition:
    name: Run Win32 edition, simulation and first required C++ case
    if: ${{ github.event_name != 'push' || (!startsWith(github.event.head_commit.message, 'qa-input-decisions:') && !startsWith(github.event.head_commit.message, 'qa-puzzle-wheel:') && !startsWith(github.event.head_commit.message, 'qa-guarded-arithmetic:') && !startsWith(github.event.head_commit.message, 'qa-joint-admission:')) }}
    runs-on: windows-2025-vs2026
    timeout-minutes: 45
    steps:
      - name: Read the exact Codex revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select Python for original edition fixtures
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Activate hosted MSVC without modifying the product pin
        uses: ilammy/msvc-dev-cmd@v1
      - name: Identify the separate hosted build tools
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host 'Hosted QA only; the product MSVC and SDK pins are untouched.'
          Get-Command cl, cmake, ninja | Select-Object Name, Source | Format-Table | Out-Host
          cmake --version
          ninja --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # Real playback needs an active render endpoint. Reuse the project's
      # signed-device evaluation only for an explicitly selected automatic push.
      - name: Prepare the signed endpoint for this reader evaluation
        if: startsWith(github.event.head_commit.message, 'qa-reader-order:')
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($qaServiceName in @('AudioEndpointBuilder', 'Audiosrv')) {
            $qaService = Get-Service -Name $qaServiceName -ErrorAction Stop
            $qaService | Select-Object Name, Status, StartType | Format-Table | Out-Host
            if ($qaService.StartType -eq 'Disabled') { throw "Audio service is disabled: $qaServiceName" }
            if ($qaService.Status -eq 'Stopped') {
              $qaService.Start()
              $qaService.WaitForStatus('Running', [TimeSpan]::FromSeconds(15))
              $qaService.Refresh()
            }
            if ($qaService.Status -ne 'Running') { throw "Audio service is not running: $qaServiceName" }
          }
          $qaSdkVersion = $env:WindowsSDKVersion.TrimEnd([char[]]'\/')
          if ($qaSdkVersion -notmatch '^\d+\.\d+\.\d+\.\d+$') { throw 'The activated SDK version is invalid.' }
          $qaSignTool = Join-Path $env:WindowsSdkDir "bin\$qaSdkVersion\x64\signtool.exe"
          if (-not (Test-Path -LiteralPath $qaSignTool -PathType Leaf)) { throw 'The activated SDK SignTool is absent.' }
          Get-Item -LiteralPath $qaSignTool | Select-Object FullName, @{Name='Version';Expression={$_.VersionInfo.FileVersion}} | Format-Table | Out-Host
          $qaPython = (Get-Command python.exe -CommandType Application | Select-Object -First 1).Source
          $qaAudioLog = Join-Path $env:GITHUB_WORKSPACE ('out\qa\reader-revision-audio-{0}-{1}' -f $env:GITHUB_RUN_ID, $env:GITHUB_RUN_ATTEMPT)
          & .\scripts\windows\Prepare-VirtualAudioCI.ps1 -PythonPath $qaPython -SignToolPath $qaSignTool -LogDirectory $qaAudioLog
