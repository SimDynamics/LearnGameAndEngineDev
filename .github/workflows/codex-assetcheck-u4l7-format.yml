name: Codex AssetCheck U4L7 authentic format and history

on:
  push:
    branches: [Codex]
    paths:
      - .github/workflows/codex-assetcheck-u4l7-format.yml
      - scripts/curriculum/test_assetcheck_u4l7_source_format.py
      - scripts/curriculum/stable_state_layout.py
      - scripts/curriculum/code_format_compat.py
      - app/src/main/assets/content/es/programming/programming_practice_tools/proyecto_assetcheck/lesson_disenar_probar_y_presentar_variante_propia.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-assetcheck-history:
    name: Real owners, archived formats and current lesson (Python)
    runs-on: windows-2022
    timeout-minutes: 10
    env:
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.longpaths
      GIT_CONFIG_VALUE_0: 'true'
    steps:
      - name: Read full published history in exact Codex revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select Python for native Windows QA
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test all pinned publications, real current owners and rejected mutations
        run: >
          python -B -m unittest discover
          -s scripts/curriculum
          -p test_assetcheck_u4l7_source_format.py -v
