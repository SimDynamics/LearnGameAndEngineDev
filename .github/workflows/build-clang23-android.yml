name: Build Clang 23.1.3 Android ARM64

# Experimental only. Never changes the Android app or an existing compiler.
on:
  # workflow_dispatch is only directly available from GitHub's default branch.
  # For this isolated feature branch, push an empty commit with [build-clang23].
  push:
    branches:
      - fix/cpp-stdin-support
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Cross-compile LLVM/Clang 23.1.3 for Android ARM64
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[build-clang23]')
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Install host build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends cmake ninja-build git python3 make

      - name: Select installed Android NDK
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ANDROID_HOME"
          NDK="$(find "$ANDROID_HOME/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -f "$NDK/build/cmake/android.toolchain.cmake"
          echo "ANDROID_NDK=$NDK" >> "$GITHUB_ENV"
          echo "NDK selected: $(basename "$NDK")"

      - name: Fetch exact LLVM release tag
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch llvmorg-23.1.3 \
            https://github.com/llvm/llvm-project.git llvm-src
          git -C llvm-src describe --tags --exact-match
          git -C llvm-src rev-parse HEAD | tee llvm-source-commit.txt

      - name: Build Linux host table generators
        shell: bash
        run: |
          set -euo pipefail
          cmake -S llvm-src/llvm -B build-host -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_ENABLE_PROJECTS="clang" \
            -DLLVM_TARGETS_TO_BUILD="WebAssembly;AArch64" \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_INCLUDE_EXAMPLES=OFF \
            -DLLVM_INCLUDE_BENCHMARKS=OFF \
            -DLLVM_ENABLE_ZLIB=OFF \
            -DLLVM_ENABLE_ZSTD=OFF \
            -DLLVM_ENABLE_TERMINFO=OFF \
            -DLLVM_ENABLE_LIBXML2=OFF
          cmake --build build-host --parallel 2 --target llvm-tblgen clang-tblgen
          test -x build-host/bin/llvm-tblgen
          test -x build-host/bin/clang-tblgen

      - name: Configure Android ARM64 cross-build
        shell: bash
        run: |
          set -euo pipefail
          cmake -S llvm-src/llvm -B build-android -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=MinSizeRel \
            -DLLVM_ENABLE_PROJECTS="clang;lld" \
            -DLLVM_TARGETS_TO_BUILD="WebAssembly;AArch64" \
            -DLLVM_TABLEGEN="$GITHUB_WORKSPACE/build-host/bin/llvm-tblgen" \
            -DCLANG_TABLEGEN="$GITHUB_WORKSPACE/build-host/bin/clang-tblgen" \
            -DLLVM_DEFAULT_TARGET_TRIPLE=wasm32-wasip1 \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_INCLUDE_EXAMPLES=OFF \
            -DLLVM_INCLUDE_BENCHMARKS=OFF \
            -DCLANG_INCLUDE_TESTS=OFF \
            -DLLD_INCLUDE_TESTS=OFF \
            -DLLVM_ENABLE_ASSERTIONS=OFF \
            -DLLVM_ENABLE_ZLIB=OFF \
            -DLLVM_ENABLE_ZSTD=OFF \
            -DLLVM_ENABLE_TERMINFO=OFF \
            -DLLVM_ENABLE_LIBXML2=OFF \
            -DLLVM_ENABLE_LIBEDIT=OFF \
            -DLLVM_ENABLE_RTTI=OFF \
            -DLLVM_BUILD_LLVM_DYLIB=OFF \
            -DLLVM_LINK_LLVM_DYLIB=OFF \
            -DLLVM_PARALLEL_LINK_JOBS=1

      - name: Build Android Clang and LLD
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build-android --parallel 2 --target clang lld
          test -f build-android/bin/clang
          test -f build-android/bin/lld

      - name: Inspect and package ARM64 binaries
        shell: bash
        run: |
          set -euo pipefail
          NDK_BIN="$ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          mkdir -p dist
          # These are Android PIE executables named lib*.so only so that an
          # APK may extract them into its nativeLibraryDir; NOT JNI libraries.
          cp build-android/bin/clang dist/liblgp_clang23.so
          cp build-android/bin/lld dist/liblgp_lld23.so
          "$NDK_BIN/llvm-strip" dist/liblgp_clang23.so dist/liblgp_lld23.so
          for lib in dist/liblgp_clang23.so dist/liblgp_lld23.so; do
            "$NDK_BIN/llvm-readelf" -h "$lib" > "$lib.elf-header.txt"
            "$NDK_BIN/llvm-readelf" -d "$lib" > "$lib.dynamic.txt"
            grep -q 'Machine:.*AArch64' "$lib.elf-header.txt"
            grep -q 'Type:.*DYN' "$lib.elf-header.txt"
            if grep -Eq 'NEEDED.*(libc\.so\.6|libstdc\+\+\.so\.6|ld-linux)' "$lib.dynamic.txt"; then
              echo "ERROR: Linux/glibc dependency in $lib" >&2
              exit 1
            fi
          done
          cp llvm-source-commit.txt dist/
          cat > dist/README.txt <<'EOF'
          EXPERIMENTAL LLVM/CLANG 23.1.3 ANDROID ARM64 SOURCE BUILD.
          Native executables liblgp_clang23.so and liblgp_lld23.so.
          Not yet run or validated on an Android device.
          Keep Clang 21 as the default; do not enable exceptions yet.
          EOF
          (cd dist && sha256sum liblgp_clang23.so liblgp_lld23.so > SHA256SUMS)
          tar -czf clang-23.1.3-android-arm64-EXPERIMENTAL.tar.gz -C dist .

      - name: Upload compiler artifact for Android testing
        uses: actions/upload-artifact@v4
        with:
          name: clang-23.1.3-android-arm64-experimental
          path: clang-23.1.3-android-arm64-EXPERIMENTAL.tar.gz
          if-no-files-found: error
          retention-days: 7
