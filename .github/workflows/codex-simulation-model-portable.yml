name: Codex portable array-runs model (GCC and Clang)

on:
  push:
    branches: [Codex]
    paths:
      - .github/workflows/codex-simulation-model-portable.yml
      - native/core/simulation.cpp
      - native/core/simulation.hpp
      - native/core/simulation_tests.cpp
  workflow_dispatch:

permissions:
  contents: read

jobs:
  model:
    name: Array-runs core tests (${{ matrix.compiler }})
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
    steps:
      - name: Check out the exact Codex revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build real native array-runs model in strict C++23
        env:
          CXX: ${{ matrix.compiler }}
        run: |
          "$CXX" --version
          "$CXX" -std=c++23 -Wall -Wextra -Werror -pedantic -Inative \
            native/core/simulation.cpp native/core/simulation_tests.cpp \
            -o "${RUNNER_TEMP}/lgaed_simulation_model_tests"
      - name: Verify groups, empty strings, spaces, JSON input and bounds
        run: "${RUNNER_TEMP}/lgaed_simulation_model_tests"
