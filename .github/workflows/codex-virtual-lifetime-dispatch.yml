name: Codex U8L6 genuine virtual dispatch through object lifetime

on:
  push:
    branches: [Codex]
    paths:
      - .github/workflows/codex-virtual-lifetime-dispatch.yml
      - scripts/curriculum/test_cpp_virtual_lifetime_dispatch.py
      - scripts/curriculum/test_cpp_virtual_lifetime_dispatch_core.py
      - scripts/curriculum/test_cpp_virtual_lifetime_dispatch_authoring.py
      - scripts/curriculum/stable_state_layout.py
      - native/core/cpp_virtual_lifetime_dispatch_check.hpp
      - native/core/cpp_class_structure_check.hpp
      - native/core/cpp_virtual_lifetime_dispatch_check_tests.cpp
      - native/core/cpp_multi_body_check.hpp
      - app/src/main/assets/content/es/programming/cpp_language_memory_oop/composicion_y_herencia_publica/lesson_seguir_llamadas_virtuales_durante_construccion_y_destruccion.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-msvc:
    name: Actual virtual base/derived phases in MSVC C++23
    runs-on: windows-2022
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Prove U8L6 virtual dispatch in independent real Windows executables
        shell: cmd
        run: |
          python -B scripts\curriculum\test_cpp_virtual_lifetime_dispatch.py --compiler cl --windows
          if errorlevel 1 exit /b 1
          python -B scripts\curriculum\test_cpp_virtual_lifetime_dispatch_core.py --compiler cl --windows
          if errorlevel 1 exit /b 1
          python -B -m unittest discover -s scripts\curriculum -p test_cpp_virtual_lifetime_dispatch_authoring.py -v
          if errorlevel 1 exit /b 1
