name: Codex named-rule checks (Windows MSVC and contracts)

on:
  push:
    branches: [Codex]
    paths:
      - native/core/named_rule_check.hpp
      - native/core/cpp_multi_body_check.hpp
      - native/core/cpp_member_body_check.hpp
      - native/core/cpp_multi_body_check_tests.cpp
      - native/core/cpp_member_body_check_tests.cpp
      - native/core/named_rule_battery_check.hpp
      - native/core/named_rule_constant_variation_check.hpp
      - native/core/named_rule_check_tests.cpp
      - native/core/code_format_compat.hpp
      - scripts/curriculum/stable_state_layout.py
      - scripts/curriculum/test_named_rule_checks.py
      - scripts/curriculum/published_adoption_fixtures.py
      - scripts/curriculum/published_adoption_pins.json
      - scripts/curriculum/compiler_case_revision_fixture_source.py
      - scripts/curriculum/code_format_compat.py
      - scripts/curriculum/text_semantics.py
      - scripts/curriculum/image_resources.py
      - scripts/curriculum/bibliography_revision.py
      - app/src/main/assets/content/es/programming/programming_practice_tools/comprobaciones_repetibles/lesson_nombrar_reglas_y_separar_acuerdos.json
      - .github/workflows/named-rule-core-codex.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  named-rule-contracts:
    runs-on: windows-2022
    timeout-minutes: 10
    env:
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.longpaths
      GIT_CONFIG_VALUE_0: 'true'
    steps:
      - name: Fetch exact Codex revision and named-rule publication history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python 3.12 for Windows contract checks
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify opt-in variations and published lesson preservation
        run: python -B -m unittest discover -s scripts/curriculum -p test_named_rule_checks.py -v

  named-rule-msvc:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - name: Fetch exact Codex revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare Visual C++ toolchain
        uses: ilammy/msvc-dev-cmd@v1
      - name: Compile portable core tests with MSVC
        shell: cmd
        run: |
          cl /nologo /std:c++latest /EHsc /W4 /WX /permissive- /Zc:__cplusplus /utf-8 /I native native\core\named_rule_check_tests.cpp /Fe:"%RUNNER_TEMP%\lgaed_named_rule_core_tests.exe"
          if errorlevel 1 exit /b %errorlevel%
          cl /nologo /std:c++latest /EHsc /W4 /WX /permissive- /Zc:__cplusplus /utf-8 /I native native\core\cpp_member_body_check_tests.cpp /Fe:"%RUNNER_TEMP%\lgaed_member_body_core_tests.exe"
          if errorlevel 1 exit /b %errorlevel%
          cl /nologo /std:c++latest /EHsc /W4 /WX /permissive- /Zc:__cplusplus /utf-8 /I native native\core\cpp_multi_body_check_tests.cpp /Fe:"%RUNNER_TEMP%\lgaed_multi_body_core_tests.exe"
      - name: Run MSVC named-rule regressions
        shell: cmd
        run: |
          "%RUNNER_TEMP%\lgaed_named_rule_core_tests.exe"
          if errorlevel 1 exit /b %errorlevel%
          "%RUNNER_TEMP%\lgaed_member_body_core_tests.exe"
          if errorlevel 1 exit /b %errorlevel%
          "%RUNNER_TEMP%\lgaed_multi_body_core_tests.exe"
