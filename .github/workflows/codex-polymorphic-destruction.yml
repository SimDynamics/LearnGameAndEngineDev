name: Codex U8L5 polymorphic ownership and complete destruction

on:
  push:
    branches: [Codex]
    paths:
      - .github/workflows/codex-polymorphic-destruction.yml
      - scripts/curriculum/test_cpp_polymorphic_destruction.py
      - app/src/main/assets/content/es/programming/cpp_language_memory_oop/composicion_y_herencia_publica/lesson_destruir_una_derivada_mediante_la_base.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable:
    name: Original U8L5 derived ownership and destruction with GCC and Clang
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Check independent polymorphic destructors and counterexamples
        run: |
          for compiler in g++ clang++; do
            python3 -B scripts/curriculum/test_cpp_polymorphic_destruction.py \
              --compiler "$compiler"
          done

  windows-msvc:
    name: Original U8L5 derived ownership and destruction with MSVC
    runs-on: windows-2022
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Check polymorphic deletion and preserved owner with Windows MSVC
        shell: cmd
        run: |
          python -B scripts\curriculum\test_cpp_polymorphic_destruction.py --compiler cl --windows
