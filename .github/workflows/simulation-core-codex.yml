name: Codex portable array simulation model (GCC, Clang and MSVC)

on:
  push:
    branches: [Codex]
    paths:
      - .github/workflows/simulation-core-codex.yml
      - cmake/PortableSimulationViewQA/CMakeLists.txt
      - native/core/lesson.hpp
      - native/core/lesson.cpp
      - native/core/simulation.hpp
      - native/core/simulation.cpp
      - native/core/simulation_tests.cpp
      - native/presentation/windows/simulation_view.cpp
      - native/presentation/windows/simulation_view_tests.cpp
      - scripts/curriculum/simulation.py
      - scripts/curriculum/test_simulation.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authoring-contracts:
    name: Authoring and parser contracts (Python)
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - name: Read exact Codex revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate source, scenarios and input contracts
        run: python3 -B -m unittest discover -s scripts/curriculum -p test_simulation.py -v

  portable-model:
    name: Portable C++ simulation (${{ matrix.compiler }})
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
    steps:
      - name: Read exact Codex revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build model and exhaustive replay regressions
        env:
          CXX: ${{ matrix.compiler }}
        run: |
          "$CXX" --version
          "$CXX" -std=c++23 -Wall -Wextra -Werror -pedantic -Inative \
            native/core/simulation.cpp native/core/simulation_tests.cpp \
            -o "${RUNNER_TEMP}/lgaed_simulation_model_tests"
      - name: Execute model, UTF-8, empty-text, overflow and session checks
        run: "${RUNNER_TEMP}/lgaed_simulation_model_tests"

  portable-model-msvc:
    # These portable C++ assertions run on Windows, but do NOT replace
    # the separately pinned MSVC 14.51/SDK 28000 full Win32 GUI tests.
    name: Portable C++ simulation (Windows MSVC)
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - name: Read exact Codex revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Activate Visual C++ on disposable runner
        uses: ilammy/msvc-dev-cmd@v1
      - name: Build portable model without GUI or pinned native dependencies
        shell: cmd
        run: >
          cl /nologo /std:c++latest /EHsc /W4 /WX /permissive-
          /Zc:__cplusplus /utf-8 /I native
          native\core\simulation.cpp native\core\simulation_tests.cpp
          /Fe:"%RUNNER_TEMP%\lgaed_simulation_model_tests.exe"
      - name: Execute the exact portable model regressions on Windows
        shell: cmd
        run: '"%RUNNER_TEMP%\lgaed_simulation_model_tests.exe"'

  portable-win32-view-compile:
    # The full GUI/reader integration has separately pinned MSVC/SDK tools.
    # This independent check catches Win32 view/test compilation errors on
    # hosted Windows even when that exact full-app toolset is unavailable.
    name: Win32 simulation view and UI regressions compile (MSVC)
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - name: Read exact Codex revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Activate Visual C++ on disposable runner
        uses: ilammy/msvc-dev-cmd@v1
      - name: Compile real simulation view source
        shell: cmd
        run: >
          cl /nologo /std:c++latest /EHsc /W4 /permissive-
          /Zc:__cplusplus /utf-8 /I native
          /DUNICODE /D_UNICODE /DWIN32_LEAN_AND_MEAN /DNOMINMAX
          /D_WIN32_WINNT=0x0A00 /DWINVER=0x0A00 /c
          native\presentation\windows\simulation_view.cpp
          /Fo:"%RUNNER_TEMP%\lgaed_simulation_view.obj"
      - name: Compile actual Win32 interaction regression source
        shell: cmd
        run: >
          cl /nologo /std:c++latest /EHsc /W4 /permissive-
          /Zc:__cplusplus /utf-8 /I native
          /DUNICODE /D_UNICODE /DWIN32_LEAN_AND_MEAN /DNOMINMAX
          /D_WIN32_WINNT=0x0A00 /DWINVER=0x0A00 /c
          native\presentation\windows\simulation_view_tests.cpp
          /Fo:"%RUNNER_TEMP%\lgaed_simulation_view_tests.obj"


  portable-win32-view-run:
    # Real hidden Win32 input controls and model, built with hosted tools.
    # Does not imply the separately pinned full app was built or run.
    name: Full Win32 simulation controls and blank-text regressions (MSVC)
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - name: Read exact Codex revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Activate Visual C++ on disposable runner
        uses: ilammy/msvc-dev-cmd@v1
      - name: Configure isolated native UI test using unchanged production sources
        shell: pwsh
        run: >
          cmake -S cmake/PortableSimulationViewQA
          -B "$env:RUNNER_TEMP/simulation-view-qa"
          -G Ninja
      - name: Compile production simulation view and hidden Win32 regression host
        shell: pwsh
        run: >
          cmake --build "$env:RUNNER_TEMP/simulation-view-qa" --parallel 2
      - name: Execute blank-text button and all original Win32 interaction scenarios
        shell: pwsh
        run: >
          ctest --test-dir "$env:RUNNER_TEMP/simulation-view-qa"
          --output-on-failure --no-tests=error -j 1
