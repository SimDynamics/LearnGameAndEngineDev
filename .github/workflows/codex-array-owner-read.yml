name: Codex U6L10 independent array owner and safe read

on:
  push:
    branches: [Codex]
    paths:
      - .github/workflows/codex-array-owner-read.yml
      - scripts/curriculum/test_cpp_array_owner_read.py
      - scripts/curriculum/test_cpp_array_owner_read_core.py
      - scripts/curriculum/test_cpp_array_owner_read_authoring.py
      - scripts/curriculum/published_adoption_fixtures.py
      - scripts/curriculum/published_adoption_pins.json
      - scripts/curriculum/stable_state_layout.py
      - native/core/cpp_array_owner_read_check.hpp
      - native/core/cpp_class_definition_instrumentation.hpp
      - native/core/cpp_class_structure_check.hpp
      - native/core/cpp_private_probe_neutral.hpp
      - native/core/cpp_array_owner_read_check_tests.cpp
      - app/src/main/assets/content/es/programming/cpp_language_memory_oop/estado_y_ciclo_de_vida_de_clases/lesson_gestionar_arrays_con_unique_ptr_y_cantidad.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-msvc:
    name: Genuine U6L10 arrays and read bounds with Windows MSVC
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Check array new and delete, preserved owner and independent reads
        shell: cmd
        run: |
          python -B scripts\curriculum\test_cpp_array_owner_read.py --compiler cl --windows
          if errorlevel 1 exit /b 1
          python -B scripts\curriculum\test_cpp_array_owner_read_core.py --compiler cl --windows
          if errorlevel 1 exit /b 1
          python -B -m unittest discover -s scripts\curriculum -p test_cpp_array_owner_read_authoring.py -v
          if errorlevel 1 exit /b 1
