name: Codex compatible choice and math prompt editorial review

on:
  push:
    branches: [Codex]
    paths:
      - scripts/curriculum/stable_state_layout.py
      - scripts/curriculum/text_semantics.py
      - scripts/curriculum/test_general_choice_editorial.py
      - scripts/curriculum/test_published_u12_question_editorials.py
      - scripts/curriculum/editorial_fixture_history.py
      - scripts/curriculum/code_format_fixture_source.py
      # Check live descendants when Work publishes compatible editorial changes.
      - app/src/main/assets/content/es/programming/cpp_fundamentals/datos_propios_y_estado_valido/lesson_construir_y_comprobar_un_modelo_de_pedidos.json
      - app/src/main/assets/content/es/programming/cpp_fundamentals/archivos_y_programa_completo/lesson_estado_del_formato_y_flujos_independientes.json
      - app/src/main/assets/content/es/programming/cpp_fundamentals/archivos_y_programa_completo/lesson_leer_un_grupo_con_cierre_propio.json
      - app/src/main/assets/content/en/programming/cpp_fundamentals/archivos_y_programa_completo/lesson_estado_del_formato_y_flujos_independientes.json
      - app/src/main/assets/content/en/programming/cpp_fundamentals/archivos_y_programa_completo/lesson_leer_un_grupo_con_cierre_propio.json
      - app/src/main/assets/content/fr/programming/cpp_fundamentals/archivos_y_programa_completo/lesson_estado_del_formato_y_flujos_independientes.json
      - app/src/main/assets/content/fr/programming/cpp_fundamentals/archivos_y_programa_completo/lesson_leer_un_grupo_con_cierre_propio.json
      - scripts/curriculum/math_prompt_fixture_source.py
      - scripts/curriculum/test_math_prompt_revision.py
      - scripts/windows/Test-NativeCurricularCI.ps1
      - scripts/windows/Prepare-NarrationCITools.ps1
      - scripts/windows/prepare_narration_ci_resources.py
      - native/core/lesson.hpp
      - native/core/lesson.cpp
      - native/core/lesson_page_reach.cpp
      - native/platform/windows/content_loader.cpp
      - native/platform/windows/state_store.cpp
      - native/platform/windows/android_import.cpp
      - native/platform/windows/general_choice_editorial_tests.cpp
      - native/presentation/windows/lesson_view.cpp
      - native/presentation/windows/main.cpp
      - native/presentation/windows/math_puzzle_view.cpp
      - native/presentation/windows/editorial_matching_view_tests.cpp
      - native/narration/worker/build_worker.py
      - cmake/NarrationRuntime.cmake
      - cmake/CurricularWindows.cmake
      - toolchains/windows.versions.json
      - CMakeLists.txt
      - .github/workflows/general-choice-editorial-codex.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compatible-editorial-${{ github.ref }}
  cancel-in-progress: false

jobs:
  general-choice-authoring:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Fetch Codex source and authenticated predecessor
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify original/editorial authoring and protected math contracts
        run: |
          python3 -m py_compile scripts/curriculum/stable_state_layout.py \
            scripts/curriculum/test_general_choice_editorial.py \
            scripts/curriculum/test_published_u12_question_editorials.py \
            scripts/curriculum/editorial_fixture_history.py \
            scripts/curriculum/math_prompt_fixture_source.py \
            scripts/curriculum/test_math_prompt_revision.py
          python3 -B -m unittest discover \
            -s scripts/curriculum -p test_general_choice_editorial.py -v
          python3 -B -m unittest discover \
            -s scripts/curriculum -p test_published_u12_question_editorials.py -v
          python3 -B -m unittest discover \
            -s scripts/curriculum -p test_math_prompt_revision.py -v
  math-prompt-windows:
    name: Preserve math prompt state through real worker and Windows reader
    runs-on: windows-2025-vs2026
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Fetch Codex source and authenticated predecessor
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select the declared Python version
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.15.2'
      - name: Verify math prompt authoring on Windows
        run: python -B -m unittest discover -s scripts/curriculum -p test_math_prompt_revision.py -v
      - name: Verify native and imported math responses with the real worker
        run: .\scripts\windows\Test-NativeCurricularCI.ps1 -Suite MathEditorial
      - name: Preserve the real worker and reader evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-math-prompt-editorial-${{ github.sha }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            out/qa/math-editorial-ci/CMakeFiles/CMakeConfigureLog.yaml
            out/qa/math-editorial-ci/native-build.log
            out/qa/math-editorial-ci/math-editorial-results.xml
            out/qa/math-editorial-ci/math-editorial-results.log
            out/qa/math-editorial-ci/narration-tool-archives.json
            out/qa/math-editorial-ci/narration-resources.log
            out/qa/math-editorial-ci/CTestTestfile.cmake
            out/qa/math-editorial-ci/Testing/Temporary/*.log
            out/narration/worker-stderr.log
