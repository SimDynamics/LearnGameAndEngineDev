name: One-time citation pause verification
on:
  push:
    branches: [Codex]
    paths:
      - .github/workflows/one-time-citation-pause.yml
      - scripts/maintenance/repair_citation_pause.py
permissions:
  contents: write
concurrency:
  group: one-time-citation-pause-Codex
  cancel-in-progress: false
jobs:
  verify-and-publish:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
      - name: Prepare Kotlin for the actual Windows frontend
        shell: pwsh
        run: |
          $folder = Join-Path $env:RUNNER_TEMP 'kotlin-2.2.10'
          $archive = Join-Path $env:RUNNER_TEMP 'kotlin-compiler-2.2.10.zip'
          Invoke-WebRequest 'https://github.com/JetBrains/kotlin/releases/download/v2.2.10/kotlin-compiler-2.2.10.zip' -OutFile $archive
          Expand-Archive $archive -DestinationPath $folder
          "KOTLINC=$folder\kotlinc\bin\kotlinc.bat" >> $env:GITHUB_ENV
      - name: Reproduce spoken citation brackets before applying the fix
        shell: pwsh
        run: |
          python scripts/maintenance/repair_citation_pause.py --stage tests
          if ($LASTEXITCODE -ne 0) { throw 'Regression anchor changed.' }
          $PSNativeCommandUseErrorActionPreference = $false
          $result = & python native/narration/worker/test_windows_symbol_speech.py --kotlinc $env:KOTLINC 2>&1
          $exit = $LASTEXITCODE
          $result | ForEach-Object { Write-Host $_ }
          if ($exit -eq 0 -or ($result -join "`n") -notmatch 'Citation delimiters were spoken') {
            throw 'The original citation bug was not reproduced; refusing an unverified patch.'
          }
          exit 0
      - name: Apply and verify the production fix
        shell: pwsh
        run: |
          python scripts/maintenance/repair_citation_pause.py --stage fix
          if ($LASTEXITCODE -ne 0) { throw 'Production adaptation anchor changed.' }
          python -m py_compile native/narration/worker/build_worker.py
          if ($LASTEXITCODE -ne 0) { throw 'Invalid generator syntax.' }
          python native/narration/worker/test_windows_symbol_speech.py --kotlinc $env:KOTLINC
          if ($LASTEXITCODE -ne 0) { throw 'Production speech regressions failed.' }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'Diff validation failed.' }
      - name: Publish verified repair and remove one-time tooling
        shell: pwsh
        run: |
          $remote = git ls-remote origin refs/heads/Codex
          if ($LASTEXITCODE -ne 0 -or ($remote -split '\s+')[0] -ne $env:GITHUB_SHA) {
            throw 'Codex advanced; no concurrent changes will be overwritten.'
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add native/narration/worker/WindowsNarrationSpeechRules.kt native/narration/worker/build_worker.py native/narration/worker/test_windows_symbol_speech.kt.in
          git rm scripts/maintenance/repair_citation_pause.py .github/workflows/one-time-citation-pause.yml
          if ($LASTEXITCODE -ne 0) { throw 'Could not remove one-time tooling.' }
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { throw 'Staged diff failed validation.' }
          git commit -m 'fix(windows): pause before prose citations without speaking parentheses'
          if ($LASTEXITCODE -ne 0) { throw 'Cannot create verified repair commit.' }
          git push origin HEAD:refs/heads/Codex
          if ($LASTEXITCODE -ne 0) { throw 'Codex advanced; no force push attempted.' }
          git status --short
          git rev-parse HEAD
