name: Contrato curricular de todos los cursos de Programación

on:
  push:
    branches: [Codex, main]
    paths:
      - .github/workflows/programming-multicourse-contract.yml
      - scripts/curriculum/validar_json_programacion.py
      - scripts/curriculum/validate_programming_practice_tools.py
      - scripts/curriculum/test_programming_multicourse_validation.py
      - scripts/curriculum/test_stable_state_layout.py
      - scripts/curriculum/test_order_visual_separators.py
      - scripts/curriculum/test_one_line_order_cards.py
      - scripts/curriculum/format_batch_history.py
      - scripts/curriculum/stable_state_layout.py
      - scripts/curriculum/code_format_compat.py
      - scripts/curriculum/test_code_format_compat.py
      - scripts/curriculum/test_nested_cmake_format.py
      - scripts/curriculum/nested_cmake_format_fixture_source.py
      - scripts/curriculum/published_adoption_fixtures.py
      - scripts/curriculum/published_adoption_pins.json
      - scripts/curriculum/code_scope_presentations.py
      - scripts/curriculum/test_code_scope_presentations.py
      - scripts/curriculum/test_cmake_graph_checks.py
      - scripts/curriculum/test_open_battery_contract.py
      - scripts/curriculum/test_compiler_case_revision.py
      - scripts/curriculum/compiler_case_revision_fixture_source.py
      - scripts/curriculum/test_assetcheck_u4l7_source_format.py
      - scripts/curriculum/test_math_matching_text_compat.py
      - scripts/curriculum/math_matching_text_compat.py
      - scripts/curriculum/test_cpp_indexed_unique_transfer_authoring.py
      - scripts/curriculum/test_p3_ownership_authoring.py
      - scripts/curriculum/text_semantics.py
      - docs/examples/p3_ownership_authoring.json
      - scripts/curriculum/test_general_choice_editorial.py
      - scripts/curriculum/test_p2_math_prompt_general_revision.py
      - scripts/curriculum/test_published_u12_question_editorials.py
      - scripts/curriculum/test_real_code_format_pilot.py
      - app/src/main/assets/content/en/programming/cpp_fundamentals/expresiones_y_decisiones/lesson_construir_decisiones_desde_un_problema.json
      - app/src/main/assets/content/fr/programming/cpp_fundamentals/expresiones_y_decisiones/lesson_construir_decisiones_desde_un_problema.json
      - scripts/curriculum/test_p2_u3_workflow_declaration.py
      - scripts/curriculum/test_u3_rejection_runtime_contract.py
      - scripts/curriculum/test_u3_observation_runtime_contract.py
      - scripts/curriculum/test_u3_assertion_runtime_contract.py
      - scripts/curriculum/test_named_rule_checks.py
      - scripts/curriculum/test_locale_origin_diagnostic.py
      - scripts/curriculum/diagnosticar_estado_multicurso.py
      - scripts/curriculum/test_diagnosticar_estado_multicurso.py
      - scripts/curriculum/auditar_estructura_multicurso.py
      - scripts/curriculum/test_auditar_estructura_multicurso.py
      - app/src/main/assets/content/es/programming/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-programming-courses:
    runs-on: windows-2022
    env:
      PYTHONPATH: scripts/curriculum
      # Git for Windows cannot inspect historical lesson blobs with paths
      # longer than MAX_PATH unless long paths are enabled in its own child
      # process configuration. Never change the runner/global Git settings.
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.longpaths
      GIT_CONFIG_VALUE_0: 'true'
    timeout-minutes: 25
    steps:
      - name: Obtener publicación y mapas históricos auténticos
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select Python and native MSVC tools on Windows
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Enable MSVC C++23 without changing the product-pinned toolchain
        uses: ilammy/msvc-dev-cmd@v1
      - name: Comprobar reglas estructurales y revisiones editoriales de cursos presentes y futuros
        run: |
          python -B -m unittest -v test_programming_multicourse_validation
      - name: Conservar regresiones previas del mapa de estado
        run: |
          python -B -m unittest -v test_stable_state_layout
      - name: Probar formato físico C++ y CMake sin alterar el progreso histórico
        run: |
          python -B -m unittest -v test_code_format_compat
      - name: Componer revisiones independientes de casos U3L2 con su formato histórico CMake
        run: |
          python -B -m unittest -v test_nested_cmake_format.NestedCmakeFormat.test_u3l2_two_case_revisions_preserve_other_nested_cmake_formats
      # Validate the same historical/adopted authoring contracts on Work
      # publications, not only on Codex-specific native or prefixed QA runs.
      # Select the affected course; shared validator changes run the whole
      # group. This step does not build the native application.
      - name: Verificar adopción de contratos y publicaciones auténticas afectadas
        shell: pwsh
        env:
          LGAED_ADOPTION_BASE: ${{ github.event.before }}
        run: |
          $ErrorActionPreference = 'Stop'
          $before = $env:LGAED_ADOPTION_BASE
          $all = $env:GITHUB_EVENT_NAME -ne 'push' -or $before -notmatch '^[0-9a-f]{40}$' -or $before -eq ('0' * 40)
          $changed = @()
          if (-not $all) {
            $changed = @(git diff --name-only --no-renames $before HEAD)
            if ($LASTEXITCODE -ne 0) { throw 'Cannot determine the published adoption scope.' }
          }
          $shared = $all -or [bool]($changed -match '^\.github/workflows/programming-multicourse-contract\.yml$|^scripts/curriculum/(stable_state_layout|validar_json_programacion|validate_programming_practice_tools|code_format_compat|text_semantics|published_adoption_fixtures)\.py$|^scripts/curriculum/published_adoption_pins\.json$')
          $tests = @()
          if ($shared -or [bool]($changed -match '^app/src/main/assets/content/es/programming/cpp_fundamentals/edition_es_1__expresiones_y_decisiones/lesson_alternativas_y_fronteras\.json$|^scripts/curriculum/(code_scope_presentations|test_code_scope_presentations)\.py$')) {
            $tests += 'test_code_scope_presentations.CodeScopePresentationTest'
          }
          if ($shared -or [bool]($changed -match '^app/src/main/assets/content/(es|en|fr)/programming/programming_practice_tools/|^scripts/curriculum/(test_cmake_graph_checks|test_open_battery_contract|test_compiler_case_revision|compiler_case_revision_fixture_source|test_assetcheck_u4l7_source_format|test_math_matching_text_compat|math_matching_text_compat)\.py$')) {
            $tests += @(
              'test_open_battery_contract',
              'test_cmake_graph_checks',
              'test_compiler_case_revision.PublishedMsvcRecipeGraphTests',
              'test_assetcheck_u4l7_source_format',
              'test_math_matching_text_compat.RealAssetCheckLineEndingPrompt.test_published_assetcheck_prompt_retains_exact_mapping_and_history'
            )
          }
          if ($shared -or [bool]($changed -match '^app/src/main/assets/content/es/programming/cpp_language_memory_oop/|^scripts/curriculum/(test_cpp_indexed_unique_transfer_authoring|test_p3_ownership_authoring)\.py$|^docs/examples/p3_ownership_authoring\.json$')) {
            $tests += @('test_cpp_indexed_unique_transfer_authoring', 'test_p3_ownership_authoring')
          }
          if ($tests.Count -eq 0) {
            Write-Host 'No changed publication or tool belongs to the focused adoption contracts.'
          } else {
            python -B -m unittest -v @tests
            if ($LASTEXITCODE -ne 0) { throw 'Published adoption contract verification failed.' }
          }
      - name: Verificar revisión genérica de opciones y conservación de respuestas
        run: |
          python -B -m unittest -v test_general_choice_editorial
      - name: Comprobar la precisión general de la consigna matemática AssetCheck sin cambiar respuestas
        run: |
          python -B -m unittest -v test_p2_math_prompt_general_revision
      - name: Acreditar dos revisiones ordinarias de preguntas U12 con marcado explícito
        run: |
          python -B -m unittest -v test_published_u12_question_editorials
      - name: Compilar dos ejemplos de una lección real y conservar su origen publicado
        run: |
          python -B -m unittest -v test_real_code_format_pilot
      - name: Acreditar el esquema declarativo U3 sin modificar ejercicios ni progreso
        run: |
          python -B -m unittest -v test_p2_u3_workflow_declaration
      - name: Comprobar declaraciones semánticas U3L6 sin modificar fuentes históricas
        run: |
          python -B -m unittest -v test_u3_rejection_runtime_contract
      - name: Comprobar declaraciones de informes U3L8 sin alterar los editores
        run: |
          python -B -m unittest -v test_u3_observation_runtime_contract
      - name: Verificar las tres declaraciones WASI U3L9 sin alterar sus fuentes
        run: |
          python -B -m unittest -v test_u3_assertion_runtime_contract
      - name: Verificar las cuatro declaraciones de constantes nombradas conservando los contratos históricos
        run: |
          python -B -m unittest -v test_named_rule_checks
      - name: Probar separadores visuales opcionales sin modificar 14 puzles históricos
        run: |
          python -B -m unittest -v test_order_visual_separators
      - name: Diagnosticar huellas históricas de idioma sin corregirlas automáticamente
        run: |
          python -B -m unittest -v test_locale_origin_diagnostic
      - name: Validar específicamente Programación 2 desde su publicación Git
        run: |
          python -B scripts/curriculum/validar_json_programacion.py --course programming_practice_tools --base-ref HEAD --list-files
      - name: Validar específicamente Programación 1 sin relajar contratos anteriores
        run: |
          python -B scripts/curriculum/validar_json_programacion.py --course cpp_fundamentals --base-ref HEAD
      - name: Validar todos los cursos presentes sin depender de su activación en el catálogo
        run: |
          python -B scripts/curriculum/validar_json_programacion.py --base-ref HEAD --list-files

  diagnose-every-lesson:
    name: Diagnosticar todos los mapas visibles (no aprueba la publicación)
    runs-on: windows-2022
    timeout-minutes: 12
    env:
      PYTHONPATH: scripts/curriculum
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.longpaths
      GIT_CONFIG_VALUE_0: 'true'
    steps:
      - name: Obtener el código sin modificar la publicación
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Select Python for Windows curricular audits
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probar fallas en dos cursos y protección del contenido
        run: |
          python -B -m unittest -v test_diagnosticar_estado_multicurso
      - name: Examinar todos los JSON de Programación 1 y 2, sin omitir errores
        run: |
          python -B scripts/curriculum/diagnosticar_estado_multicurso.py --course all --output-json out/qa/multicourse-state-diagnostic.json
      - name: Conservar evidencia del diagnóstico real aunque el contrato falle
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: diagnostico-multicurso-${{ github.sha }}
          retention-days: 14
          if-no-files-found: error
          path: out/qa/multicourse-state-diagnostic.json

  audit-visible-structure:
    name: Auditar bloques e índices reales de ambos cursos (solo estructura)
    runs-on: windows-2022
    timeout-minutes: 12
    env:
      PYTHONPATH: scripts/curriculum
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.longpaths
      GIT_CONFIG_VALUE_0: 'true'
    steps:
      - name: Obtener lecciones y validadores sin modificar archivos
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Select Python for Windows curricular audits
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probar el alcance limitado y la detección de respuestas inválidas
        run: |
          python -B -m unittest -v test_auditar_estructura_multicurso
      - name: Comprobar bloques e índices de 190 lecciones reales
        run: |
          python -B scripts/curriculum/auditar_estructura_multicurso.py --course all --output-json out/qa/multicourse-structure-only.json
      - name: Conservar resultado visible aunque la auditoría falle
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: estructura-multicurso-${{ github.sha }}
          retention-days: 14
          if-no-files-found: error
          path: out/qa/multicourse-structure-only.json
