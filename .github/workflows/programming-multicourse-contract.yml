name: Contrato curricular de Programación 1 y 2

on:
  push:
    branches: [Codex]
    paths:
      - .github/workflows/programming-multicourse-contract.yml
      - scripts/curriculum/validar_json_programacion.py
      - scripts/curriculum/validate_programming_practice_tools.py
      - scripts/curriculum/test_programming_multicourse_validation.py
      - scripts/curriculum/test_stable_state_layout.py
      - scripts/curriculum/test_order_visual_separators.py
      - scripts/curriculum/stable_state_layout.py
      - scripts/curriculum/code_format_compat.py
      - scripts/curriculum/test_code_format_compat.py
      - scripts/curriculum/test_real_code_format_pilot.py
      - app/src/main/assets/content/en/programming/cpp_fundamentals/expresiones_y_decisiones/lesson_construir_decisiones_desde_un_problema.json
      - app/src/main/assets/content/fr/programming/cpp_fundamentals/expresiones_y_decisiones/lesson_construir_decisiones_desde_un_problema.json
      - scripts/curriculum/test_p2_u3_workflow_declaration.py
      - scripts/curriculum/test_u3_rejection_runtime_contract.py
      - scripts/curriculum/test_u3_observation_runtime_contract.py
      - scripts/curriculum/test_u3_assertion_runtime_contract.py
      - scripts/curriculum/test_locale_origin_diagnostic.py
      - scripts/curriculum/diagnosticar_estado_multicurso.py
      - scripts/curriculum/test_diagnosticar_estado_multicurso.py
      - scripts/curriculum/auditar_estructura_multicurso.py
      - scripts/curriculum/test_auditar_estructura_multicurso.py
      - app/src/main/assets/content/es/programming/cpp_fundamentals/**
      - app/src/main/assets/content/es/programming/programming_practice_tools/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-programming-courses:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Obtener publicación y mapas históricos auténticos
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Comprobar reglas estructurales y revisiones editoriales de ambos cursos
        run: |
          PYTHONPATH=scripts/curriculum python3 -m unittest -v test_programming_multicourse_validation
      - name: Conservar regresiones previas del mapa de estado
        run: |
          PYTHONPATH=scripts/curriculum python3 -m unittest -v test_stable_state_layout
      - name: Probar formato físico C++ y CMake sin alterar el progreso histórico
        run: |
          PYTHONPATH=scripts/curriculum python3 -m unittest -v test_code_format_compat
      - name: Compilar dos ejemplos de una lección real y conservar su origen publicado
        run: |
          PYTHONPATH=scripts/curriculum python3 -m unittest -v test_real_code_format_pilot
      - name: Acreditar el esquema declarativo U3 sin modificar ejercicios ni progreso
        run: |
          PYTHONPATH=scripts/curriculum python3 -m unittest -v test_p2_u3_workflow_declaration
      - name: Comprobar declaraciones semánticas U3L6 sin modificar fuentes históricas
        run: |
          PYTHONPATH=scripts/curriculum python3 -m unittest -v test_u3_rejection_runtime_contract
      - name: Comprobar declaraciones de informes U3L8 sin alterar los editores
        run: |
          PYTHONPATH=scripts/curriculum python3 -m unittest -v test_u3_observation_runtime_contract
      - name: Verificar las tres declaraciones WASI U3L9 sin alterar sus fuentes
        run: |
          PYTHONPATH=scripts/curriculum python3 -m unittest -v test_u3_assertion_runtime_contract
      - name: Probar separadores visuales opcionales sin modificar 14 puzles históricos
        run: |
          PYTHONPATH=scripts/curriculum python3 -m unittest -v test_order_visual_separators
      - name: Diagnosticar huellas históricas de idioma sin corregirlas automáticamente
        run: |
          PYTHONPATH=scripts/curriculum python3 -m unittest -v test_locale_origin_diagnostic
      - name: Validar específicamente Programación 2 desde su publicación Git
        run: |
          python3 scripts/curriculum/validar_json_programacion.py --course programming_practice_tools --base-ref HEAD --list-files
      - name: Validar específicamente Programación 1 sin relajar contratos anteriores
        run: |
          python3 scripts/curriculum/validar_json_programacion.py --course cpp_fundamentals --base-ref HEAD
      - name: Comprobar que el uso habitual visita ambos cursos
        run: |
          python3 scripts/curriculum/validar_json_programacion.py --base-ref HEAD

  diagnose-every-lesson:
    name: Diagnosticar todos los mapas visibles (no aprueba la publicación)
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Obtener el código sin modificar la publicación
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Probar fallas en dos cursos y protección del contenido
        run: |
          PYTHONPATH=scripts/curriculum python3 -m unittest -v test_diagnosticar_estado_multicurso
      - name: Examinar todos los JSON de Programación 1 y 2, sin omitir errores
        run: |
          python3 scripts/curriculum/diagnosticar_estado_multicurso.py --course all --output-json out/qa/multicourse-state-diagnostic.json
      - name: Conservar evidencia del diagnóstico real aunque el contrato falle
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: diagnostico-multicurso-${{ github.sha }}
          retention-days: 14
          if-no-files-found: error
          path: out/qa/multicourse-state-diagnostic.json

  audit-visible-structure:
    name: Auditar bloques e índices reales de ambos cursos (solo estructura)
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Obtener lecciones y validadores sin modificar archivos
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Probar el alcance limitado y la detección de respuestas inválidas
        run: |
          PYTHONPATH=scripts/curriculum python3 -m unittest -v test_auditar_estructura_multicurso
      - name: Comprobar bloques e índices de 190 lecciones reales
        run: |
          python3 scripts/curriculum/auditar_estructura_multicurso.py --course all --output-json out/qa/multicourse-structure-only.json
      - name: Conservar resultado visible aunque la auditoría falle
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: estructura-multicurso-${{ github.sha }}
          retention-days: 14
          if-no-files-found: error
          path: out/qa/multicourse-structure-only.json
