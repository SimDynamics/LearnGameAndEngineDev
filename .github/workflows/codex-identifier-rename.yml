name: Codex declared C++ identifier rename contract

on:
  push:
    branches: [Codex]
    paths:
      - .github/workflows/codex-identifier-rename.yml
      - scripts/curriculum/identifier_rename_compat.py
      - scripts/curriculum/test_identifier_rename_compat.py
      - scripts/curriculum/test_identifier_rename_execution.py
      - scripts/curriculum/identifier_rename_archive_preview.py
      - scripts/curriculum/test_identifier_rename_archive_preview.py
      - scripts/curriculum/stable_state_layout.py
      - scripts/curriculum/code_format_compat.py
      - native/core/code_format_compat.hpp
      - native/core/identifier_rename_compat.hpp
      - native/core/identifier_rename_compat_tests.cpp
      - app/src/main/assets/content/es/programming/cpp_fundamentals/colecciones_y_recorridos/lesson_contar_frecuencias_y_conservar_empates.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lexical-rename-proof:
    name: Declared identifier renames and real MSVC compilation on Windows
    runs-on: windows-2022
    timeout-minutes: 18
    steps:
      - name: Read exact Codex checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Use supported Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Activate MSVC x64 without modifying the pinned app toolchain
        uses: ilammy/msvc-dev-cmd@v1
      - name: Compile the C++23 native lexical validator with MSVC
        shell: cmd
        run: |
          cl /nologo /std:c++latest /EHsc /W4 /WX /permissive- /Zc:__cplusplus /utf-8 /I native native\core\identifier_rename_compat_tests.cpp /Fe:"%RUNNER_TEMP%\lgaed-identifier-rename-native.exe"
          if errorlevel 1 exit /b 1
      - name: Exercise the native identifier-rename contract
        shell: cmd
        run: '"%RUNNER_TEMP%\lgaed-identifier-rename-native.exe"'
      - name: Execute independent C++ identifier rename guard
        run: python -B -m unittest discover -s scripts/curriculum -p test_identifier_rename_compat.py -v
      - name: Validate read-only historical rename previews on published format
        run: python -B -m unittest discover -s scripts/curriculum -p test_identifier_rename_archive_preview.py -v
      - name: Compile and run actual frequency programs before and after renaming
        run: python -B -m unittest discover -s scripts/curriculum -p test_identifier_rename_execution.py -v
