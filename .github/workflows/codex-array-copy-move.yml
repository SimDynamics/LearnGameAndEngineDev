name: Codex U6L11 genuine array copy and move

on:
  push:
    branches: [Codex]
    paths:
      - .github/workflows/codex-array-copy-move.yml
      - scripts/curriculum/test_cpp_array_copy_move.py
      - scripts/curriculum/test_cpp_array_copy_move_core.py
      - scripts/curriculum/test_cpp_array_copy_move_authoring.py
      - scripts/curriculum/published_adoption_fixtures.py
      - scripts/curriculum/published_adoption_pins.json
      - scripts/curriculum/stable_state_layout.py
      - native/core/cpp_array_copy_move_check.hpp
      - native/core/cpp_class_structure_check.hpp
      - native/core/cpp_array_copy_move_check_tests.cpp
      - native/core/cpp_private_probe_neutral.hpp
      - app/src/main/assets/content/es/programming/cpp_language_memory_oop/estado_y_ciclo_de_vida_de_clases/lesson_copiar_y_mover_arrays_sin_desajustar_la_cantidad.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-msvc:
    name: Genuine U6L11 copy and move with Windows MSVC C++23
    runs-on: windows-2022
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Independently compile and execute the original Tramo
        shell: cmd
        run: |
          python -B scripts\curriculum\test_cpp_array_copy_move.py --compiler cl --windows
          if errorlevel 1 exit /b 1
          python -B scripts\curriculum\test_cpp_array_copy_move_core.py --compiler cl --windows
          if errorlevel 1 exit /b 1
          python -B -m unittest discover -s scripts\curriculum -p test_cpp_array_copy_move_authoring.py -v
          if errorlevel 1 exit /b 1
