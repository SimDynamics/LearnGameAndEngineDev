name: Codex compatible mathematical matching public text

on:
  push:
    branches: [Codex]
    paths:
      - .github/workflows/codex-math-matching-text.yml
      - scripts/curriculum/math_matching_text_compat.py
      - scripts/curriculum/identifier_rename_archive_preview.py
      - scripts/curriculum/identifier_rename_compat.py
      - scripts/curriculum/test_math_matching_text_compat.py
      - scripts/curriculum/validar_json_programacion.py
      - scripts/curriculum/text_semantics.py
      - scripts/curriculum/stable_state_layout.py
      - app/src/main/assets/content/es/programming/cpp_fundamentals/colecciones_y_recorridos/lesson_contar_frecuencias_y_conservar_empates.json
      - app/src/main/assets/content/es/programming/programming_practice_tools/proyecto_assetcheck/lesson_leer_manifiesto_y_publicar_informe.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authoring-matching-text:
    name: P1/P2 published matching IDs, immutable answers and UTF-16 marks
    runs-on: windows-2022
    timeout-minutes: 10
    env:
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.longpaths
      GIT_CONFIG_VALUE_0: 'true'
    steps:
      - name: Checkout exact Codex publication
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Select Python for native Windows QA
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run authored matching text compatibility and negative contracts
        run: >-
          python -B -m unittest discover
          -s scripts/curriculum
          -p test_math_matching_text_compat.py -v
