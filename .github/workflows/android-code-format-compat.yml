name: Android code-format state compatibility

on:
  push:
    branches: [Codex]
    paths:
      - .github/workflows/android-code-format-compat.yml
      - app/src/main/java/com/learngraphicsprogramming/app/CurricularSourceFormatCompat.kt
      - app/src/main/java/com/learngraphicsprogramming/app/LessonStateLayoutJson.kt
      - app/src/main/java/com/learngraphicsprogramming/app/StableLessonStateLayout.kt
      - app/src/main/java/com/learngraphicsprogramming/app/CurricularOrderRefinement.kt
      - app/src/main/java/com/learngraphicsprogramming/app/CurricularChoiceRevision.kt
      - app/src/main/java/com/learngraphicsprogramming/app/CurricularCompilerRevision.kt
      - app/src/main/java/com/learngraphicsprogramming/app/LessonStateCoordinates.kt
      - app/src/main/java/com/learngraphicsprogramming/app/LessonActivity.kt
      - app/src/test/java/com/learngraphicsprogramming/app/LessonStateLayoutJsonTest.kt
      - app/src/test/java/com/learngraphicsprogramming/app/RealCodeFormatPilotAndroidTest.kt
      - app/src/test/java/com/learngraphicsprogramming/app/PublishedOrderFormatAndroidTest.kt
      - app/src/test/java/com/learngraphicsprogramming/app/PublishedChoiceRevisionAndroidTest.kt
      - app/src/test/java/com/learngraphicsprogramming/app/PublishedCompilerRevisionAndroidTest.kt
      - app/src/main/assets/content/es/programming/cpp_fundamentals/texto_interpretacion_y_flujos/lesson_construir_un_lector_de_entrada_preparada.json
      - app/src/main/assets/content/es/programming/cpp_fundamentals/texto_interpretacion_y_flujos/lesson_diagnosticar_y_recuperar_hasta_fin_de_operacion.json
      - app/src/main/assets/content/es/programming/cpp_fundamentals/texto_interpretacion_y_flujos/lesson_construir_un_interprete_con_historial_y_pruebas.json
      - app/src/main/assets/content/es/programming/cpp_fundamentals/texto_interpretacion_y_flujos/lesson_estados_del_flujo_y_datos_validos.json
      - app/src/main/assets/content/es/programming/cpp_fundamentals/texto_interpretacion_y_flujos/lesson_validar_una_operacion_y_recuperar_la_siguiente.json
      - app/src/test/java/com/learngraphicsprogramming/app/StableLessonStateLayoutTest.kt
      - app/src/test/java/com/learngraphicsprogramming/app/StableLessonRepositoryFixtureTest.kt
      - app/src/main/assets/content/es/programming/cpp_fundamentals/expresiones_y_decisiones/lesson_alternativas_y_fronteras.json
      - app/src/main/assets/content/es/programming/cpp_fundamentals/expresiones_y_decisiones/lesson_construir_decisiones_desde_un_problema.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  state-layout:
    name: Android JUnit format and historical progress guards
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out the exact Codex publication
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Run isolated Android JVM state tests
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest \
            --tests com.learngraphicsprogramming.app.LessonStateLayoutJsonTest \
            --tests com.learngraphicsprogramming.app.RealCodeFormatPilotAndroidTest \
            --tests com.learngraphicsprogramming.app.PublishedOrderFormatAndroidTest \
            --tests com.learngraphicsprogramming.app.PublishedChoiceRevisionAndroidTest \
            --tests com.learngraphicsprogramming.app.PublishedCompilerRevisionAndroidTest \
            --tests com.learngraphicsprogramming.app.StableLessonStateLayoutTest \
            --tests com.learngraphicsprogramming.app.StableLessonRepositoryFixtureTest \
            -Plgp.clang23=false -Plgp.wasmtime=false -Plgp.cppExceptions=false \
            --no-daemon --stacktrace
      - name: Retain JUnit XML and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-state-format-tests-${{ github.sha }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            app/build/test-results/testDebugUnitTest
            app/build/reports/tests/testDebugUnitTest
