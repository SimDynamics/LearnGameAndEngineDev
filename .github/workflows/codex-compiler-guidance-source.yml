name: Codex portable Windows compiler guidance source checks

on:
  push:
    branches: [Codex]
    paths:
      - .github/workflows/codex-compiler-guidance-source.yml
      - cmake/PortableCompilerGuidanceQA/CMakeLists.txt
      - native/platform/windows/compiler_completion.cpp
      - native/platform/windows/compiler_completion.hpp
      - native/platform/windows/compiler_guidance_state_tests.cpp
      - native/core/lesson.hpp
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-guidance-source:
    # Compiles the unchanged production translation units with hosted MSVC.
    # Does not claim to run CTest, WinRT state-store integration, narration,
    # or the separately pinned MSVC/SDK production configuration.
    name: Compile real compiler-guidance implementation and regressions (MSVC)
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - name: Read exact Codex revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Activate Visual C++ in disposable runner
        uses: ilammy/msvc-dev-cmd@v1
      - name: Compile actual C++ compiler-completion module
        shell: cmd
        run: >
          cl /nologo /std:c++latest /EHsc /W4 /permissive-
          /Zc:__cplusplus /utf-8 /I native /I "%RUNNER_TEMP%\guidance-generated"
          /DUNICODE /D_UNICODE /DWIN32_LEAN_AND_MEAN /DNOMINMAX
          /D_WIN32_WINNT=0x0A00 /DWINVER=0x0A00 /c
          native\platform\windows\compiler_completion.cpp
          /Fo:"%RUNNER_TEMP%\compiler_guidance_completion.obj"
      - name: Generate the existing native QA configuration header for exact checkout
        shell: pwsh
        run: |
          $root = (Get-Location).Path.Replace('\', '/')
          $destination = Join-Path $env:RUNNER_TEMP 'guidance-generated'
          [void][System.IO.Directory]::CreateDirectory($destination)
          $toolchain = $env:VCToolsInstallDir.Replace('\', '/')
          $sdk = $env:WindowsSdkDir.Replace('\', '/')
          $template = Get-Content -LiteralPath 'cmake/native_build_config.hpp.in' -Raw -Encoding UTF8
          $replacements = @{
            '@LGAED_CPP_STANDARD@' = '23'
            '@LGAED_CPP_STANDARD_OPTION@' = '/std:c++latest'
            '@LGAED_DEFAULT_PROFILE@' = 'Codex'
            '@CMAKE_SOURCE_DIR@' = $root
            '@LGAED_DEP_ROOT@' = ''
            '@LGAED_EDUCATIONAL_VC_ROOT@' = $toolchain
            '@LGAED_EDUCATIONAL_SDK_ROOT@' = $sdk
            '@CMAKE_COMMAND@' = 'cmake'
            '@CMAKE_MAKE_PROGRAM@' = 'ninja'
            '@CMAKE_RC_COMPILER@' = 'rc'
            '@CMAKE_CURRENT_BINARY_DIR@' = $destination.Replace('\', '/')
          }
          foreach ($entry in $replacements.GetEnumerator()) {
            $template = $template.Replace($entry.Key, $entry.Value)
          }
          if ($template -match '@[A-Z_]+@') { throw 'An unresolved native header variable remains.' }
          [System.IO.File]::WriteAllText((Join-Path $destination 'native_build_config.hpp'),
            $template, [System.Text.UTF8Encoding]::new($false))
      - name: Compile authentic guidance, archival and receipt regressions
        shell: cmd
        run: >
          cl /nologo /std:c++latest /EHsc /W4 /permissive-
          /Zc:__cplusplus /utf-8 /I native /I "%RUNNER_TEMP%\guidance-generated"
          /DUNICODE /D_UNICODE /DWIN32_LEAN_AND_MEAN /DNOMINMAX
          /D_WIN32_WINNT=0x0A00 /DWINVER=0x0A00 /c
          native\platform\windows\compiler_guidance_state_tests.cpp
          /Fo:"%RUNNER_TEMP%\compiler_guidance_state_tests.obj"


  native-guidance-reopen:
    name: Real Windows compiler guide, StateStore and U12 reader fixtures (MSVC)
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - name: Read exact Codex revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Activate Visual C++ in disposable runner
        uses: ilammy/msvc-dev-cmd@v1
      - name: Configure standalone authentic compiler-guidance QA
        shell: pwsh
        run: >
          cmake -S cmake/PortableCompilerGuidanceQA
          -B "$env:RUNNER_TEMP/compiler-guidance-qa" -G Ninja
      - name: Compile actual lesson parser, native StateStore and feedback regressions
        shell: pwsh
        run: >
          cmake --build "$env:RUNNER_TEMP/compiler-guidance-qa" --parallel 2
      - name: Execute saved progress reopen and authenticated guidance checks
        shell: pwsh
        run: >
          ctest --test-dir "$env:RUNNER_TEMP/compiler-guidance-qa"
          --output-on-failure --no-tests=error -j 1
          --output-junit "$env:RUNNER_TEMP/compiler-guidance-qa/ctest-results.xml"
      - name: Publish inspectable Windows CTest evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: native-guidance-ctest-${{ github.run_id }}
          path: ${{ runner.temp }}/compiler-guidance-qa/ctest-results.xml
          if-no-files-found: warn
          retention-days: 30
