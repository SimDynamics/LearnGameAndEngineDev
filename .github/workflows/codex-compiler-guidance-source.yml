name: Codex portable Windows compiler guidance source checks

on:
  push:
    branches: [Codex]
    paths:
      - .github/workflows/codex-compiler-guidance-source.yml
      - cmake/PortableCompilerGuidanceQA/CMakeLists.txt
      - docs/examples/p3_ownership_authoring.json
      - native/platform/windows/p3_ownership_authoring_state_tests.cpp
      - native/platform/windows/compiler_completion.cpp
      - native/platform/windows/compiler_completion.hpp
      - native/platform/windows/local_int_state_tests.cpp
      - native/core/cpp_local_int_probe.hpp
      - app/src/main/assets/content/es/programming/cpp_fundamentals/objetos_y_estado/lesson_enteros_y_aproximaciones.json
      - native/platform/windows/compiler_guidance_state_tests.cpp
      - native/platform/windows/math_matching_text_state_tests.cpp
      - native/platform/windows/indexed_unique_transfer_state_tests.cpp
      - native/platform/windows/defaulted_move_policy_state_tests.cpp
      - native/platform/windows/independent_copy_assignment_state_tests.cpp
      - native/platform/windows/move_assignment_invariant_state_tests.cpp
      - native/platform/windows/array_owner_read_state_tests.cpp
      - native/platform/windows/array_copy_move_state_tests.cpp
      - native/platform/windows/array_return_take_state_tests.cpp
      - native/platform/windows/polymorphic_clone_state_tests.cpp
      - native/platform/windows/dual_interface_state_tests.cpp
      - native/core/cpp_dual_interface_check.hpp
      - native/core/cpp_polymorphic_clone_check.hpp
      - native/core/cpp_array_return_take_check.hpp
      - native/core/cpp_array_return_take_check_tests.cpp
      - scripts/curriculum/test_cpp_array_return_take_authoring.py
      - native/core/cpp_array_copy_move_check.hpp
      - native/core/cpp_array_copy_move_check_tests.cpp
      - scripts/curriculum/test_cpp_array_copy_move_authoring.py
      - native/core/cpp_array_owner_read_check.hpp
      - native/core/cpp_array_owner_read_check_tests.cpp
      - scripts/curriculum/test_cpp_array_owner_read_authoring.py
      - native/core/cpp_move_assignment_invariant_check.hpp
      - native/core/cpp_move_assignment_invariant_check_tests.cpp
      - scripts/curriculum/test_cpp_move_assignment_invariant_authoring.py
      - native/presentation/windows/lesson_view.cpp
      - native/presentation/windows/technical_context_view_tests.cpp
      - native/presentation/windows/lesson_reader_tests.cpp
      - native/presentation/windows/text_semantic_projection.hpp
      - native/core/text_semantics.hpp
      - native/core/cpp_independent_copy_assignment_check.hpp
      - native/core/cpp_independent_copy_assignment_check_tests.cpp
      - scripts/curriculum/test_cpp_independent_copy_assignment_authoring.py
      - native/core/cpp_defaulted_move_policy_check.hpp
      - scripts/curriculum/stable_state_layout.py
      - scripts/curriculum/test_cpp_defaulted_move_policy_authoring.py
      - native/platform/windows/cpp_runner.cpp
      - native/platform/windows/cpp_runner.hpp
      - native/core/cpp_indexed_unique_transfer_probe.hpp
      - native/core/cpp_member_body_check.hpp
      - native/platform/windows/content_loader.cpp
      - native/platform/windows/content_loader.hpp
      - native/platform/windows/state_store.cpp
      - native/platform/windows/state_store.hpp
      - native/core/lesson.cpp
      - native/core/identifier_rename_compat.hpp
      - native/core/code_format_compat.hpp
      - native/core/lesson.hpp
      - native/core/lesson_state.cpp
      - native/core/lesson_state.hpp
      - native/core/compile_check_test_fixture.hpp
      - cmake/native_build_config.hpp.in
      - app/src/main/assets/content/es/programming/cpp_fundamentals/datos_propios_y_estado_valido/lesson_construir_y_comprobar_un_modelo_de_pedidos.json
      - app/src/main/assets/content/es/programming/cpp_fundamentals/colecciones_y_recorridos/lesson_contar_frecuencias_y_conservar_empates.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-guidance-source:
    # Compiles the unchanged production translation units with hosted MSVC.
    # Does not claim to run CTest, WinRT state-store integration, narration,
    # or the separately pinned MSVC/SDK production configuration.
    name: Compile real compiler-guidance implementation and regressions (MSVC)
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - name: Read exact Codex revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Activate Visual C++ in disposable runner
        uses: ilammy/msvc-dev-cmd@v1
      - name: Generate the existing native QA configuration header for exact checkout
        shell: pwsh
        run: |
          $root = (Get-Location).Path.Replace('\', '/')
          $destination = Join-Path $env:RUNNER_TEMP 'guidance-generated'
          [void][System.IO.Directory]::CreateDirectory($destination)
          $toolchain = $env:VCToolsInstallDir.Replace('\', '/')
          $sdk = $env:WindowsSdkDir.Replace('\', '/')
          $template = Get-Content -LiteralPath 'cmake/native_build_config.hpp.in' -Raw -Encoding UTF8
          $replacements = @{
            '@LGAED_CPP_STANDARD@' = '23'
            '@LGAED_CPP_STANDARD_OPTION@' = '/std:c++latest'
            '@LGAED_DEFAULT_PROFILE@' = 'Codex'
            '@CMAKE_SOURCE_DIR@' = $root
            '@LGAED_DEP_ROOT@' = ''
            '@LGAED_EDUCATIONAL_VC_ROOT@' = $toolchain
            '@LGAED_EDUCATIONAL_SDK_ROOT@' = $sdk
            '@CMAKE_COMMAND@' = 'cmake'
            '@CMAKE_MAKE_PROGRAM@' = 'ninja'
            '@CMAKE_RC_COMPILER@' = 'rc'
            '@CMAKE_CURRENT_BINARY_DIR@' = $destination.Replace('\', '/')
          }
          foreach ($entry in $replacements.GetEnumerator()) {
            $template = $template.Replace($entry.Key, $entry.Value)
          }
          if ($template -match '@[A-Z_]+@') { throw 'An unresolved native header variable remains.' }
          [System.IO.File]::WriteAllText((Join-Path $destination 'native_build_config.hpp'),
            $template, [System.Text.UTF8Encoding]::new($false))
      - name: Compile actual C++ compiler-completion module
        shell: cmd
        run: >
          cl /nologo /std:c++latest /EHsc /W4 /permissive-
          /Zc:__cplusplus /utf-8 /I native /I "%RUNNER_TEMP%\guidance-generated"
          /DUNICODE /D_UNICODE /DWIN32_LEAN_AND_MEAN /DNOMINMAX
          /D_WIN32_WINNT=0x0A00 /DWINVER=0x0A00 /c
          native\platform\windows\compiler_completion.cpp
          /Fo:"%RUNNER_TEMP%\compiler_guidance_completion.obj"
      - name: Compile real Win32 curriculum editor presentation
        shell: cmd
        run: >
          cl /nologo /std:c++latest /EHsc /W4 /permissive- /bigobj
          /Zc:__cplusplus /utf-8 /I native /I "%RUNNER_TEMP%\guidance-generated"
          /DUNICODE /D_UNICODE /DWIN32_LEAN_AND_MEAN /DNOMINMAX
          /D_WIN32_WINNT=0x0A00 /DWINVER=0x0A00 /c
          native\presentation\windows\lesson_view.cpp
          /Fo:"%RUNNER_TEMP%\lesson_view_u6l7.obj"
      # This syntax-only native QA uses the runner's installed MSVC. It is
      # independent of the exact pinned full application/reader toolchain and
      # does not claim that Win32 controls or speech were executed.
      - name: Compile current U2 semantic colors and reader regressions
        shell: cmd
        run: |
          cl /nologo /std:c++latest /EHsc /W4 /permissive- /bigobj /Zc:__cplusplus /utf-8 /I native /I "%RUNNER_TEMP%\guidance-generated" /DUNICODE /D_UNICODE /DWIN32_LEAN_AND_MEAN /DNOMINMAX /D_WIN32_WINNT=0x0A00 /DWINVER=0x0A00 /c native\presentation\windows\technical_context_view_tests.cpp /Fo:"%RUNNER_TEMP%\u2_semantic_colors.obj"
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++latest /EHsc /W4 /permissive- /bigobj /Zc:__cplusplus /utf-8 /I native /I "%RUNNER_TEMP%\guidance-generated" /DUNICODE /D_UNICODE /DWIN32_LEAN_AND_MEAN /DNOMINMAX /D_WIN32_WINNT=0x0A00 /DWINVER=0x0A00 /c native\presentation\windows\lesson_reader_tests.cpp /Fo:"%RUNNER_TEMP%\u2_semantic_reader.obj"
          if errorlevel 1 exit /b 1
      - name: Compile authentic guidance, archival and receipt regressions
        shell: cmd
        run: >
          cl /nologo /std:c++latest /EHsc /W4 /permissive-
          /Zc:__cplusplus /utf-8 /I native /I "%RUNNER_TEMP%\guidance-generated"
          /DUNICODE /D_UNICODE /DWIN32_LEAN_AND_MEAN /DNOMINMAX
          /D_WIN32_WINNT=0x0A00 /DWINVER=0x0A00 /c
          native\platform\windows\compiler_guidance_state_tests.cpp
          /Fo:"%RUNNER_TEMP%\compiler_guidance_state_tests.obj"


  native-guidance-reopen:
    name: Real Windows compiler guide, StateStore and U12 reader fixtures (MSVC)
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - name: Read exact Codex revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Activate Visual C++ in disposable runner
        uses: ilammy/msvc-dev-cmd@v1
      - name: Configure standalone authentic compiler-guidance QA
        shell: pwsh
        run: >
          cmake -S cmake/PortableCompilerGuidanceQA
          -B "$env:RUNNER_TEMP/compiler-guidance-qa" -G Ninja
      - name: Compile actual lesson parser, native StateStore and feedback regressions
        shell: pwsh
        run: >
          cmake --build "$env:RUNNER_TEMP/compiler-guidance-qa" --parallel 2
      - name: Execute saved progress reopen and authenticated guidance checks
        shell: pwsh
        run: >
          ctest --test-dir "$env:RUNNER_TEMP/compiler-guidance-qa"
          --output-on-failure --no-tests=error -j 1
          --output-junit "$env:RUNNER_TEMP/compiler-guidance-qa/ctest-results.xml"
      - name: Publish inspectable Windows CTest evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: native-guidance-ctest-${{ github.run_id }}
          path: ${{ runner.temp }}/compiler-guidance-qa/ctest-results.xml
          if-no-files-found: warn
          retention-days: 30
