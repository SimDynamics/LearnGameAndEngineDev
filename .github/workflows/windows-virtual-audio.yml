name: Windows virtual audio evaluation

on:
  push:
    branches: [Codex]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-virtual-audio-${{ github.ref }}
  cancel-in-progress: false

jobs:
  evaluate:
    name: Signed endpoint, real player and U12 published reader
    # A bounded, explicit evaluation of VB-CABLE, not a driver on every push.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'qa-virtual-audio:')
    runs-on: windows-2025-vs2026
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Read the source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select the declared Python version
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.15.2'
      - name: Verify signatures, install the endpoint and run the three original player tests
        run: .\scripts\windows\Test-NativeCurricularCI.ps1 -Suite NarrationPlayer -VirtualAudio
      - name: Run the three original U12 published reader phases with real Kokoro
        run: .\scripts\windows\Test-NativeCurricularCI.ps1 -Suite U12Reader
      - name: Preserve installation, build and native test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-virtual-audio-${{ github.sha }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            out/qa/narration-player-ci/CMakeFiles/CMakeConfigureLog.yaml
            out/qa/narration-player-ci/native-build.log
            out/qa/narration-player-ci/CTestTestfile.cmake
            out/qa/narration-player-ci/Testing/Temporary/*.log
            out/qa/narration-player-ci/audio-environment.log
            out/qa/narration-player-ci/narration-player-results.xml
            out/qa/narration-player-ci/narration-player-results.log
            out/qa/narration-player-ci/virtual-audio/*.log
            out/qa/narration-player-ci/virtual-audio/*.json
            out/qa/u12-reader-ci/CMakeFiles/CMakeConfigureLog.yaml
            out/qa/u12-reader-ci/native-build.log
            out/qa/u12-reader-ci/CTestTestfile.cmake
            out/qa/u12-reader-ci/Testing/Temporary/*.log
            out/qa/u12-reader-ci/audio-environment.log
            out/qa/u12-reader-ci/narration-tool-archives.json
            out/qa/u12-reader-ci/narration-resources.log
            out/qa/u12-reader-ci/u12-reader-results.xml
            out/qa/u12-reader-ci/u12-reader-results.log
            out/narration/worker-stderr.log
