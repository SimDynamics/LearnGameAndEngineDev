name: Codex U6L8 verified move invariants

on:
  push:
    branches: [Codex]
    paths:
      - .github/workflows/codex-move-assignment-invariants.yml
      - scripts/curriculum/test_cpp_move_assignment_invariants.py
      - native/core/cpp_move_assignment_invariant_check.hpp
      - native/core/cpp_move_assignment_invariant_check_tests.cpp
      - scripts/curriculum/test_cpp_move_assignment_invariant_core.py
      - app/src/main/assets/content/es/programming/cpp_language_memory_oop/estado_y_ciclo_de_vida_de_clases/lesson_conservar_invariantes_al_mover_una_clase.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable:
    name: Original U6L8 Muestra semantics with GCC and Clang
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Check ownership, direct move, no allocation and persistent invariants
        run: |
          for compiler in g++ clang++; do
            python3 -B scripts/curriculum/test_cpp_move_assignment_invariants.py \
              --compiler "$compiler"
            python3 -B scripts/curriculum/test_cpp_move_assignment_invariant_core.py \
              --compiler "$compiler"
          done

  windows-msvc:
    name: Original U6L8 Muestra semantics with Windows MSVC
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Check actual original class and direct assignment under MSVC
        shell: cmd
        run: |
          python -B scripts\curriculum\test_cpp_move_assignment_invariants.py --compiler cl --windows
          python -B scripts\curriculum\test_cpp_move_assignment_invariant_core.py --compiler cl --windows
