name: Codex U8L7 safe construction of a derived owner

on:
  push:
    branches: [Codex]
    paths:
      - .github/workflows/codex-derived-preparation.yml
      - scripts/curriculum/test_cpp_derived_preparation.py
      - scripts/curriculum/test_cpp_derived_preparation_core.py
      - scripts/curriculum/test_cpp_derived_preparation_authoring.py
      - scripts/curriculum/stable_state_layout.py
      - native/core/cpp_derived_preparation_check.hpp
      - native/core/cpp_class_structure_check.hpp
      - native/core/cpp_derived_preparation_check_tests.cpp
      - native/core/cpp_multi_body_check.hpp
      - app/src/main/assets/content/es/programming/cpp_language_memory_oop/composicion_y_herencia_publica/lesson_conservar_recursos_si_falla_la_construccion_derivada.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-msvc:
    name: Genuine U8L7 construction failure with MSVC C++23
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Verify derived destruction and retained destination with MSVC
        shell: cmd
        run: |
          python -B scripts\curriculum\test_cpp_derived_preparation.py --compiler cl --windows
          python -B scripts\curriculum\test_cpp_derived_preparation_core.py --compiler cl --windows
          python -B -m unittest discover -s scripts\curriculum -p test_cpp_derived_preparation_authoring.py -v
