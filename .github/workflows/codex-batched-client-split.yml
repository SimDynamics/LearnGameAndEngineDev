name: Codex one-input session authoring from a real published C++ batch

on:
  push:
    branches: [Codex]
    paths:
      - .github/workflows/codex-batched-client-split.yml
      - .github/workflows/**
      - scripts/curriculum/test_windows_ci_compilers.py
      - scripts/curriculum/windows_cpp_ci.py
      - scripts/curriculum/test_windows_cpp_ci.py
      - scripts/curriculum/test_current_batched_client_split.py
      - scripts/curriculum/stable_state_layout.py
      - scripts/curriculum/code_format_compat.py
      - app/src/main/assets/content/es/programming/cpp_fundamentals/funciones_y_contratos/lesson_interfaces_cabeceras_y_programas_con_varios_archivos.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authoring-batch-scope:
    name: Authenticate the focused batch before omitting unrelated C++ checks
    if: ${{ github.event_name == 'push' && (startsWith(github.event.head_commit.message, 'qa-code-scope-history:') || startsWith(github.event.head_commit.message, 'qa-active-edition:') || startsWith(github.event.head_commit.message, 'qa-windows-policy:')) }}
    runs-on: windows-2022
    timeout-minutes: 5
    env:
      LGAED_QA_EDITION_BATCH: ${{ startsWith(github.event.head_commit.message, 'qa-active-edition:') }}
      LGAED_QA_POLICY_BATCH: ${{ startsWith(github.event.head_commit.message, 'qa-windows-policy:') }}
    steps:
      - name: Checkout the complete authenticated source history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reject source changes outside the authenticated batch
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:LGAED_QA_POLICY_BATCH -eq 'true') {
            # The parent fixes only a shadowed QA identifier. Its six original
            # Win32 translation units run in codex-local-int-dependency.yml.
            $qaBase = '71cd21b12be6daa228f9c91ee514e3fb0c413e5d'
            $qaAllowed = @('.github/workflows/codex-batched-client-split.yml', '.github/workflows/codex-local-int-dependency.yml', 'scripts/curriculum/test_windows_ci_compilers.py')
          } elseif ($env:LGAED_QA_EDITION_BATCH -eq 'true') {
            # Native edition/control sources are unchanged in this batch;
            # only their final workflow selection is extended.
            $qaBase = '9268b2a019b62a1466c305b257f8983e3b2b6cfd'
            $qaAllowed = @('.github/workflows/codex-course-edition-runtime.yml', '.github/workflows/codex-batched-client-split.yml')
          } else {
            $qaBase = '229c6e2b9d77b889f842c59a4ce825c2e0194dc4'
            $qaAllowed = @('scripts/curriculum/test_code_scope_presentations.py', '.github/workflows/windows-reader-build.yml', '.github/workflows/codex-batched-client-split.yml')
          }
          git merge-base --is-ancestor $qaBase HEAD
          if ($LASTEXITCODE -ne 0) { throw 'The authenticated source revision must be an ancestor of this follow-up.' }
          $qaChanged = @(git diff --name-only --no-renames $qaBase HEAD)
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect the exact focused batch revision.' }
          $qaUnexpected = @($qaChanged | Where-Object { $_ -notin $qaAllowed })
          if ($qaChanged.Count -eq 0 -or $qaUnexpected.Count -ne 0) {
            throw ('Focused QA requires its declared test/workflow diff: ' + ($qaUnexpected -join ', '))
          }

      - name: Select Python for the Windows workflow policy
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.15.2'
      - name: Verify Windows-only workflows even when unrelated C++ checks are omitted
        shell: pwsh
        run: |
          python -B -m unittest discover -s scripts/curriculum -p test_windows_ci_compilers.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  authentic-case-split:
    name: Check eight standalone cases with the archived original
    # Each focused batch preserves this check's native C++ sources.
    # The independent scope job rejects every undeclared source change.
    if: ${{ github.event_name != 'push' || (!startsWith(github.event.head_commit.message, 'qa-code-scope-history:') && !startsWith(github.event.head_commit.message, 'qa-active-edition:') && !startsWith(github.event.head_commit.message, 'qa-windows-policy:')) }}
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - name: Checkout exact Codex publication
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Select supported Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Activate MSVC for a real reference compilation on Windows
        uses: ilammy/msvc-dev-cmd@v1
      - name: Guard Windows-only compiler selection and reject either test failure
        shell: pwsh
        run: |
          python -B -m unittest discover -s scripts/curriculum -p test_windows_ci_compilers.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B -m unittest discover -s scripts/curriculum -p test_windows_cpp_ci.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Validate current U6L19 client authoring and historical receipts
        run: python -B -m unittest discover -s scripts/curriculum -p test_current_batched_client_split.py -v
