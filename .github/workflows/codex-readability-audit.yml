name: Codex read-only global code readability audit

on:
  push:
    branches: [Codex]
    paths:
      - scripts/curriculum/auditar_legibilidad_codigo.py
      - scripts/curriculum/test_auditar_legibilidad_codigo.py
      - .github/workflows/codex-readability-audit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-cli:
    name: Verify manual-only findings and unchanged published sources
    runs-on: windows-2022
    timeout-minutes: 6
    steps:
      - name: Read exact Codex revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Select Python for Windows readability QA
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run source audit regressions, without touching curriculum
        run: python -B -m unittest discover -s scripts/curriculum -p test_auditar_legibilidad_codigo.py -v
      - name: Inspect all authored locales and course source files
        run: python -B scripts/curriculum/auditar_legibilidad_codigo.py --limit 30
