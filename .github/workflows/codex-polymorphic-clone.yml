name: Codex U8L10 independent polymorphic cloning

on:
  push:
    branches: [Codex]
    paths:
      - .github/workflows/codex-polymorphic-clone.yml
      - native/core/cpp_polymorphic_clone_check.hpp
      - native/core/cpp_polymorphic_clone_check_tests.cpp
      - native/core/cpp_multi_body_check.hpp
      - native/core/cpp_abstract_interface_check.hpp
      - native/core/cpp_member_body_check.hpp
      - native/core/code_format_compat.hpp
      - scripts/curriculum/test_cpp_polymorphic_clone.py
      - scripts/curriculum/test_cpp_polymorphic_clone_authoring.py
      - scripts/curriculum/stable_state_layout.py
      - app/src/main/assets/content/es/programming/cpp_language_memory_oop/composicion_y_herencia_publica/lesson_copiar_objetos_sin_perder_su_clase_concreta.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gcc-clang:
    name: U8L10 real deep clones and source seal (GCC / Clang)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Compile independent clone probes and all safe counterexamples
        run: |
          for compiler in g++ clang++; do
            python3 -B scripts/curriculum/test_cpp_polymorphic_clone.py \
              --compiler "$compiler"
          done
          python3 -B -m unittest discover -s scripts/curriculum \
            -p test_cpp_polymorphic_clone_authoring.py -v

  msvc:
    name: U8L10 portable deep cloning with Windows MSVC
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Compile independent clone probes and all safe counterexamples
        shell: cmd
        run: |
          python -B scripts\curriculum\test_cpp_polymorphic_clone.py --compiler cl --windows
          python -B -m unittest discover -s scripts\curriculum -p test_cpp_polymorphic_clone_authoring.py -v
