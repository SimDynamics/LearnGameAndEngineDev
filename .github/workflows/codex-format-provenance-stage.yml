name: Codex temporary source format provenance verification
on:
  push:
    branches: [Codex]
    paths: [.github/workflows/codex-format-provenance-stage.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reproduce confirmed boundary failures and test the exact guarded patch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -u - <<'PY'
          import subprocess
          archived='b392fb559f10073aabbef58e148359d9c6dc5446'
          workflow='.github/workflows/codex-format-provenance-stage.yml'
          assert subprocess.check_output(['git','rev-parse','HEAD^'],text=True).strip()==archived
          source=subprocess.check_output(['git','show',archived+':'+workflow],text=True,encoding='utf-8')
          lines=source.splitlines()
          scripts=[]
          i=0
          while i<len(lines):
              if lines[i]=='        run: |':
                  i+=1
                  code=[]
                  while i<len(lines) and (lines[i].startswith('          ') or not lines[i]):
                      code.append(lines[i][10:] if lines[i] else '')
                      i+=1
                  scripts.append('\n'.join(code)+'\n')
              else:
                  i+=1
          assert len(scripts)==4
          old="assert subprocess.check_output(['git', 'rev-parse', 'HEAD^'], text=True).strip() == base"
          assert scripts[0].count(old)==1
          scripts[0]=scripts[0].replace(old,"assert subprocess.check_output(['git', 'rev-parse', 'HEAD^'], text=True).strip() == '"+archived+"'",1)
          old="assert accepts(relative, detached), 'Expected detached-original provenance reproduction'"
          assert scripts[0].count(old)==1
          scripts[0]=scripts[0].replace(old,"assert not accepts(relative, detached), 'Existing closed-source protection must remain intact'",1)
          scripts[0]=scripts[0].replace('REPRODUCED: wrong lesson pathname, detached earlier source, and non-integer coordinates accepted','REPRODUCED: wrong lesson pathname and non-integer coordinates accepted; detached closed source already rejected')
          old="        self.assertIn('explanation', detached['compileCheck'])\n        detached['compileCheck']['explanation'] += ' Texto no publicado.'"
          assert scripts[1].count(old)==1
          scripts[1]=scripts[1].replace(old,"        detached['compileCheck']['explanation'] = detached['compileCheck'].get('explanation', '') + ' Texto no publicado.'",1)
          for number,code in enumerate(scripts,1):
              print('::group::Verified isolated stage '+str(number),flush=True)
              subprocess.run(['bash','-euo','pipefail','-c',code],check=True)
              print('::endgroup::',flush=True)
          PY
