name: Windows curricular reader build and project history UI

on:
  push:
    branches: [Codex]
    paths:
      - .github/workflows/windows-reader-build.yml
      - scripts/windows/Test-NativeCurricularCI.ps1
      - scripts/windows/Prepare-VirtualAudioCI.ps1
      - scripts/windows/install_ci_audio_device.py
      - app/src/main/java/com/learngraphicsprogramming/app/narration/KokoroVoiceCatalog.kt
      - CMakeLists.txt
      - cmake/**
      - toolchains/windows.versions.json
      - toolchains/windows.hosted-msvc.json
      - native/core/**
      - native/platform/windows/**
      # Test-only source is exercised by codex-compiler-guidance-source.yml.
      # No pinned full-app or narration rebuild is needed for isolated QA edits.
      - '!native/platform/windows/matching_rename_composition_state_tests.cpp'
      - native/presentation/windows/**
      # Catalog discovery and progress read indexed lessons in every course.
      # Cover future course IDs without triggering on images or audio files.
      - app/src/main/assets/content/**/courses.json
      - app/src/main/assets/content/**/course_*.json
      - app/src/main/assets/content/**/unit_*.json
      - app/src/main/assets/content/**/lesson_*.json
      # These exact Python sources are executed by this workflow. Changes to
      # contract validation/tests must not skip Windows CI.
      - scripts/curriculum/stable_state_layout.py
      - scripts/curriculum/code_format_compat.py
      - scripts/curriculum/test_code_format_compat.py
      - scripts/curriculum/course_edition.py
      - scripts/curriculum/course_edition_fixture_source.py
      - scripts/curriculum/test_course_edition.py
      - scripts/curriculum/test_cmake_graph_checks.py
      - scripts/curriculum/test_open_battery_contract.py
      - scripts/curriculum/test_reduction_contract.py
      - scripts/curriculum/test_integer_battery_contract.py
      - scripts/curriculum/test_named_rule_checks.py
      - scripts/curriculum/simulation.py
      - scripts/curriculum/test_simulation.py
      - scripts/curriculum/verificar_secuencia_pedagogica.py
      - docs/examples/array_runs_simulation.json
      - scripts/curriculum/retirement_fixture_source.py
      - scripts/curriculum/u1_main_edition_fixture_source.py
      - scripts/curriculum/diagnostic_fixture_source.py
      - scripts/curriculum/test_general_choice_editorial.py
      - scripts/curriculum/test_ordinary_explanation_revision.py
      - scripts/curriculum/test_published_u12_question_editorials.py
      - scripts/curriculum/test_programming_multicourse_validation.py
      - scripts/curriculum/editorial_fixture_history.py
      - scripts/curriculum/code_format_fixture_source.py
      - scripts/curriculum/text_semantics.py
      - scripts/curriculum/validar_json_programacion.py
      - scripts/curriculum/validate_programming_practice_tools.py
  workflow_dispatch:
    inputs:
      evaluate_virtual_audio:
        description: 'Evaluate the signed audio endpoint on this disposable hosted runner'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # Explicit focal evaluations use separate queues and cannot replace a
  # waiting full ReaderBuild execution.
  group: windows-reader-build-${{ github.ref }}${{ github.event_name == 'push' && startsWith(github.event.head_commit.message, 'qa-reader-revision:') && '-reader-revision' || github.event_name == 'push' && startsWith(github.event.head_commit.message, 'qa-native-catalog-u1:') && '-catalog-u1' || github.event_name == 'push' && startsWith(github.event.head_commit.message, 'qa-curricular-u2l5-archive:') && '-u2l5-archive' || '' }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ github.event_name == 'push' && startsWith(github.event.head_commit.message, 'qa-reader-revision:') && 'Verify automatic reading order after a live content edit' || github.event_name == 'push' && startsWith(github.event.head_commit.message, 'qa-native-catalog-u1:') && 'Verify the complete native catalog and four U1 editor regressions' || 'Compile original readers and verify catalog, choice revisions and project history' }}
    # This one opt-in runs the original archived reader in its dedicated suite.
    # All ordinary pushes and manual dispatch keep their complete build.
    if: ${{ github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'qa-curricular-u2l5-archive:') }}
    runs-on: windows-2025-vs2026
    # A verified full reader build already needs about 39 minutes on the
    # hosted runner. U1 now also builds the separate historical-contract
    # executable and runs the real compiler/editors plus ordering help.
    # Preserve the exact pinned MSVC and every per-test CTest timeout while
    # allowing the additional work to finish on a busy Windows runner.
    timeout-minutes: 60
    env:
      # Explicit prefixes select the catalog/U1 or live reader regression.
      # Normal pushes and manual dispatch retain all 98 ReaderBuild cases.
      LGAED_NATIVE_QA_SUITE: ${{ github.event_name == 'push' && startsWith(github.event.head_commit.message, 'qa-reader-revision:') && 'ReaderRevision' || github.event_name == 'push' && startsWith(github.event.head_commit.message, 'qa-native-catalog-u1:') && 'CatalogU1' || 'ReaderBuild' }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Read the source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fail early if hosted Windows lacks the exact declared MSVC
        run: .\scripts\windows\Test-NativeCurricularCI.ps1 -Suite $env:LGAED_NATIVE_QA_SUITE -MsvcPreflightOnly
      - name: Select the declared Python version
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.15.2'
      - name: Verify fourteen historical line-order refinements and source-preservation guards
        if: env.LGAED_NATIVE_QA_SUITE != 'ReaderRevision'
        run: python -B -m unittest discover -s scripts/curriculum -p test_order_line_refinement.py -v
      - name: Verify CMake graph declarations preserve published lessons
        if: env.LGAED_NATIVE_QA_SUITE != 'ReaderRevision'
        run: python -B -m unittest discover -s scripts/curriculum -p test_cmake_graph_checks.py -v
      - name: Verify source-format revisions and matching Python-native line guards
        if: env.LGAED_NATIVE_QA_SUITE != 'ReaderRevision'
        run: python -B -m unittest discover -s scripts/curriculum -p test_code_format_compat.py -v
      - name: Verify open battery declarations and stable original owners
        if: env.LGAED_NATIVE_QA_SUITE != 'ReaderRevision'
        run: python -B -m unittest discover -s scripts/curriculum -p test_open_battery_contract.py -v
      - name: Verify stateful reduction declarations and original owner preservation
        if: env.LGAED_NATIVE_QA_SUITE != 'ReaderRevision'
        run: python -B -m unittest discover -s scripts/curriculum -p test_reduction_contract.py -v
      - name: Verify integer batteries and earlier client preservation
        if: env.LGAED_NATIVE_QA_SUITE != 'ReaderRevision'
        run: python -B -m unittest discover -s scripts/curriculum -p test_integer_battery_contract.py -v
      - name: Verify named-rule battery contracts and legacy compatibility
        if: env.LGAED_NATIVE_QA_SUITE != 'ReaderRevision'
        run: python -B -m unittest discover -s scripts/curriculum -p test_named_rule_checks.py -v
      - name: Verify course-edition authoring and Ninja fixture tree safety
        if: env.LGAED_NATIVE_QA_SUITE != 'ReaderRevision'
        run: python -B -m unittest discover -s scripts/curriculum -p test_course_edition.py -v
      - name: Verify authenticated choice and ordinary editorial revisions
        if: env.LGAED_NATIVE_QA_SUITE != 'ReaderRevision'
        run: python -B -m unittest discover -s scripts/curriculum -p test_general_choice_editorial.py -v
      - name: Verify optional explanations against archived U1L4 and unchanged answer contracts
        if: env.LGAED_NATIVE_QA_SUITE != 'ReaderRevision'
        run: python -B -m unittest discover -s scripts/curriculum -p test_ordinary_explanation_revision.py -v
      - name: Verify every programming course uses the complete indexed contract
        if: env.LGAED_NATIVE_QA_SUITE != 'ReaderRevision'
        run: python -B -m unittest discover -s scripts/curriculum -p test_programming_multicourse_validation.py -v
      # Endpoint evaluation is opt-in for this disposable hosted run only:
      # select the dispatch input or an explicit audio/reader evaluation prefix.
      # This is no permanent driver deployment and downloads no TTS models.
      # ReaderBuild retains all 98 tests; a missing playback endpoint remains a failure.
      - name: Compile the selected Windows QA suite and execute its complete tests
        env:
          LGAED_EVALUATE_VIRTUAL_AUDIO: ${{ (github.event_name == 'workflow_dispatch' && inputs.evaluate_virtual_audio) || (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'qa-reader-build-audio:')) || (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'qa-curricular-current-readers:')) || (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'qa-reader-revision:')) }}
        run: |
          $qaEvaluateAudio = $env:LGAED_NATIVE_QA_SUITE -in @('ReaderBuild', 'ReaderRevision') -and $env:LGAED_EVALUATE_VIRTUAL_AUDIO -eq 'true'
          .\scripts\windows\Test-NativeCurricularCI.ps1 -Suite $env:LGAED_NATIVE_QA_SUITE -VirtualAudio:$qaEvaluateAudio
      - name: Preserve configure and compilation results
        if: always() && env.LGAED_NATIVE_QA_SUITE == 'ReaderBuild'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-reader-build-${{ github.sha }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            out/qa/reader-build-ci/CMakeFiles/CMakeConfigureLog.yaml
            out/qa/reader-build-ci/native-build.log
            out/qa/reader-build-ci/audio-environment.log
            out/qa/reader-build-ci/virtual-audio/*.log
            out/qa/reader-build-ci/virtual-audio/*.json
            out/qa/reader-build-ci/reader-revision-catalog.log
            out/qa/reader-build-ci/reader-revision-runtime-*/transport.jsonl
            out/qa/reader-build-ci/test-fixtures/reader-revision/*.json
            out/narration/runtime.json
            out/qa/reader-build-ci/reader-build-results.json
            out/qa/reader-build-ci/reader-build-focal.xml
            out/qa/reader-build-ci/reader-build-focal.log
            out/qa/reader-build-ci/reader-build-regressions.xml
            out/qa/reader-build-ci/reader-build-regressions.log
            out/qa/reader-build-ci/simulation-results.xml
            out/qa/reader-build-ci/lesson-gesture-results.xml
            out/qa/reader-build-ci/CTestTestfile.cmake
            out/qa/reader-build-ci/Testing/Temporary/*.log
            out/qa/reader-build-ci/simulation-captures/**
      - name: Preserve the complete catalog and U1 regression evidence
        if: always() && env.LGAED_NATIVE_QA_SUITE == 'CatalogU1'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-catalog-u1-${{ github.sha }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            out/qa/catalog-u1-ci/CMakeFiles/CMakeConfigureLog.yaml
            out/qa/catalog-u1-ci/native-build.log
            out/qa/catalog-u1-ci/catalog-u1-results.xml
            out/qa/catalog-u1-ci/catalog-u1-results.log
            out/qa/catalog-u1-ci/CTestTestfile.cmake
            out/qa/catalog-u1-ci/Testing/Temporary/*.log
      - name: Preserve live content reload and reading order evidence
        if: always() && env.LGAED_NATIVE_QA_SUITE == 'ReaderRevision'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-reader-revision-${{ github.sha }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            out/qa/reader-revision-ci/CMakeFiles/CMakeConfigureLog.yaml
            out/qa/reader-revision-ci/native-build.log
            out/qa/reader-revision-ci/audio-environment.log
            out/qa/reader-revision-ci/virtual-audio/*.log
            out/qa/reader-revision-ci/virtual-audio/*.json
            out/qa/reader-revision-ci/reader-revision-catalog.log
            out/qa/reader-revision-ci/reader-revision-runtime-*/transport.jsonl
            out/qa/reader-revision-ci/reader-revision-live-file-*/active-lesson.json
            out/qa/reader-revision-ci/test-fixtures/reader-revision/*.json
            out/qa/reader-revision-ci/reader-revision-results.xml
            out/qa/reader-revision-ci/reader-revision-results.log
            out/qa/reader-revision-ci/CTestTestfile.cmake
            out/qa/reader-revision-ci/Testing/Temporary/*.log
