name: Windows curricular reader build and project history UI

on:
  push:
    branches: [Codex]
    paths:
      - .github/workflows/windows-reader-build.yml
      - scripts/windows/Test-NativeCurricularCI.ps1
      - scripts/windows/test_native_header_dependencies.py
      - scripts/windows/Prepare-VirtualAudioCI.ps1
      - scripts/windows/install_ci_audio_device.py
      - app/src/main/java/com/learngraphicsprogramming/app/narration/KokoroVoiceCatalog.kt
      - CMakeLists.txt
      - cmake/**
      - toolchains/windows.versions.json
      - toolchains/windows.hosted-msvc.json
      - native/core/**
      - native/platform/windows/**
      # Test-only source is exercised by codex-compiler-guidance-source.yml.
      # No pinned full-app or narration rebuild is needed for isolated QA edits.
      - '!native/platform/windows/matching_rename_composition_state_tests.cpp'
      - native/presentation/windows/**
      # The reader prepares concept diagrams through these real worker sources.
      - native/narration/worker/WindowsSemanticFields.kt
      - native/narration/worker/build_worker.py
      - native/narration/worker/test_curriculum_visible_semantics.py
      # Catalog discovery and progress read indexed lessons in every course.
      # Cover future course IDs without triggering on images or audio files.
      - app/src/main/assets/content/**/courses.json
      - app/src/main/assets/content/**/course_*.json
      - app/src/main/assets/content/**/unit_*.json
      - app/src/main/assets/content/**/lesson_*.json
      # These exact Python sources are executed by this workflow. Changes to
      # contract validation/tests must not skip Windows CI.
      - scripts/curriculum/stable_state_layout.py
      - scripts/curriculum/test_retired_state_layout.py
      - scripts/curriculum/code_scope_presentations.py
      - scripts/curriculum/test_code_scope_presentations.py
      - scripts/curriculum/test_code_scope_reading.py
      - scripts/curriculum/concept_diagram.py
      - scripts/curriculum/test_concept_diagram.py
      - docs/examples/concept_diagram_memory_console.json
      - scripts/curriculum/code_scope_fixture_source.py
      - scripts/curriculum/code_format_compat.py
      - scripts/curriculum/test_code_format_compat.py
      - scripts/curriculum/course_edition.py
      - scripts/curriculum/course_edition_fixture_source.py
      - scripts/curriculum/test_course_edition.py
      - scripts/curriculum/test_cmake_graph_checks.py
      - scripts/curriculum/test_open_battery_contract.py
      - scripts/curriculum/test_reduction_contract.py
      - scripts/curriculum/test_integer_battery_contract.py
      - scripts/curriculum/test_named_rule_checks.py
      - scripts/curriculum/simulation.py
      - scripts/curriculum/test_simulation.py
      - scripts/curriculum/verificar_secuencia_pedagogica.py
      - docs/examples/array_runs_simulation.json
      - scripts/curriculum/retirement_fixture_source.py
      - scripts/curriculum/u1_main_edition_fixture_source.py
      - scripts/curriculum/diagnostic_fixture_source.py
      - scripts/curriculum/test_general_choice_editorial.py
      - scripts/curriculum/test_ordinary_explanation_revision.py
      - scripts/curriculum/test_published_u12_question_editorials.py
      - scripts/curriculum/test_programming_multicourse_validation.py
      - scripts/curriculum/editorial_fixture_history.py
      - scripts/curriculum/code_format_fixture_source.py
      - scripts/curriculum/text_semantics.py
      - scripts/curriculum/validar_json_programacion.py
      - scripts/curriculum/validate_programming_practice_tools.py
  workflow_dispatch:
    inputs:
      evaluate_virtual_audio:
        description: 'Evaluate the signed audio endpoint on this disposable hosted runner'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # Explicit focal evaluations use separate queues and cannot replace a
  # waiting full ReaderBuild execution.
  group: windows-reader-build-${{ github.ref }}${{ github.event_name == 'push' && startsWith(github.event.head_commit.message, 'qa-reader-revision-regressions:') && '-reader-revision-regressions' || github.event_name == 'push' && startsWith(github.event.head_commit.message, 'qa-code-scope-history:') && '-code-scope-history' || github.event_name == 'push' && startsWith(github.event.head_commit.message, 'qa-code-scope:') && '-code-scope' || github.event_name == 'push' && (startsWith(github.event.head_commit.message, 'qa-reader-revision:') || startsWith(github.event.head_commit.message, 'qa-native-headers:')) && '-reader-revision' || github.event_name == 'push' && startsWith(github.event.head_commit.message, 'qa-native-catalog-u1:') && '-catalog-u1' || github.event_name == 'push' && startsWith(github.event.head_commit.message, 'qa-curricular-u2l5-archive:') && '-u2l5-archive' || '' }}
  cancel-in-progress: false

jobs:
  # Group complete authoring contracts without recompiling native sources.
  # The pinned scope guard keeps this batch separate from reader builds.
  code-scope-history:
    name: Verify publication chains and empty-text simulation authoring
    if: ${{ github.event_name == 'push' && startsWith(github.event.head_commit.message, 'qa-code-scope-history:') }}
    runs-on: windows-2025-vs2026
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Read the complete publication history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the grouped authoring batch has its declared scope
        run: |
          $ErrorActionPreference = 'Stop'
          $qaBase = '229c6e2b9d77b889f842c59a4ce825c2e0194dc4'
          git merge-base --is-ancestor $qaBase HEAD
          if ($LASTEXITCODE -ne 0) { throw 'The authenticated source revision must be an ancestor of this follow-up.' }
          $qaAllowed = @('scripts/curriculum/test_code_scope_presentations.py', '.github/workflows/windows-reader-build.yml', '.github/workflows/codex-batched-client-split.yml')
          $qaChanged = @(git diff --name-only --no-renames $qaBase HEAD)
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect the exact code-scope history revision.' }
          $qaUnexpected = @($qaChanged | Where-Object { $_ -notin $qaAllowed })
          if ($qaChanged.Count -eq 0 -or $qaUnexpected.Count -ne 0) {
            throw ('Code-scope history QA requires its narrow test/workflow diff: ' + ($qaUnexpected -join ', '))
          }
      - name: Select the declared Python version
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.15.2'
      - name: Verify code scopes against each authenticated editorial publication
        working-directory: scripts/curriculum
        run: python -B -m unittest -v test_code_scope_presentations.CodeScopePresentationTest
      - name: Verify existing publication-chain rejection controls
        working-directory: scripts/curriculum
        run: python -B -m unittest -v test_retired_state_layout.RetirementPublicationChainTest
      - name: Verify the complete empty-text simulation authoring contract
        run: python -B -m unittest discover -s scripts/curriculum -p test_simulation.py -v

  build:
    name: ${{ github.event_name == 'push' && startsWith(github.event.head_commit.message, 'qa-reader-revision-regressions:') && 'Verify seven reader revision regressions with real Windows playback' || github.event_name == 'push' && startsWith(github.event.head_commit.message, 'qa-code-scope:') && 'Verify nested code scopes and authentic publication retirement chains' || github.event_name == 'push' && (startsWith(github.event.head_commit.message, 'qa-reader-revision:') || startsWith(github.event.head_commit.message, 'qa-native-headers:')) && 'Verify automatic reading order after a live content edit' || github.event_name == 'push' && startsWith(github.event.head_commit.message, 'qa-native-catalog-u1:') && 'Verify the complete native catalog and four U1 editor regressions' || 'Compile original readers and verify catalog, choice revisions and project history' }}
    # Archived-reader and Python-only history checks have dedicated jobs.
    # All ordinary pushes and manual dispatch keep their complete build.
    if: ${{ github.event_name != 'push' || (!startsWith(github.event.head_commit.message, 'qa-curricular-u2l5-archive:') && !startsWith(github.event.head_commit.message, 'qa-code-scope-history:')) }}
    runs-on: windows-2025-vs2026
    # A verified full reader build already needs about 39 minutes on the
    # hosted runner. U1 now also builds the separate historical-contract
    # executable and runs the real compiler/editors plus ordering help.
    # Preserve the exact pinned MSVC and every per-test CTest timeout while
    # allowing the additional work to finish on a busy Windows runner.
    timeout-minutes: 60
    env:
      # Explicit prefixes select catalog/U1, live reload, seven reader regressions or code-scope QA.
      # Normal pushes and manual dispatch retain all 98 ReaderBuild cases.
      LGAED_NATIVE_QA_SUITE: ${{ github.event_name == 'push' && startsWith(github.event.head_commit.message, 'qa-reader-revision-regressions:') && 'ReaderRevisionRegressions' || github.event_name == 'push' && startsWith(github.event.head_commit.message, 'qa-code-scope:') && 'CodeScope' || github.event_name == 'push' && (startsWith(github.event.head_commit.message, 'qa-reader-revision:') || startsWith(github.event.head_commit.message, 'qa-native-headers:')) && 'ReaderRevision' || github.event_name == 'push' && startsWith(github.event.head_commit.message, 'qa-native-catalog-u1:') && 'CatalogU1' || 'ReaderBuild' }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Read the source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fail early if hosted Windows lacks the exact declared MSVC
        run: .\scripts\windows\Test-NativeCurricularCI.ps1 -Suite $env:LGAED_NATIVE_QA_SUITE -MsvcPreflightOnly
      - name: Select the declared Python version
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.15.2'
      # Focused native suites run their own complete CTest selection. Python
      # authoring regressions remain enabled for the complete ReaderBuild suite.
      - name: Verify fourteen historical line-order refinements and source-preservation guards
        if: env.LGAED_NATIVE_QA_SUITE != 'ReaderRevision' && env.LGAED_NATIVE_QA_SUITE != 'CodeScope' && env.LGAED_NATIVE_QA_SUITE != 'CatalogU1' && env.LGAED_NATIVE_QA_SUITE != 'ReaderRevisionRegressions'
        run: python -B -m unittest discover -s scripts/curriculum -p test_order_line_refinement.py -v
      - name: Verify CMake graph declarations preserve published lessons
        if: env.LGAED_NATIVE_QA_SUITE != 'ReaderRevision' && env.LGAED_NATIVE_QA_SUITE != 'CodeScope' && env.LGAED_NATIVE_QA_SUITE != 'CatalogU1' && env.LGAED_NATIVE_QA_SUITE != 'ReaderRevisionRegressions'
        run: python -B -m unittest discover -s scripts/curriculum -p test_cmake_graph_checks.py -v
      - name: Verify source-format revisions and matching Python-native line guards
        if: env.LGAED_NATIVE_QA_SUITE != 'ReaderRevision' && env.LGAED_NATIVE_QA_SUITE != 'CodeScope' && env.LGAED_NATIVE_QA_SUITE != 'CatalogU1' && env.LGAED_NATIVE_QA_SUITE != 'ReaderRevisionRegressions'
        run: python -B -m unittest discover -s scripts/curriculum -p test_code_format_compat.py -v
      - name: Verify open battery declarations and stable original owners
        if: env.LGAED_NATIVE_QA_SUITE != 'ReaderRevision' && env.LGAED_NATIVE_QA_SUITE != 'CodeScope' && env.LGAED_NATIVE_QA_SUITE != 'CatalogU1' && env.LGAED_NATIVE_QA_SUITE != 'ReaderRevisionRegressions'
        run: python -B -m unittest discover -s scripts/curriculum -p test_open_battery_contract.py -v
      - name: Verify stateful reduction declarations and original owner preservation
        if: env.LGAED_NATIVE_QA_SUITE != 'ReaderRevision' && env.LGAED_NATIVE_QA_SUITE != 'CodeScope' && env.LGAED_NATIVE_QA_SUITE != 'CatalogU1' && env.LGAED_NATIVE_QA_SUITE != 'ReaderRevisionRegressions'
        run: python -B -m unittest discover -s scripts/curriculum -p test_reduction_contract.py -v
      - name: Verify integer batteries and earlier client preservation
        if: env.LGAED_NATIVE_QA_SUITE != 'ReaderRevision' && env.LGAED_NATIVE_QA_SUITE != 'CodeScope' && env.LGAED_NATIVE_QA_SUITE != 'CatalogU1' && env.LGAED_NATIVE_QA_SUITE != 'ReaderRevisionRegressions'
        run: python -B -m unittest discover -s scripts/curriculum -p test_integer_battery_contract.py -v
      - name: Verify named-rule battery contracts and legacy compatibility
        if: env.LGAED_NATIVE_QA_SUITE != 'ReaderRevision' && env.LGAED_NATIVE_QA_SUITE != 'CodeScope' && env.LGAED_NATIVE_QA_SUITE != 'CatalogU1' && env.LGAED_NATIVE_QA_SUITE != 'ReaderRevisionRegressions'
        run: python -B -m unittest discover -s scripts/curriculum -p test_named_rule_checks.py -v
      - name: Verify course-edition authoring and Ninja fixture tree safety
        if: env.LGAED_NATIVE_QA_SUITE != 'ReaderRevision' && env.LGAED_NATIVE_QA_SUITE != 'CodeScope' && env.LGAED_NATIVE_QA_SUITE != 'CatalogU1' && env.LGAED_NATIVE_QA_SUITE != 'ReaderRevisionRegressions'
        run: python -B -m unittest discover -s scripts/curriculum -p test_course_edition.py -v
      - name: Verify authenticated choice and ordinary editorial revisions
        if: env.LGAED_NATIVE_QA_SUITE != 'ReaderRevision' && env.LGAED_NATIVE_QA_SUITE != 'CodeScope' && env.LGAED_NATIVE_QA_SUITE != 'CatalogU1' && env.LGAED_NATIVE_QA_SUITE != 'ReaderRevisionRegressions'
        run: python -B -m unittest discover -s scripts/curriculum -p test_general_choice_editorial.py -v
      - name: Verify optional explanations against archived U1L4 and unchanged answer contracts
        if: env.LGAED_NATIVE_QA_SUITE != 'ReaderRevision' && env.LGAED_NATIVE_QA_SUITE != 'CodeScope' && env.LGAED_NATIVE_QA_SUITE != 'CatalogU1' && env.LGAED_NATIVE_QA_SUITE != 'ReaderRevisionRegressions'
        run: python -B -m unittest discover -s scripts/curriculum -p test_ordinary_explanation_revision.py -v
      - name: Verify every programming course uses the complete indexed contract
        if: env.LGAED_NATIVE_QA_SUITE != 'ReaderRevision' && env.LGAED_NATIVE_QA_SUITE != 'CodeScope' && env.LGAED_NATIVE_QA_SUITE != 'CatalogU1' && env.LGAED_NATIVE_QA_SUITE != 'ReaderRevisionRegressions'
        run: python -B -m unittest discover -s scripts/curriculum -p test_programming_multicourse_validation.py -v
      # ReaderBuild includes eight revision tests with real Windows playback,
      # so its disposable hosted runner requires the verified audio endpoint.
      # Other suites retain their explicit evaluation prefixes or dispatch input.
      # This prepares only the hosted QA runner and downloads no TTS models.
      # ReaderBuild retains all 98 tests; a missing playback endpoint remains a failure.
      - name: Compile the selected Windows QA suite and execute its complete tests
        env:
          LGAED_EVALUATE_VIRTUAL_AUDIO: ${{ env.LGAED_NATIVE_QA_SUITE == 'ReaderBuild' || env.LGAED_NATIVE_QA_SUITE == 'ReaderRevisionRegressions' || (github.event_name == 'workflow_dispatch' && inputs.evaluate_virtual_audio) || (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'qa-reader-build-audio:')) || (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'qa-curricular-current-readers:')) || (github.event_name == 'push' && (startsWith(github.event.head_commit.message, 'qa-reader-revision:') || startsWith(github.event.head_commit.message, 'qa-native-headers:'))) || (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'qa-code-scope:')) }}
        run: |
          $qaEvaluateAudio = $env:LGAED_NATIVE_QA_SUITE -in @('ReaderBuild', 'ReaderRevision', 'ReaderRevisionRegressions', 'CodeScope') -and $env:LGAED_EVALUATE_VIRTUAL_AUDIO -eq 'true'
          .\scripts\windows\Test-NativeCurricularCI.ps1 -Suite $env:LGAED_NATIVE_QA_SUITE -VirtualAudio:$qaEvaluateAudio
      - name: Preserve configure and compilation results
        if: always() && env.LGAED_NATIVE_QA_SUITE == 'ReaderBuild'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-reader-build-${{ github.sha }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            out/qa/reader-build-ci/CMakeFiles/CMakeConfigureLog.yaml
            out/qa/reader-build-ci/native-build.log
            out/qa/reader-build-ci/audio-environment.log
            out/qa/reader-build-ci/virtual-audio/*.log
            out/qa/reader-build-ci/virtual-audio/*.json
            out/qa/reader-build-ci/reader-revision-catalog.log
            out/qa/reader-build-ci/reader-revision-runtime-*/transport.jsonl
            out/qa/reader-build-ci/test-fixtures/reader-revision/*.json
            out/narration/runtime.json
            out/qa/reader-build-ci/reader-build-results.json
            out/qa/reader-build-ci/reader-build-focal.xml
            out/qa/reader-build-ci/reader-build-focal.log
            out/qa/reader-build-ci/reader-build-regressions.xml
            out/qa/reader-build-ci/reader-build-regressions.log
            out/qa/reader-build-ci/simulation-results.xml
            out/qa/reader-build-ci/lesson-gesture-results.xml
            out/qa/reader-build-ci/CTestTestfile.cmake
            out/qa/reader-build-ci/Testing/Temporary/*.log
            out/qa/reader-build-ci/simulation-captures/**
      - name: Preserve the complete catalog and U1 regression evidence
        if: always() && env.LGAED_NATIVE_QA_SUITE == 'CatalogU1'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-catalog-u1-${{ github.sha }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            out/qa/catalog-u1-ci/CMakeFiles/CMakeConfigureLog.yaml
            out/qa/catalog-u1-ci/native-build.log
            out/qa/catalog-u1-ci/catalog-u1-results.xml
            out/qa/catalog-u1-ci/catalog-u1-results.log
            out/qa/catalog-u1-ci/CTestTestfile.cmake
            out/qa/catalog-u1-ci/Testing/Temporary/*.log
      - name: Preserve live content reload and reading order evidence
        if: always() && env.LGAED_NATIVE_QA_SUITE == 'ReaderRevision'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-reader-revision-${{ github.sha }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            out/qa/reader-revision-ci/CMakeFiles/CMakeConfigureLog.yaml
            out/qa/reader-revision-ci/native-build.log
            out/qa/reader-revision-ci/native-header-dependencies/**/*.json
            out/qa/reader-revision-ci/native-header-dependencies/**/*.log
            out/qa/reader-revision-ci/native-header-dependencies/**/CMakeCache.txt
            out/qa/reader-revision-ci/native-header-dependencies/**/build.ninja
            out/qa/reader-revision-ci/native-header-dependencies/**/rules.ninja
            out/qa/reader-revision-ci/native-header-dependencies/**/CMakeConfigureLog.yaml
            out/qa/reader-revision-ci/native-header-dependencies/**/src/CMakeLists.txt
            out/qa/reader-revision-ci/native-header-dependencies/**/src/*.cpp
            out/qa/reader-revision-ci/native-header-dependencies/**/src/*.hpp
            out/qa/reader-revision-ci/native-header-dependencies/**/src/policy-mode.txt
            out/qa/reader-revision-ci/native-header-dependencies/**/evidence/scan-*-graph.txt
            out/qa/reader-revision-ci/audio-environment.log
            out/qa/reader-revision-ci/virtual-audio/*.log
            out/qa/reader-revision-ci/virtual-audio/*.json
            out/qa/reader-revision-ci/reader-revision-catalog.log
            out/qa/reader-revision-ci/reader-revision-runtime-*/transport.jsonl
            out/qa/reader-revision-ci/reader-revision-live-file-*/active-lesson.json
            out/qa/reader-revision-ci/test-fixtures/reader-revision/*.json
            out/qa/reader-revision-ci/reader-revision-results.xml
            out/qa/reader-revision-ci/reader-revision-results.log
            out/qa/reader-revision-ci/CTestTestfile.cmake
            out/qa/reader-revision-ci/Testing/Temporary/*.log
      - name: Preserve the seven reader revision regression results
        if: always() && env.LGAED_NATIVE_QA_SUITE == 'ReaderRevisionRegressions'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-reader-revision-regressions-${{ github.sha }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            out/qa/reader-revision-regressions-ci/CMakeFiles/CMakeConfigureLog.yaml
            out/qa/reader-revision-regressions-ci/native-build.log
            out/qa/reader-revision-regressions-ci/audio-environment.log
            out/qa/reader-revision-regressions-ci/virtual-audio/*.log
            out/qa/reader-revision-regressions-ci/virtual-audio/*.json
            out/qa/reader-revision-regressions-ci/reader-revision-catalog.log
            out/qa/reader-revision-regressions-ci/reader-revision-runtime-*/transport.jsonl
            out/qa/reader-revision-regressions-ci/test-fixtures/reader-revision/*.json
            out/qa/reader-revision-regressions-ci/reader-revision-regressions-tests.json
            out/qa/reader-revision-regressions-ci/reader-revision-regressions-results.xml
            out/qa/reader-revision-regressions-ci/reader-revision-regressions-results.log
            out/qa/reader-revision-regressions-ci/CTestTestfile.cmake
            out/qa/reader-revision-regressions-ci/Testing/Temporary/*.log
      - name: Preserve native code scopes and publication-chain evidence
        if: always() && env.LGAED_NATIVE_QA_SUITE == 'CodeScope'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-code-scope-${{ github.sha }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            out/qa/code-scope-ci/CMakeFiles/CMakeConfigureLog.yaml
            out/qa/code-scope-ci/native-build.log
            out/qa/code-scope-ci/narration-tool-archives.json
            out/qa/code-scope-ci/narration-resources.log
            out/qa/code-scope-ci/audio-environment.log
            out/qa/code-scope-ci/virtual-audio/*.log
            out/qa/code-scope-ci/virtual-audio/*.json
            out/narration/runtime.json
            out/qa/code-scope-ci/test-fixtures/code-scope/**
            out/qa/code-scope-ci/test-fixtures/concept-diagram/**
            out/qa/code-scope-ci/code-scope-captures/**/*.png
            out/qa/code-scope-ci/code-scope-results.xml
            out/qa/code-scope-ci/code-scope-results.log
            out/qa/code-scope-ci/CTestTestfile.cmake
            out/qa/code-scope-ci/Testing/Temporary/*.log
