name: Windows historical state import

on:
  push:
    branches: [Codex]
    paths:
      - .github/workflows/windows-state-import.yml
      - scripts/windows/Test-StateImportCI.ps1
      - scripts/windows/Test-NativeCurricularCI.ps1
      - CMakeLists.txt
      - cmake/**
      - toolchains/windows.versions.json
      - native/core/**
      - native/platform/windows/**
      - scripts/curriculum/**
      # Separate Windows QA checks do not modify state-import contracts.
      # Negations follow the broad script path and keep the native/core,
      # state-store and actual migration sources in this workflow.
      - '!scripts/curriculum/test_windows_ci_compilers.py'
      - '!scripts/curriculum/test_local_int_live_compilation.py'
      - '!scripts/curriculum/test_local_string_live_compilation.py'
      # Editorial-only authoring regressions run in codex-general-choice-editorial.yml.
      # They do not change the native StateStore or its Windows import runner.
      - '!scripts/curriculum/test_general_choice_revision_live.py'
      - '!scripts/curriculum/test_review_feedback_prose_revision.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-state-import-${{ github.ref }}
  cancel-in-progress: false

jobs:
  import:
    name: Published imports with the required Windows toolchain
    runs-on: windows-2025-vs2026
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Read the complete source history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select the declared Python version
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.15.2'
      - name: Test exact stderr authoring without changing published lessons
        run: python -B -m unittest discover -s scripts/curriculum -p test_cpp_stderr_exact_contract.py -v
      - name: Check semantic U3L6 runtime contract without modifying lesson assets
        run: python -B -m unittest discover -s scripts/curriculum -p test_u3_rejection_runtime_contract.py -v
      - name: Check original U3L8 report declarations against the stable state map
        run: python -B -m unittest discover -s scripts/curriculum -p test_u3_observation_runtime_contract.py -v
      - name: Verify U3L9 assertion declarations preserve source and NDEBUG order
        run: python -B -m unittest discover -s scripts/curriculum -p test_u3_assertion_runtime_contract.py -v
      - name: Check authored U12 question/explanation transitions without editing lessons
        run: python -B -m unittest discover -s scripts/curriculum -p test_published_u12_question_editorials.py -v
      - name: Verify historical U6L2 compileCheck formatting and reject forged diagnostics
        run: python -B -m unittest discover -s scripts/curriculum -p test_compile_check_source_format.py -v
      - name: Verify authenticated case permutations and published U11L7 history
        run: python -B -m unittest discover -s scripts/curriculum -p test_compiler_case_order.py -v
      - name: Verify authenticated case revisions and preserved AssetCheck programs
        run: python -B -m unittest discover -s scripts/curriculum -p test_compiler_case_revision.py -v
      - name: Fail early if hosted Windows lacks the exact declared MSVC
        run: .\scripts\windows\Test-NativeCurricularCI.ps1 -Suite StateImport -MsvcPreflightOnly
      - name: Verify MSVC and execute history, case-revision and exact stderr contracts
        run: .\scripts\windows\Test-StateImportCI.ps1
      - name: Preserve configure and test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-state-import-${{ github.sha }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            out/qa/state-import-ci/CMakeFiles/CMakeConfigureLog.yaml
            out/qa/state-import-ci/native-build.log
            out/qa/state-import-ci/CTestTestfile.cmake
            out/qa/state-import-ci/Testing/Temporary/*.log
            out/qa/state-import-ci/state-import-results.xml
            out/qa/state-import-ci/state-import-results.log
