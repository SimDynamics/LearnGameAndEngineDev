name: Windows historical state import

on:
  push:
    branches: [Codex]
    paths:
      - .github/workflows/windows-state-import.yml
      - scripts/windows/Test-StateImportCI.ps1
      - scripts/windows/Test-NativeCurricularCI.ps1
      - CMakeLists.txt
      - cmake/**
      - toolchains/windows.versions.json
      - native/core/**
      - native/platform/windows/**
      - scripts/curriculum/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-state-import-${{ github.ref }}
  cancel-in-progress: false

jobs:
  import:
    name: Published imports with the required Windows toolchain
    runs-on: windows-2025-vs2026
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Read the complete source history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select the declared Python version
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.15.2'
      - name: Test exact stderr authoring without changing published lessons
        run: python -B -m unittest discover -s scripts/curriculum -p test_cpp_stderr_exact_contract.py -v
      - name: Check semantic U3L6 runtime contract without modifying lesson assets
        run: python -B -m unittest discover -s scripts/curriculum -p test_u3_rejection_runtime_contract.py -v
      - name: Check original U3L8 report declarations against the stable state map
        run: python -B -m unittest discover -s scripts/curriculum -p test_u3_observation_runtime_contract.py -v
      - name: Verify U3L9 assertion declarations preserve source and NDEBUG order
        run: python -B -m unittest discover -s scripts/curriculum -p test_u3_assertion_runtime_contract.py -v
      - name: Verify historical U6L2 compileCheck formatting and reject forged diagnostics
        run: python -B -m unittest discover -s scripts/curriculum -p test_compile_check_source_format.py -v
      - name: Verify MSVC and execute four historical suites plus exact stderr contract
        run: .\scripts\windows\Test-StateImportCI.ps1
      - name: Preserve configure and test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-state-import-${{ github.sha }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            out/qa/state-import-ci/CMakeFiles/CMakeConfigureLog.yaml
            out/qa/state-import-ci/native-build.log
            out/qa/state-import-ci/CTestTestfile.cmake
            out/qa/state-import-ci/Testing/Temporary/*.log
            out/qa/state-import-ci/state-import-results.xml
            out/qa/state-import-ci/state-import-results.log
