name: Windows InspectionLog debugger captures

on:
  push:
    branches: [Codex]
    paths:
      - .github/workflows/windows-curricular-inspection.yml
      - scripts/windows/Capture-InspectionLog.ps1
  workflow_dispatch:
    inputs:
      mode:
        description: Probe checks the real IDE; Curriculum uses authored InspectionLog sources
        type: choice
        options: [Probe, Curriculum]
        default: Curriculum

permissions:
  contents: read

concurrency:
  group: windows-curricular-inspection-${{ github.ref }}
  cancel-in-progress: false

jobs:
  capture:
    name: Capture actual Visual Studio native debugging
    runs-on: windows-2025-vs2026
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Read the debugger capture recipe
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Compile, execute, debug and capture on isolated Windows
        timeout-minutes: 12
        env:
          CAPTURE_MODE: ${{ inputs.mode || 'Curriculum' }}
        run: |
          $qaPowerShell = Join-Path $env:WINDIR 'System32\WindowsPowerShell\v1.0\powershell.exe'
          & $qaPowerShell -NoLogo -NoProfile -NonInteractive -STA -ExecutionPolicy Bypass -File .\scripts\windows\Capture-InspectionLog.ps1 -Mode $env:CAPTURE_MODE
          if ($LASTEXITCODE -ne 0) { throw "The actual debugger capture failed with exit $LASTEXITCODE." }
      - name: Preserve real captures, source, compiler output and debugger observations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: inspection-log-${{ github.sha }}-${{ inputs.mode || 'Curriculum' }}
          retention-days: 14
          if-no-files-found: error
          path: out/qa/inspection-log/**
