name: Windows real narration player

on:
  push:
    branches: [Codex]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-narration-player-${{ github.ref }}
  cancel-in-progress: false

jobs:
  player:
    name: Real media clock and isolated recording paths
    # This is an explicit environment probe, not an automatic reader gate.
    # An explicit commit prefix works while the workflow exists only on Codex.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'qa-audio:')
    runs-on: windows-2025-vs2026
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Read the source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select the declared Python version
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.15.2'
      - name: Verify tools and execute the two real player tests
        run: .\scripts\windows\Test-NativeCurricularCI.ps1 -Suite NarrationPlayer
      - name: Preserve configure, audio environment and test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-narration-player-${{ github.sha }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            out/qa/narration-player-ci/CMakeFiles/CMakeConfigureLog.yaml
            out/qa/narration-player-ci/native-build.log
            out/qa/narration-player-ci/CTestTestfile.cmake
            out/qa/narration-player-ci/Testing/Temporary/*.log
            out/qa/narration-player-ci/audio-environment.log
            out/qa/narration-player-ci/narration-player-results.xml
            out/qa/narration-player-ci/narration-player-results.log
