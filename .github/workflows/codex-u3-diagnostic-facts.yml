name: Codex U3L6 diagnostic facts (Windows MSVC)

on:
  push:
    branches: [Codex]
    paths:
      - .github/workflows/codex-u3-diagnostic-facts.yml
      - native/core/rejection_diagnostic_facts.hpp
      - native/core/rejection_diagnostic_facts_tests.cpp
      - native/core/code_format_compat.hpp
      - native/platform/windows/u3_runtime_semantics_tests.cpp
      - scripts/curriculum/stable_state_layout.py
      - scripts/curriculum/code_format_compat.py
      - scripts/curriculum/text_semantics.py
      - scripts/curriculum/test_u3_rejection_runtime_contract.py
      - scripts/curriculum/test_u3_observation_runtime_contract.py
      - app/src/main/assets/content/es/programming/programming_practice_tools/comprobaciones_repetibles/lesson_diagnosticos_para_corregir_una_peticion.json
      - app/src/main/assets/content/es/programming/programming_practice_tools/comprobaciones_repetibles/lesson_automatizar_la_revision_sin_borrar_evidencia.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-contracts:
    runs-on: windows-2022
    timeout-minutes: 6
    env:
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.longpaths
      GIT_CONFIG_VALUE_0: 'true'
    steps:
      - name: Checkout exact Codex source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Select Python for native Windows QA
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify historical and published U3 runtime declarations
        shell: pwsh
        run: |
          python -B -m unittest discover -s scripts/curriculum -p test_u3_rejection_runtime_contract.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B -m unittest discover -s scripts/curriculum -p test_u3_observation_runtime_contract.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  windows-semantics:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - name: Checkout exact Codex source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare Visual C++ toolchain
        uses: ilammy/msvc-dev-cmd@v1
      - name: Compile independent diagnostic fact tests with MSVC
        shell: cmd
        run: |
          cl /nologo /std:c++latest /EHsc /W4 /WX /permissive- /Zc:__cplusplus /utf-8 /I native native\core\rejection_diagnostic_facts_tests.cpp /Fe:"%RUNNER_TEMP%\lgaed_u3_diagnostic_facts.exe"
      - name: Run MSVC equivalent intervals and negative cases
        shell: cmd
        run: '"%RUNNER_TEMP%\lgaed_u3_diagnostic_facts.exe"'
