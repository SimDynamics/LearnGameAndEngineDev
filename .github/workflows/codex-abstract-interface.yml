name: Codex U8L8 real abstract interface and polymorphic owner

on:
  push:
    branches: [Codex]
    paths:
      - .github/workflows/codex-abstract-interface.yml
      - scripts/curriculum/test_cpp_abstract_interface.py
      - scripts/curriculum/test_cpp_abstract_interface_core.py
      - scripts/curriculum/test_cpp_abstract_interface_authoring.py
      - scripts/curriculum/stable_state_layout.py
      - native/core/cpp_abstract_interface_check.hpp
      - native/core/cpp_abstract_interface_check_tests.cpp
      - native/core/cpp_multi_body_check.hpp
      - app/src/main/assets/content/es/programming/cpp_language_memory_oop/composicion_y_herencia_publica/lesson_definir_una_interfaz_abstracta.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable:
    name: U8L8 original polymorphism with GCC and Clang C++23
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Compile U8L8 genuine interfaces and reject stdout-only imitations
        run: |
          for compiler in g++ clang++; do
            python3 -B scripts/curriculum/test_cpp_abstract_interface.py \
              --compiler "$compiler"
            python3 -B scripts/curriculum/test_cpp_abstract_interface_core.py \
              --compiler "$compiler"
          done
          python3 -B -m unittest discover -s scripts/curriculum \
            -p test_cpp_abstract_interface_authoring.py -v

  windows-msvc:
    name: U8L8 original polymorphism with Windows MSVC C++23
    runs-on: windows-2022
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Compile real U8L8 on Windows and reject behavior falsification
        shell: cmd
        run: |
          python -B scripts\curriculum\test_cpp_abstract_interface.py --compiler cl --windows
          python -B scripts\curriculum\test_cpp_abstract_interface_core.py --compiler cl --windows
          python -B -m unittest discover -s scripts\curriculum -p test_cpp_abstract_interface_authoring.py -v
