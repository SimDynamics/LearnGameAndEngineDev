name: Codex general choice editorial regression on published course

on:
  push:
    branches: [Codex]
    paths:
      - .github/workflows/codex-general-choice-editorial.yml
      - scripts/curriculum/test_general_choice_revision_live.py
      - scripts/curriculum/test_review_feedback_prose_revision.py
      - scripts/curriculum/test_legacy_review_feedback_adoption.py
      - scripts/curriculum/test_cpp_review_feedback_contract.py
      - scripts/curriculum/u12_composed_output_fixture_source.py
      - scripts/curriculum/u12_composed_feedback_fixture_source.py
      - scripts/curriculum/u12_append_hypothesis_fixture_source.py
      - scripts/curriculum/compiler_import_fixture_source.py
      - scripts/curriculum/diagnostic_fixture_source.py
      - scripts/curriculum/stable_state_layout.py
      - scripts/curriculum/validar_json_programacion.py
      - scripts/curriculum/text_semantics.py
      # Live U1/U2 sources covered by the same authenticated authoring tests.
      - app/src/main/assets/content/es/programming/cpp_fundamentals/programas_y_ejecucion/lesson_fuente_compilacion_y_diagnostico.json
      - app/src/main/assets/content/es/programming/cpp_fundamentals/objetos_y_estado/lesson_conversiones_y_deduccion.json
      - app/src/main/assets/content/es/programming/cpp_fundamentals/objetos_y_estado/lesson_cadenas_y_texto.json
      - app/src/main/assets/content/es/programming/cpp_fundamentals/datos_propios_y_estado_valido/lesson_construir_y_comprobar_un_modelo_de_pedidos.json
      - app/src/main/assets/content/es/programming/cpp_fundamentals/archivos_y_programa_completo/lesson_leer_un_grupo_con_cierre_propio.json
      - app/src/main/assets/content/es/programming/cpp_fundamentals/archivos_y_programa_completo/lesson_estado_del_formato_y_flujos_independientes.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-editorial-choice:
    name: Exact owner, preserved history and rejected false revisions (Python)
    runs-on: windows-2022
    timeout-minutes: 15
    env:
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.longpaths
      GIT_CONFIG_VALUE_0: 'true'
    steps:
      - name: Read exact Codex publication
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select Python for native Windows QA
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify historical first hints and all five affected build generators
        run: >-
          python -B -m unittest discover
          -s scripts/curriculum
          -p test_legacy_review_feedback_adoption.py -v
      - name: Preserve optional hint and authenticated success-explanation contracts
        run: >-
          python -B -m unittest discover
          -s scripts/curriculum
          -p test_cpp_review_feedback_contract.py -v
      - name: Test real course against shared authoring and curricular validators
        run: >-
          python -B -m unittest discover
          -s scripts/curriculum
          -p test_general_choice_revision_live.py -v
      - name: Check atomic question, explanation and indexed hint revisions
        run: >-
          python -B -m unittest discover
          -s scripts/curriculum
          -p test_review_feedback_prose_revision.py -v
