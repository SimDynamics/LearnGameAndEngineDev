name: Codex temporary full diagnostic format preparation
on:
  push:
    branches: [Codex]
    paths: [.github/workflows/codex-diagnostic-native-stage.yml]
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare bounded fixture and native regression updates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64,hashlib,json,os,subprocess,urllib.request
          from pathlib import Path
          base='f097dc08b7eb4118420c69d386ebca49b5abdc05'
          assert subprocess.check_output(['git','rev-parse','HEAD^'],text=True).strip()==base
          assert subprocess.check_output(['git','diff','--name-only',base,'HEAD'],text=True).splitlines()==['.github/workflows/codex-diagnostic-native-stage.yml']
          def edit(path,old,new):
              p=Path(path);s=p.read_text(encoding='utf-8')
              assert s.count(old)==1,(path,old)
              p.write_text(s.replace(old,new,1),encoding='utf-8',newline='')
          sha='09a7f5ac91434ba65226f45727ae46a1487ee631'
          req=urllib.request.Request('https://api.github.com/repos/SimDynamics/LearnGameAndEngineDev/git/blobs/'+sha,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          with urllib.request.urlopen(req,timeout=30) as response:blob=json.load(response)
          content=base64.b64decode(blob['content'])
          assert hashlib.sha1(b'blob '+str(len(content)).encode()+b'\0'+content).hexdigest()==sha
          Path('native/platform/windows/u6_compilecheck_format_runner_tests.cpp').write_bytes(content)
          fixture='scripts/curriculum/compile_check_source_format_fixture.py'
          addition='''def all_reviewed_pairs() -> dict[str, dict]:
              """All 17 closed goals, using authenticated in-memory source reviews.

              Preserve the existing fixture names used by the loader tests; the
              native runner uses a separate manifest and stable owner identities.
              """
              from test_reviewed_diagnostic_structural_format import formatted_documents
              generated = {}
              lessons = []
              count = 0
              for index, (_, before, after, owners) in enumerate(formatted_documents()):
                  prefix = f"all-{index}"
                  generated[prefix + ".before"] = before
                  generated[prefix + ".after"] = after
                  lessons.append({
                      "before": prefix + ".before.json",
                      "after": prefix + ".after.json",
                      "owners": [{"id": identity, "diagnostic": diagnostic}
                                 for identity, diagnostic in owners],
                  })
                  count += len(owners)
              if count != 17 or len(lessons) != 6:
                  raise ValueError("The complete published closed-diagnostic coverage changed")
              generated["all-diagnostics.manifest"] = {"version": 1, "lessons": lessons}
              return generated


          '''
          edit(fixture,'def make() -> dict[str, dict]:',addition+'def make() -> dict[str, dict]:')
          edit(fixture,'    generated.update(additional_pairs())\n    return generated','    generated.update(additional_pairs())\n    generated.update(all_reviewed_pairs())\n    return generated')
          edit(fixture,'PASS original U6/U9 diagnostic format pairs, historical identity and forged-project rejection','PASS 17 original/formatted U6/U9 goals, stable owners and legacy forged fixtures')
          cmake='cmake/StateImportTests.cmake'
          extra='''# Every closed source diagnostic is compiled before and after formatting.
          # The manifest identifies owners independently of presentation positions.
          list(APPEND LGAED_U6_COMPILE_CHECK_FORMAT_FILES
              "${LGAED_U6_COMPILE_CHECK_FORMAT_DIR}/all-diagnostics.manifest.json")
          foreach(reviewed_index RANGE 0 5)
              foreach(reviewed_side IN ITEMS before after)
                  list(APPEND LGAED_U6_COMPILE_CHECK_FORMAT_FILES
                      "${LGAED_U6_COMPILE_CHECK_FORMAT_DIR}/all-${reviewed_index}.${reviewed_side}.json")
              endforeach()
          endforeach()
          set(LGAED_REVIEWED_DIAGNOSTIC_INPUTS)
          foreach(reviewed_lesson IN ITEMS
              funciones_y_contratos/lesson_declaraciones_y_firmas.json
              funciones_y_contratos/lesson_interfaces_cabeceras_y_programas_con_varios_archivos.json
              funciones_y_contratos/lesson_construir_un_proyecto_desde_su_interfaz.json
              datos_propios_y_estado_valido/lesson_consultas_const_y_objetos_constantes.json
              datos_propios_y_estado_valido/lesson_valores_por_defecto_con_significado.json
              datos_propios_y_estado_valido/lesson_argumentos_con_tipos_que_expresan_su_funcion.json)
              foreach(reviewed_locale IN ITEMS es en fr)
                  list(APPEND LGAED_REVIEWED_DIAGNOSTIC_INPUTS
                      "${CMAKE_SOURCE_DIR}/app/src/main/assets/content/${reviewed_locale}/programming/cpp_fundamentals/${reviewed_lesson}")
              endforeach()
          endforeach()
          '''
          anchor='add_custom_command(OUTPUT ${LGAED_U6_COMPILE_CHECK_FORMAT_FILES}\n'
          edit(cmake,anchor,extra+anchor)
          anchor='        "${CMAKE_SOURCE_DIR}/scripts/curriculum/test_compile_check_source_format.py"\n'
          edit(cmake,anchor,anchor+'        "${CMAKE_SOURCE_DIR}/scripts/curriculum/test_reviewed_diagnostic_structural_format.py"\n        "${CMAKE_SOURCE_DIR}/scripts/curriculum/validar_json_programacion.py"\n        ${LGAED_REVIEWED_DIAGNOSTIC_INPUTS}\n')
          PY
      - name: Verify generated fixtures and preserve every curricular asset
        run: |
          python3 -m py_compile scripts/curriculum/compile_check_source_format_fixture.py
          python3 -B scripts/curriculum/compile_check_source_format_fixture.py --output-dir "$RUNNER_TEMP/diagnostic-format-all"
          python3 -B -m unittest discover -s scripts/curriculum -p test_compile_check_source_format.py -v
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'diagnostic-format-all'
          m=json.loads((root/'all-diagnostics.manifest.json').read_text())
          assert len(m['lessons'])==6
          assert sum(len(x['owners']) for x in m['lessons'])==17
          for lesson in m['lessons']:
              for side in ('before','after'):
                  assert (root/lesson[side]).is_file()
          print('PASS all 17 native scenarios have authenticated before/after fixtures')
          PY
          git diff --check
      - name: Store reviewed blobs without changing any branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,subprocess,urllib.request
          from pathlib import Path
          files=['native/platform/windows/u6_compilecheck_format_runner_tests.cpp','scripts/curriculum/compile_check_source_format_fixture.py','cmake/StateImportTests.cmake']
          assert set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())==set(files)
          for path in files:
              data=Path(path).read_bytes()
              expected=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
              req=urllib.request.Request('https://api.github.com/repos/SimDynamics/LearnGameAndEngineDev/git/blobs',method='POST',data=json.dumps({'content':data.decode('utf-8'),'encoding':'utf-8'}).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
              with urllib.request.urlopen(req,timeout=30) as response:result=json.load(response)
              assert result['sha']==expected
              print('PREPARED_BLOB '+json.dumps({'path':path,'sha':expected}),flush=True)
          PY
