name: Codex portable course-edition path and history checks

on:
  push:
    branches: [Codex]
    paths:
      - .github/workflows/codex-course-edition-portable.yml
      - scripts/curriculum/course_edition.py
      - scripts/curriculum/course_edition_fixture_source.py
      - scripts/curriculum/test_course_edition.py
      - native/core/course_edition.hpp
      - native/core/course_edition_contract_tests.cpp
      - native/platform/windows/catalog_loader.cpp
      - native/platform/windows/course_edition_tests.cpp
      - native/platform/windows/catalog_resource_version.hpp
      - native/platform/windows/catalog_resource_version_tests.cpp
      - scripts/curriculum/stable_state_layout.py
      - scripts/curriculum/test_current_combined_format_guidance.py
      - scripts/curriculum/test_current_equal_reference_format.py
      - app/src/main/assets/content/es/programming/cpp_fundamentals/archivos_y_programa_completo/lesson_cerrar_reemplazar_y_anadir_datos.json
      - scripts/curriculum/code_format_compat.py
      - scripts/curriculum/text_semantics.py
      - app/src/main/assets/content/es/programming/cpp_fundamentals/errores_y_construccion_gradual/lesson_validar_antes_y_elegir_reporte.json
      - app/src/main/assets/content/es/programming/cpp_fundamentals/datos_propios_y_estado_valido/lesson_nombrar_alternativas_con_enum_class.json
      - app/src/main/assets/content/es/programming/cpp_fundamentals/datos_propios_y_estado_valido/lesson_consultas_const_y_objetos_constantes.json
      - app/src/main/assets/content/es/programming/cpp_fundamentals/aleatoriedad_y_reproducibilidad/lesson_combinar_ensayos_generados_y_casos_elegidos.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-contract:
    name: Native edition namespace and epoch contract (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - name: Check out the exact Codex publication
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compile and run the isolated native contract with GCC and Clang
        if: runner.os == 'Linux'
        shell: bash
        run: |
          for compiler in g++ clang++; do
            "$compiler" -std=c++23 -Wall -Wextra -Werror -pedantic -Inative \
              native/core/course_edition_contract_tests.cpp \
              -o "${RUNNER_TEMP}/course_edition_contract_tests"
            "${RUNNER_TEMP}/course_edition_contract_tests"
          done
      - name: Select Windows MSVC for an independent core check
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Compile and run the isolated native contract with MSVC
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          cl /nologo /std:c++latest /EHsc /W4 /WX /permissive- /Zc:__cplusplus /utf-8 /Inative native\\core\\course_edition_contract_tests.cpp /Fe:"%RUNNER_TEMP%\\course_edition_contract_tests.exe"
          if errorlevel 1 exit /b 1
          "%RUNNER_TEMP%\\course_edition_contract_tests.exe"

  catalog-compile:
    name: Compile real Win32 course-edition catalog loader (MSVC)
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Compile the actual catalog loader without changing the pinned application toolchain
        shell: cmd
        run: >
          cl /nologo /std:c++latest /EHsc /W4 /WX /permissive-
          /Zc:__cplusplus /utf-8 /Inative /c
          native\platform\windows\catalog_loader.cpp
          /Fo:"%RUNNER_TEMP%\lgaed_course_edition_catalog.obj"
      - name: Compile the real QA edition reader scenario (object, no app launch)
        shell: cmd
        run: >
          cl /nologo /std:c++latest /EHsc /W4 /permissive- /bigobj
          /Zc:__cplusplus /utf-8 /DUNICODE /D_UNICODE
          /DWIN32_LEAN_AND_MEAN /DNOMINMAX /D_WIN32_WINNT=0x0A00
          /DWINVER=0x0A00 /Inative /c
          native\platform\windows\course_edition_tests.cpp
          /Fo:"%RUNNER_TEMP%\lgaed_course_edition_reader_tests.obj"

  metadata-cache:
    name: Detect altered edition files despite restored Windows LastWriteTime
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Compile and execute real Win32 file-change metadata checks
        shell: cmd
        run: |
          cl /nologo /std:c++latest /EHsc /W4 /WX /permissive- /Zc:__cplusplus /utf-8 /Inative native\platform\windows\catalog_resource_version_tests.cpp /Fe:"%RUNNER_TEMP%\lgaed_catalog_version_tests.exe"
          if errorlevel 1 exit /b 1
          "%RUNNER_TEMP%\lgaed_catalog_version_tests.exe"

  authoring:
    name: Verify edition authoring and retained files (${{ matrix.os }}, Python 3.12)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - name: Check out the exact Codex publication
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select supported Python version
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exercise the actual edition validator and untouched historical fixtures
        run: python -B -m unittest discover -s scripts/curriculum -p test_course_edition.py -v
      - name: Confirm four real source and guidance reviews with stable ownership
        run: python -B -m unittest discover -s scripts/curriculum -p test_current_combined_format_guidance.py -v
      - name: Distinguish equal C++ references at their own stable addresses
        run: python -B -m unittest discover -s scripts/curriculum -p test_current_equal_reference_format.py -v
