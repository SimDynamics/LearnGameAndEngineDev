name: Codex MSVC assertion migration baseline (Windows)

on:
  push:
    branches: [Codex]
    paths:
      - .github/workflows/codex-native-assertion-migration.yml
      - scripts/curriculum/test_native_assertions_msvc.py
      - native/core/assertion_runtime_check.hpp
      - native/core/lesson.hpp
      - native/core/assertion_native_check_tests.cpp
      - native/platform/windows/native_assertion_runner_tests.cpp
      - cmake/PortableCompilerGuidanceQA/CMakeLists.txt
      - native/platform/windows/cpp_runner.cpp
      - native/platform/windows/cpp_runner_tests.cpp
      - native/platform/windows/compiler_completion.cpp
      - native/platform/windows/content_loader.cpp
      - native/presentation/windows/lesson_view.cpp
      - native/presentation/windows/lesson_view_tests.cpp
      - app/src/main/assets/content/es/programming/programming_practice_tools/comprobaciones_repetibles/lesson_comprobar_acuerdos_internos_con_aserciones.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-assertions:
    name: Three authentic U3L9 assertions with native MSVC C++23
    runs-on: windows-2025-vs2026
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Compile and run unchanged, NDEBUG and repaired sources plus hidden cases
        shell: pwsh
        run: python -B -m unittest discover -s scripts/curriculum -p test_native_assertions_msvc.py -v
      - name: Validate native CRT assertion proof on MSVC C++23
        shell: cmd
        run: |
          cl /nologo /std:c++23 /EHsc /W4 /WX /permissive- /Zc:__cplusplus /utf-8 /I native native\core\assertion_native_check_tests.cpp /Fe:"%RUNNER_TEMP%\lgaed_assertion_native_qa.exe"
          if errorlevel 1 exit /b 1
          "%RUNNER_TEMP%\lgaed_assertion_native_qa.exe"
      - name: Verify the Win32 runner, historical drafts and actual assertion editors
        shell: pwsh
        run: |
          $build = Join-Path $env:RUNNER_TEMP 'native-assertion-runner-qa'
          cmake -S cmake/PortableCompilerGuidanceQA -B "$build" -G Ninja -DLGAED_HOSTED_FEEDBACK_FONT_QA=ON -DLGAED_CPP_STANDARD_OPTION=/std:c++23
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build "$build" --target lgaed_native_assertion_runner_tests lgaed_inline_feedback_portable_qa --parallel 3
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir "$build" -R "^native[.]u3l9_assertion_(contracts|view)$" --verbose --output-on-failure --no-tests=error --output-junit (Join-Path $build 'native-assertion-results.xml')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve native assertion and editor evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-assertion-editors-${{ github.sha }}
          path: |
            ${{ runner.temp }}/native-assertion-runner-qa/native-assertion-results.xml
            ${{ runner.temp }}/native-assertion-runner-qa/Testing/Temporary/*.log
            ${{ runner.temp }}/native-assertion-runner-qa/CMakeCache.txt
