name: Codex U6L6 authenticated defaulted move policy

on:
  push:
    branches: [Codex]
    paths:
      - .github/workflows/codex-defaulted-move-policy.yml
      - native/core/cpp_defaulted_move_policy_check.hpp
      - native/core/cpp_class_definition_instrumentation.hpp
      - native/core/cpp_defaulted_move_policy_check_tests.cpp
      - scripts/curriculum/test_cpp_defaulted_move_policy.py
      - scripts/curriculum/test_cpp_defaulted_move_policy_authoring.py
      - scripts/curriculum/published_adoption_fixtures.py
      - scripts/curriculum/published_adoption_pins.json
      - scripts/curriculum/stable_state_layout.py
      - native/platform/windows/content_loader.cpp
      - app/src/main/assets/content/es/programming/cpp_language_memory_oop/estado_y_ciclo_de_vida_de_clases/lesson_elegir_copia_y_movimiento_de_una_clase.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-msvc:
    name: Genuine U6L6 generated moves and rejected copies with MSVC C++23
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Verify the real original U6L6 program and forbidden copies
        shell: cmd
        run: |
          python -B scripts\curriculum\test_cpp_defaulted_move_policy.py --compiler cl --windows
      - name: Verify original owner and defaulted-move authoring contract
        shell: cmd
        run: python -B -m unittest discover -s scripts\curriculum -p test_cpp_defaulted_move_policy_authoring.py -v
