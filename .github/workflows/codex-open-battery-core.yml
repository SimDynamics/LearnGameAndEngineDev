name: Codex open battery Windows MSVC cores

on:
  push:
    branches: [Codex]
    paths:
      - native/core/open_battery_check.hpp
      - native/platform/windows/open_battery_runtime_tests.cpp
      - native/platform/windows/cpp_runner.hpp
      - native/core/adjustment_project_check.hpp
      - native/core/rejection_diagnostic_facts.hpp
      - native/core/open_battery_check_tests.cpp
      - native/core/boolean_battery_check.hpp
      - native/core/boolean_battery_check_tests.cpp
      - native/core/reduction_check.hpp
      - native/core/reduction_check_tests.cpp
      - native/core/integer_battery_check.hpp
      - native/core/integer_battery_check_tests.cpp
      - native/core/code_format_compat.hpp
      - scripts/curriculum/test_open_battery_trace_runtime.py
      - .github/workflows/codex-open-battery-core.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  msvc:
    runs-on: windows-2022
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Compile portable C++23 core with MSVC
        shell: cmd
        run: |
          cl /nologo /std:c++latest /EHsc /W4 /WX /permissive- /Zc:__cplusplus /utf-8 /I native native\core\open_battery_check_tests.cpp /Fe:"%RUNNER_TEMP%\open_battery_core.exe"
          if errorlevel 1 exit /b %errorlevel%
          cl /nologo /std:c++latest /EHsc /W4 /WX /permissive- /Zc:__cplusplus /utf-8 /I native native\core\boolean_battery_check_tests.cpp /Fe:"%RUNNER_TEMP%\boolean_battery_core.exe"
          if errorlevel 1 exit /b %errorlevel%
          cl /nologo /std:c++latest /EHsc /W4 /WX /permissive- /Zc:__cplusplus /utf-8 /I native native\core\reduction_check_tests.cpp /Fe:"%RUNNER_TEMP%\reduction_core.exe"
          if errorlevel 1 exit /b %errorlevel%
          cl /nologo /std:c++latest /EHsc /W4 /WX /permissive- /Zc:__cplusplus /utf-8 /I native native\core\integer_battery_check_tests.cpp /Fe:"%RUNNER_TEMP%\integer_battery_core.exe"
      - name: Compile the original Windows battery runtime test
        shell: cmd
        run: >-
          cl /nologo /c /std:c++latest /EHsc /W4 /permissive- /Zc:__cplusplus /utf-8 /bigobj
          /DUNICODE /D_UNICODE /DWIN32_LEAN_AND_MEAN /DNOMINMAX /D_WIN32_WINNT=0x0A00 /DWINVER=0x0A00
          /I native native\platform\windows\open_battery_runtime_tests.cpp
          /Fo:"%RUNNER_TEMP%\open_battery_runtime_tests.obj"
      - name: Run MSVC core mutation tests
        shell: cmd
        run: |
          "%RUNNER_TEMP%\open_battery_core.exe"
          if errorlevel 1 exit /b %errorlevel%
          "%RUNNER_TEMP%\boolean_battery_core.exe"
          if errorlevel 1 exit /b %errorlevel%
          "%RUNNER_TEMP%\reduction_core.exe"
          if errorlevel 1 exit /b %errorlevel%
          "%RUNNER_TEMP%\integer_battery_core.exe"
      - name: Compile generated traces and preserve real student stderr
        shell: pwsh
        env:
          CXX: cl
        run: python -B -m unittest discover -s scripts/curriculum -p test_open_battery_trace_runtime.py -v
