name: One-time native inline presentation repair
on:
  push:
    branches: [Codex]
    paths:
      - .github/workflows/one-time-inline-ui.yml
      - scripts/maintenance/repair_inline_ui.py
      - native/presentation/windows/inline_presentation_tests.cpp
permissions:
  contents: write
concurrency:
  group: one-time-inline-ui-Codex
  cancel-in-progress: false
jobs:
  native-check-and-publish:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 10
      - name: Apply only the guarded reviewed changes
        shell: pwsh
        run: |
          git cat-file -e 85f1b10c22c55ddef466a395af133209cd63afbf
          if ($LASTEXITCODE -ne 0) { git fetch --depth=1 origin 85f1b10c22c55ddef466a395af133209cd63afbf }
          python scripts/maintenance/repair_inline_ui.py
          if ($LASTEXITCODE -ne 0) { throw 'Guarded repair failed; no source changes will be published.' }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'Whitespace validation failed.' }
      - name: Prepare an isolated native QA build without changing project presets
        shell: python
        run: |
          from pathlib import Path
          import os, re
          root=Path.cwd()
          qa=Path(os.environ['RUNNER_TEMP'])/'inline-ui-qa'
          qa.mkdir(parents=True,exist_ok=True)
          text=(root/'cmake/native_build_config.hpp.in').read_text(encoding='utf-8')
          text=text.replace('@CMAKE_SOURCE_DIR@',root.as_posix()).replace('@LGAED_DEFAULT_PROFILE@','Codex')
          text=re.sub(r'@[A-Z_]+@','',text)
          (qa/'native_build_config.hpp').write_text(text,encoding='utf-8')
          cmake='''cmake_minimum_required(VERSION 3.25)
          project(InlineNativeQA LANGUAGES CXX)
          set(CMAKE_CXX_STANDARD 20)
          set(CMAKE_CXX_STANDARD_REQUIRED ON)
          add_compile_definitions(UNICODE _UNICODE WIN32_LEAN_AND_MEAN NOMINMAX _WIN32_WINNT=0x0A00 WINVER=0x0A00)
          add_compile_options(/utf-8 /W4 /permissive- /Zc:__cplusplus /EHsc /Gy)
          include_directories("@ROOT@/native" "${CMAKE_CURRENT_SOURCE_DIR}")
          add_library(qa_core STATIC
            "@ROOT@/native/core/lesson.cpp"
            "@ROOT@/native/core/lesson_state.cpp"
            "@ROOT@/native/core/profile.cpp"
            "@ROOT@/native/core/cpp_project.cpp"
            "@ROOT@/native/core/view_preferences.cpp")
          add_library(qa_ui STATIC
            "@ROOT@/native/presentation/windows/cpp_fill_view.cpp"
            "@ROOT@/native/presentation/windows/order_code_view.cpp"
            "@ROOT@/native/presentation/windows/rich_text.cpp"
            "@ROOT@/native/presentation/windows/reader_theme.cpp"
            "@ROOT@/native/presentation/windows/code_editor.cpp"
            "@ROOT@/native/presentation/windows/code_gutter.cpp")
          target_link_libraries(qa_ui PUBLIC qa_core user32 gdi32 gdiplus comctl32 ole32 oleaut32 oleacc uuid windowsapp runtimeobject bcrypt shell32)
          add_library(integration_syntax OBJECT
            "@ROOT@/native/presentation/windows/lesson_view.cpp"
            "@ROOT@/native/presentation/windows/catalog_view.cpp")
          add_executable(inline_qa "@ROOT@/native/presentation/windows/inline_presentation_tests.cpp")
          target_link_libraries(inline_qa PRIVATE qa_ui)
          enable_testing()
          add_test(NAME native.inline_presentation COMMAND inline_qa)
          set_tests_properties(native.inline_presentation PROPERTIES TIMEOUT 60)
          '''.replace('@ROOT@',root.as_posix())
          (qa/'CMakeLists.txt').write_text(cmake,encoding='utf-8')
      - name: Compile changed integration and run real RichEdit regression
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'MSVC not available on the runner.' }
          $dev = Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
          $qa = Join-Path $env:RUNNER_TEMP 'inline-ui-qa'
          $command = 'call "' + $dev + '" && cmake -S "' + $qa + '" -B "' + $qa + '\build" -G Ninja -DCMAKE_BUILD_TYPE=Debug && cmake --build "' + $qa + '\build" --parallel 2 && ctest --test-dir "' + $qa + '\build" --output-on-failure'
          cmd /d /s /c $command
          if ($LASTEXITCODE -ne 0) { throw 'Native verification failed; candidate remains unpublished.' }
      - name: Publish verified source in two fast-forward batches and remove scaffolding
        shell: pwsh
        run: |
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'Diff check failed.' }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add native/presentation/windows/rich_text.cpp native/presentation/windows/rich_text.hpp native/presentation/windows/reader_theme.cpp native/presentation/windows/reader_theme.hpp native/presentation/windows/catalog_view.cpp
          git commit -m 'fix(windows): center hint overlays, color output strings and share alpha completion tint'
          if ($LASTEXITCODE -ne 0) { throw 'First commit failed.' }
          git push origin HEAD:refs/heads/Codex
          if ($LASTEXITCODE -ne 0) { throw 'Codex advanced; refusing to overwrite concurrent work.' }
          git add CMakeLists.txt native/presentation/windows/cpp_fill_view.cpp native/presentation/windows/cpp_fill_view.hpp native/presentation/windows/order_code_view.cpp native/presentation/windows/order_code_view.hpp native/presentation/windows/lesson_view.cpp
          git rm scripts/maintenance/repair_inline_ui.py .github/workflows/one-time-inline-ui.yml
          git commit -m 'fix(windows): align compact code holes, keep native caret centered and style completed exercises'
          if ($LASTEXITCODE -ne 0) { throw 'Second commit failed.' }
          git push origin HEAD:refs/heads/Codex
          if ($LASTEXITCODE -ne 0) { throw 'Codex advanced after first batch; no force push attempted.' }
          $head = git rev-parse HEAD
          "Published verified inline presentation: $head" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          'Native isolated MSVC Debug compilation and RichEdit regression passed. Full application Debug/Release and visual acceptance remain separate checks.' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
      - name: Preserve verification diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inline-native-verification
          path: ${{ runner.temp }}/inline-ui-qa/build/Testing/Temporary/*.log
          if-no-files-found: ignore
          retention-days: 3
