name: Auditoria global de legibilidad del codigo

on:
  push:
    branches: [main]
    paths:
      - 'app/src/main/assets/content/**/lesson_*.json'
      - 'scripts/curriculum/auditar_legibilidad_codigo.py'
      - 'scripts/curriculum/test_auditar_legibilidad_codigo.py'
      - 'scripts/curriculum/test_order_visual_separators.py'
      - 'scripts/curriculum/test_for_limites_format_batch.py'
      - 'scripts/curriculum/test_one_line_order_cards.py'
      - 'scripts/curriculum/test_single_line_order_puzzles.py'
      - 'scripts/curriculum/test_declaraciones_firmas_format_batch.py'
      - 'scripts/curriculum/test_funciones_nombrar_format_batch.py'
      - 'scripts/curriculum/test_retorno_caminos_format_batch.py'
      - 'scripts/curriculum/test_copia_ambito_format_batch.py'
      - 'scripts/curriculum/test_referencias_lectura_format_batch.py'
      - 'scripts/curriculum/test_referencias_modificar_format_batch.py'
      - 'scripts/curriculum/test_contratos_casos_format_batch.py'
      - 'scripts/curriculum/test_componer_funciones_format_batch.py'
      - 'scripts/curriculum/test_raiz_dominio_format_batch.py'
      - 'scripts/curriculum/test_conversion_comprobada_format_batch.py'
      - 'scripts/curriculum/auditar_tarjetas_orden_codigo.py'
      - '.github/workflows/legibilidad-codigo.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  auditar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Probar auditor sin modificar fuentes
        run: python -m unittest discover -s scripts/curriculum -p test_auditar_legibilidad_codigo.py -v
      - name: Verificar formato físico con archivo original y progreso histórico
        run: python -m unittest discover -s scripts/curriculum -p test_real_code_format_pilot.py -v
      - name: Validar alternativas originales y reformateadas C++23
        run: python -m unittest discover -s scripts/curriculum -p test_decision_format_batch.py -v
      - name: Acreditar combinaciones logicas U4L5 y sus fuentes historicas C++23
        run: python -m unittest discover -s scripts/curriculum -p test_combinar_condiciones_format_batch.py -v
      - name: Acreditar U4L6 cortocircuito, divisores y fuentes historicas C++23
        run: python -m unittest discover -s scripts/curriculum -p test_validez_cortocircuito_format_batch.py -v
      - name: Acreditar U4L7 decisiones independientes, anidadas y else-if C++23
        run: python -m unittest discover -s scripts/curriculum -p test_decisiones_compuestas_format_batch.py -v
      - name: Revisar U4L2 division y resto con C++23 y progreso historico
        run: python -m unittest discover -s scripts/curriculum -p test_division_resto_format_batch.py -v
      - name: Revisar U4L3 comparaciones y condiciones C++23 preservadas
        run: python -m unittest discover -s scripts/curriculum -p test_comparaciones_condiciones_format_batch.py -v
      - name: Comprobar primer recorrido while y formato historico con C++23
        run: python -m unittest discover -s scripts/curriculum -p test_condicion_cuerpo_progreso_format_batch.py -v
      - name: Probar for y limites sin cambiar el reto del editor C++23
        run: python -m unittest discover -s scripts/curriculum -p test_for_limites_format_batch.py -v
      - name: Validar U4L4 seleccion y resumen con preservacion C++23
        run: python -m unittest discover -s scripts/curriculum -p test_seleccionar_recorrido_format_batch.py -v
      - name: Acreditar U4L5 break continue y retos sin resolver
        run: python -m unittest discover -s scripts/curriculum -p test_interrumpir_continuar_format_batch.py -v
      - name: Acreditar switch y fallthrough C++23 con historial autentico
        run: python -m unittest discover -s scripts/curriculum -p test_switch_format_batch.py -v
      - name: Acreditar recorridos anidados reales y estado historico con C++23
        run: python -m unittest discover -s scripts/curriculum -p test_recorridos_anidados_format_batch.py -v
      - name: Verificar terminacion while y do while U4L8 con C++23
        run: python -m unittest discover -s scripts/curriculum -p test_justificar_terminacion_format_batch.py -v
      - name: Comprobar despacho y recuperacion U4L9 con C++23
        run: python -m unittest discover -s scripts/curriculum -p test_despacho_recuperacion_format_batch.py -v
      - name: Comprobar acumuladores con orden historico y formato C++23
        run: python -m unittest discover -s scripts/curriculum -p test_acumuladores_trazas_format_batch.py -v
      - name: Revisar recarga U4L10 y sus proyectos iniciales C++23
        run: python -m unittest discover -s scripts/curriculum -p test_proceso_recarga_format_batch.py -v
      - name: Verificar tarjetas de una linea con origen y respuesta historicos
        run: python -m unittest discover -s scripts/curriculum -p test_one_line_order_cards.py -v
      - name: Inventariar todas las tarjetas order_code sin cambiar su contenido
        run: python scripts/curriculum/auditar_tarjetas_orden_codigo.py --output-json tarjetas-orden.json
      - name: Garantizar una linea por tarjeta de orden en todo el curriculo espanol
        run: python -m unittest discover -s scripts/curriculum -p test_single_line_order_puzzles.py -v
      - name: Acreditar vectores U5L1 y su progreso historico con C++23
        run: python -m unittest discover -s scripts/curriculum -p test_vector_coleccion_format_batch.py -v
      - name: Acreditar indices U5L2 y proteccion de acceso C++23
        run: python -m unittest discover -s scripts/curriculum -p test_indices_limites_format_batch.py -v
      - name: Acreditar recorrido por valor U5L3 con C++23 e historial
        run: python -m unittest discover -s scripts/curriculum -p test_recorrer_valores_rango_format_batch.py -v
      - name: Acreditar referencias y copias U5L4 con C++23
        run: python -m unittest discover -s scripts/curriculum -p test_modificar_referencias_format_batch.py -v
      - name: Probar indices seguros U5L5 y dos editores sin resolver C++23
        run: python -m unittest discover -s scripts/curriculum -p test_recorrer_indices_seguridad_format_batch.py -v
      - name: Comprobar acumulacion y seleccion U5L6 con orden historico C++23
        run: python -m unittest discover -s scripts/curriculum -p test_acumular_contar_seleccionar_format_batch.py -v
      - name: Probar busqueda y ausencia U5L7 conservando historial C++23
        run: python -m unittest discover -s scripts/curriculum -p test_buscar_ausencia_format_batch.py -v
      - name: Acreditar extremos y casos de ausencia U5L8 con C++23
        run: python -m unittest discover -s scripts/curriculum -p test_extremos_sin_inventar_format_batch.py -v
      - name: Acreditar medias U5L9 y estado historico de C++23
        run: python -m unittest discover -s scripts/curriculum -p test_media_cantidad_format_batch.py -v
      - name: Acreditar U5L10 ordenacion y copias con C++23 y estado historico
        run: python -m unittest discover -s scripts/curriculum -p test_ordenar_conservar_original_format_batch.py -v
      - name: Acreditar U5L11 mediana con historiales C++23 y casos opcionales
        run: python -m unittest discover -s scripts/curriculum -p test_mediana_posiciones_format_batch.py -v
      - name: Verificar U5L12 informes transferidos con historia C++23
        run: python -m unittest discover -s scripts/curriculum -p test_informes_transferencia_format_batch.py -v
      - name: Acreditar U5L13 frecuencias y empates con historia C++23
        run: python -m unittest discover -s scripts/curriculum -p test_frecuencias_empates_format_batch.py -v
      - name: Acreditar U6L1 funciones nombradas, historia y ejecucion C++23
        run: python -m unittest discover -s scripts/curriculum -p test_funciones_nombrar_format_batch.py -v
      - name: Acreditar U6L2 firmas y archivos C++23, incluidos fallos previstos
        run: python -m unittest discover -s scripts/curriculum -p test_declaraciones_firmas_format_batch.py -v
      - name: Acreditar U6L3 retornos, rutas y editores C++23 con historial
        run: python -m unittest discover -s scripts/curriculum -p test_retorno_caminos_format_batch.py -v
      - name: Acreditar U6L4 copia, ambito y estado real con C++23
        run: python -m unittest discover -s scripts/curriculum -p test_copia_ambito_format_batch.py -v
      - name: Acreditar U6L5 referencias const e historial completo C++23
        run: python -m unittest discover -s scripts/curriculum -p test_referencias_lectura_format_batch.py -v
      - name: Acreditar U6L6 mutacion por referencia y alias con C++23
        run: python -m unittest discover -s scripts/curriculum -p test_referencias_modificar_format_batch.py -v
      - name: Acreditar U6L7 contratos, precondiciones y casos C++23
        run: python -m unittest discover -s scripts/curriculum -p test_contratos_casos_format_batch.py -v
      - name: Acreditar U6L8 composicion, 14 casos opcionales y texto C++23
        run: python -m unittest discover -s scripts/curriculum -p test_componer_funciones_format_batch.py -v
      - name: Acreditar U6L9 raiz, dominio, aproximacion e historial C++23
        run: python -m unittest discover -s scripts/curriculum -p test_raiz_dominio_format_batch.py -v
      - name: Acreditar U6L10 conversion, historial y entradas C++23
        run: python -m unittest discover -s scripts/curriculum -p test_conversion_comprobada_format_batch.py -v
      - name: Revisar todas las lecciones y fuentes
        run: python scripts/curriculum/auditar_legibilidad_codigo.py --limit 30 --output-json legibilidad-codigo.json
      - name: Conservar reporte de ubicaciones para Work
        uses: actions/upload-artifact@v4
        with:
          name: legibilidad-codigo
          path: |
            legibilidad-codigo.json
            tarjetas-orden.json
          retention-days: 14
