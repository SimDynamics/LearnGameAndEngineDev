name: Codex temporary diagnostic format verification
on:
  push:
    branches: [Codex]
    paths: [.github/workflows/codex-diagnostic-format-stage.yml]
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reproduce and prepare guarded changes without moving any branch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess,sys
          base='9fc80e8cbd28d988dda2ddb092f75c264f42e22b'
          assert subprocess.check_output(['git','rev-parse','HEAD^'],text=True).strip()==base
          assert subprocess.check_output(['git','diff','--name-only',base,'HEAD'],text=True).splitlines()==['.github/workflows/codex-diagnostic-format-stage.yml']
          sys.path.insert(0,'scripts/curriculum')
          import test_compile_check_source_format as fixture
          import validar_json_programacion as contract
          before,after=fixture.formatted_pair()
          contract.ERRORS.clear()
          for p,b in fixture.POSITIONS:
              contract.validate_cpp_compiler(after['pages'][p]['blocks'][b],'reproduction')
          assert len(contract.ERRORS)==3,contract.ERRORS
          assert all('A reviewed diagnostic must retain its exact complete initial block' in e for e in contract.ERRORS),contract.ERRORS
          print('REPRODUCED: three authenticated format revisions rejected by ordinary structural validation',flush=True)
          for error in contract.ERRORS: print(error,flush=True)
          def edit(path,before,after):
              p=Path(path);text=p.read_text(encoding='utf-8')
              if text.count(before)!=1:raise RuntimeError('Nonunique edit anchor '+path+': '+before[:100])
              with p.open('w',encoding='utf-8',newline='') as output:output.write(text.replace(before,after,1))
          path='scripts/curriculum/validar_json_programacion.py'
          edit(path,'def validate_cpp_compiler(block, where):','def validate_cpp_compiler(block, where, *, document=None, position=None):')
          edit(path,'    validate_cpp_compile_check_contract(block, where)\n','    validate_cpp_compile_check_contract(block, where, document=document, position=position)\n')
          edit(path,'''def validate_cpp_compile_check_contract(block, where):
              """A reviewed compile-time rejection is independent of an execution oracle."""
              try:
                  _state_layout.validate_compile_check_contract(block)
              except (ValueError, KeyError, TypeError) as error:
                  require(False, where, f"objetivo de diagnóstico de compilación inválido: {error}")''','''def validate_cpp_compile_check_contract(block, where, *, document=None, position=None):
              """Check the visible block; project source only with whole-lesson provenance.

              Standalone callers retain the exact closed-source requirement. A format
              snapshot is not permission by itself: validate the complete state map,
              editorial chain, owner and lexical equivalence before projecting bytes
              solely for this closed diagnostic check. Other structural checks still
              inspect the unchanged visible block, not its historical projection.
              """
              try:
                  reviewed = block
                  if "compileCheck" in block and (document is not None or position is not None):
                      _state_layout.require(type(document) is dict and type(position) is tuple
                                            and len(position) == 2
                                            and all(type(index) is int and index >= 0 for index in position),
                                            "A contextual diagnostic requires its document and current position")
                      _state_layout.validate(document)
                      page, index = position
                      _state_layout.require(document["pages"][page]["blocks"][index] == block,
                                            "Diagnostic block is detached from its validated owner")
                      metadata = document["stateLayout"]
                      identity = metadata["current"][page]["blocks"][index]
                      archive = next((entry["block"] for entry in
                                      metadata.get("sourceFormatRevisions", [])
                                      if entry["id"] == identity), None)
                      if archive is not None:
                          reviewed = _state_layout.code_format.source_projection(block, archive)
                  _state_layout.validate_compile_check_contract(reviewed)
              except (ValueError, KeyError, TypeError, IndexError) as error:
                  require(False, where, f"objetivo de diagnóstico de compilación inválido: {error}")''')
          edit(path,'                    validate_cpp_compiler(block, where)\n','                    validate_cpp_compiler(block, where, document=doc, position=(pn - 1, bn - 1))\n')
          edit('scripts/curriculum/validate_programming_practice_tools.py','                    contract.validate_cpp_compiler(block, where)\n','''                    if structure_only:
                                  # A bounded structural audit does not authenticate a
                                  # historical source-format exception.
                                  contract.validate_cpp_compiler(block, where)
                              else:
                                  contract.validate_cpp_compiler(
                                      block, where, document=document, position=(pn - 1, bn - 1))
          '''.rstrip()+'\n')
          PY
      - name: Add regression tests and lasting read-only CI
        shell: bash
        run: |
          cat > scripts/curriculum/test_reviewed_diagnostic_structural_format.py <<'PY'
          """Exercise the ordinary validator, not only the state-layout helper.

          The authentic published U6/U9 families are read without changing assets.
          In-memory reviews keep their full source archive and editorial chain.
          """
          from __future__ import annotations
          from contextlib import redirect_stdout
          from copy import deepcopy
          import io
          import json
          from pathlib import Path
          import unittest
          from unittest.mock import patch
          import validar_json_programacion as contract
          import validate_programming_practice_tools as shared_course

          layout = contract._state_layout
          ROOT = Path(__file__).resolve().parents[2]
          ASSETS = ROOT / 'app/src/main/assets/content'

          def position(document, identity):
              matches = [(p, b) for p, page in enumerate(document['stateLayout']['current'])
                         for b, candidate in enumerate(page['blocks']) if candidate == identity]
              if len(matches) != 1:
                  raise AssertionError('The published identity is missing or ambiguous: ' + identity)
              return matches[0]

          def formatted_documents():
              groups = {}
              for (lesson, owner), spec in layout.COMPILE_DIAGNOSTICS.items():
                  groups.setdefault(lesson, []).append((owner, spec['diagnostic']))
              result = []
              for lesson, owners in sorted(groups.items()):
                  course, unit, title = lesson.split('__')
                  relative = Path('programming') / course / unit / ('lesson_' + title + '.json')
                  family = {locale: json.loads((ASSETS / locale / relative).read_text(encoding='utf-8'))
                            for locale in ('es', 'en', 'fr')}
                  before = family['es']
                  layout.validate(before)
                  changed = deepcopy(before)
                  for identity, diagnostic in owners:
                      p, b = position(changed, identity)
                      block = changed['pages'][p]['blocks'][b]
                      if block['compileCheck']['diagnostic'] != diagnostic:
                          raise AssertionError('The actual reviewed diagnostic changed')
                      original = block['initialCode']
                      anchor = '\n    return 0;\n'
                      if original.count(anchor) != 1:
                          raise AssertionError('The published fixture no longer has its return')
                      spaced = original.replace(anchor, '\n\n    return 0;\n', 1)
                      block['initialCode'] = spaced
                      for file in block.get('projectFiles', []):
                          if file['path'] == 'main.cpp':
                              if file['initialCode'] != original:
                                  raise AssertionError('The published project main changed')
                              file['initialCode'] = spaced
                  after = layout.prepare_v2(changed, 'es', family, before)
                  layout.validate_transition(before, after)
                  result.append((ASSETS / 'es' / relative, before, after, owners))
              return result

          class ReviewedDiagnosticStructuralFormatTest(unittest.TestCase):
              @classmethod
              def setUpClass(cls):
                  cls.documents = formatted_documents()
                  cls.original_bytes = {path: path.read_bytes() for path, _, _, _ in cls.documents}

              def setUp(self):
                  contract.ERRORS.clear()

              def tearDown(self):
                  contract.ERRORS.clear()
                  for path, original in self.original_bytes.items():
                      self.assertEqual(path.read_bytes(), original)

              def validate_owner(self, document, identity, block=None, at=None):
                  at = position(document, identity) if at is None else at
                  visible = document['pages'][at[0]]['blocks'][at[1]] if block is None else block
                  contract.validate_cpp_compiler(visible, identity, document=document, position=at)

              def test_all_seventeen_closed_goals_pass_with_authenticated_format(self):
                  total = 0
                  for _, before, after, owners in self.documents:
                      self.assertEqual(layout.validate(before), layout.validate(after))
                      for identity, _ in owners:
                          with self.subTest(owner=identity, lesson=before['id']):
                              self.validate_owner(after, identity)
                              self.assertEqual(contract.ERRORS, [])
                              p, b = position(before, identity)
                              old = before['pages'][p]['blocks'][b]
                              q, c = position(after, identity)
                              new = after['pages'][q]['blocks'][c]
                              self.assertEqual(old['compileCheck'], new['compileCheck'])
                              self.assertEqual(old.get('sourceFiles'), new.get('sourceFiles'))
                              self.assertNotEqual(old['initialCode'], new['initialCode'])
                              total += 1
                  self.assertEqual(total, 17)

              def test_standalone_blocks_and_unarchived_spacing_stay_strict(self):
                  for _, before, after, owners in self.documents:
                      identity = owners[0][0]
                      p, b = position(after, identity)
                      block = after['pages'][p]['blocks'][b]
                      contract.ERRORS.clear()
                      contract.validate_cpp_compiler(block, identity)
                      self.assertTrue(contract.ERRORS)
                      with self.assertRaises(layout.LayoutError):
                          layout.validate_compile_check_contract(block)
                      unproved = deepcopy(after)
                      unproved['stateLayout']['sourceFormatRevisions'] = [
                          entry for entry in unproved['stateLayout']['sourceFormatRevisions']
                          if entry['id'] != identity]
                      contract.ERRORS.clear()
                      self.validate_owner(unproved, identity)
                      self.assertTrue(contract.ERRORS)

              def test_forged_source_archive_diagnostic_and_proof_fail_closed(self):
                  for _, _, after, owners in self.documents:
                      identity = owners[0][0]
                      for kind in ('token', 'diagnostic', 'archive', 'proof', 'lesson'):
                          with self.subTest(owner=identity, kind=kind):
                              forged = deepcopy(after)
                              p, b = position(forged, identity)
                              candidate = forged['pages'][p]['blocks'][b]
                              if kind == 'token':
                                  candidate['initialCode'] += '\nint forged = 1;\n'
                              elif kind == 'diagnostic':
                                  candidate['compileCheck']['diagnostic'] = 'not-authored'
                              elif kind == 'archive':
                                  snapshot = next(entry for entry in forged['stateLayout']['sourceFormatRevisions']
                                                  if entry['id'] == identity)
                                  snapshot['block']['initialCode'] += '\n// altered history\n'
                              elif kind == 'proof':
                                  editorial = forged['stateLayout']['editorial']
                                  last = max(i for i, entry in enumerate(editorial) if entry['id'] == identity)
                                  editorial.pop(last)
                              else:
                                  forged['id'] = 'cpp_fundamentals__other__unrelated_owner'
                              contract.ERRORS.clear()
                              self.validate_owner(forged, identity)
                              self.assertTrue(contract.ERRORS)

              def test_valid_document_never_authorizes_a_detached_or_mislocated_block(self):
                  _, _, after, owners = self.documents[0]
                  identity = owners[0][0]
                  p, b = position(after, identity)
                  block = deepcopy(after['pages'][p]['blocks'][b])
                  block['initialCode'] += '\nint not_in_document = 1;\n'
                  self.validate_owner(after, identity, block=block)
                  self.assertTrue(contract.ERRORS)
                  for invalid in ((-1, b), (True, b), (100000, b), None):
                      contract.ERRORS.clear()
                      contract.validate_cpp_compiler(after['pages'][p]['blocks'][b], identity,
                                                     document=after, position=invalid)
                      self.assertTrue(contract.ERRORS)

              def test_full_ordinary_validator_consumes_the_authored_reviews(self):
                  # Supply exactly the reviewed in-memory documents to the real
                  # load boundary. Git baselines and every other validator stay real.
                  overlays = {path: after for path, _, after, _ in self.documents}
                  real_load = contract.load
                  def reviewed_load(path):
                      return deepcopy(overlays[Path(path)]) if Path(path) in overlays else real_load(path)
                  with patch.object(contract, 'load', side_effect=reviewed_load), redirect_stdout(io.StringIO()):
                      contract.main(['--course', 'cpp_fundamentals', '--base-ref', 'HEAD'])
                  self.assertEqual(contract.ERRORS, [])

              def test_shared_course_validator_passes_context_but_structure_audit_does_not(self):
                  # Both routes reuse this same block validator; the bounded audit
                  # must not quietly turn itself into historical authentication.
                  from types import SimpleNamespace
                  real_load = contract.load
                  overlays = {path: after for path, _, after, _ in self.documents}
                  def reviewed_load(path):
                      return deepcopy(overlays[Path(path)]) if Path(path) in overlays else real_load(path)
                  namespace = SimpleNamespace(**vars(contract))
                  namespace.load = reviewed_load
                  shared_course.validate(namespace, ROOT, 'HEAD', course_id='cpp_fundamentals')
                  self.assertEqual(contract.ERRORS, [])
                  contract.ERRORS.clear()
                  summary = shared_course.validate(namespace, ROOT, None,
                      course_id='cpp_fundamentals', structure_only=True)
                  self.assertEqual(summary['scope'], 'STRUCTURE_ONLY_NOT_APPROVED')
                  self.assertTrue(any('exact complete initial block' in error for error in contract.ERRORS))

          if __name__ == '__main__':
              unittest.main()
          PY
          cat > .github/workflows/codex-reviewed-diagnostic-format.yml <<'YAML'
          name: Codex authenticated diagnostic structural formatting
          on:
            push:
              branches: [Codex]
              paths:
                - scripts/curriculum/validar_json_programacion.py
                - scripts/curriculum/validate_programming_practice_tools.py
                - scripts/curriculum/stable_state_layout.py
                - scripts/curriculum/code_format_compat.py
                - scripts/curriculum/test_compile_check_source_format.py
                - scripts/curriculum/test_reviewed_diagnostic_structural_format.py
                - .github/workflows/codex-reviewed-diagnostic-format.yml
            workflow_dispatch:
          permissions:
            contents: read
          jobs:
            contracts:
              strategy:
                fail-fast: false
                matrix:
                  os: [ubuntu-24.04, windows-2022]
              runs-on: ${{ matrix.os }}
              timeout-minutes: 12
              steps:
                - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
                  with:
                    fetch-depth: 0
                    persist-credentials: false
                - name: Verify original layout and diagnostic contracts
                  run: python -B -m unittest discover -s scripts/curriculum -p test_compile_check_source_format.py -v
                - name: Verify ordinary validators, authenticated formatting and tampering
                  run: python -B -m unittest discover -s scripts/curriculum -p test_reviewed_diagnostic_structural_format.py -v
          YAML
      - name: Compile Python and verify affected contracts
        shell: bash
        run: |
          python3 -m py_compile scripts/curriculum/validar_json_programacion.py scripts/curriculum/validate_programming_practice_tools.py scripts/curriculum/test_reviewed_diagnostic_structural_format.py
          python3 -B -m unittest discover -s scripts/curriculum -p test_compile_check_source_format.py -v
          python3 -B -m unittest discover -s scripts/curriculum -p test_reviewed_diagnostic_structural_format.py -v
          python3 -B scripts/curriculum/validar_json_programacion.py --base-ref 9fc80e8cbd28d988dda2ddb092f75c264f42e22b --course all
          git diff --check
      - name: Store only verified file blobs, never update branches
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib,json,os,subprocess,urllib.request
          from pathlib import Path
          files=['scripts/curriculum/validar_json_programacion.py','scripts/curriculum/validate_programming_practice_tools.py','scripts/curriculum/test_reviewed_diagnostic_structural_format.py','.github/workflows/codex-reviewed-diagnostic-format.yml']
          actual=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          assert actual==set(files[:2]),actual
          for path in files:
              data=Path(path).read_bytes()
              expected=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
              request=urllib.request.Request('https://api.github.com/repos/SimDynamics/LearnGameAndEngineDev/git/blobs',method='POST',data=json.dumps({'content':data.decode('utf-8'),'encoding':'utf-8'}).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
              with urllib.request.urlopen(request,timeout=30) as response:result=json.load(response)
              assert result['sha']==expected
              print('TESTED_BLOB '+json.dumps({'path':path,'sha':result['sha']}),flush=True)
          PY
