# LearnGraphicsProgramming - verified toolchain policy
# Versions are intentionally separate because hosts and targets differ.
# MSVC is for Windows/Unreal compatibility; it cannot target Android or WASI.
windows.msvc.toolset=14.50
android.abi=arm64-v8a
android.ndk=28.2.13676358
android.graphics=Vulkan,OpenGL ES 3
wasi.sdk.version=34.0
wasi.sdk.target=wasm32-wasip1
wasi.sdk.release=https://github.com/WebAssembly/wasi-sdk/releases/tag/wasi-sdk-34
wasi.sdk.host.archive=wasi-sdk-34.0-x86_64-linux.tar.gz
wasi.sdk.host.sha256=b761e3a0721dbae9c09a0059e5fdb2bf917d1b4a8a7b430fb3b5aafb0984b2c4
wasmtime.version=49.0.2
wasmtime.android.archive=wasmtime-v49.0.2-aarch64-android-c-api.tar.xz
wasmtime.android.sha256=7d0fcac9a3533df910edfd0651990ba17161827485120d026f25859cf77df045
wasmtime.release=https://github.com/bytecodealliance/wasmtime/releases/tag/v49.0.2
# The default APK uses Clang 23; FoldCode Clang 21 remains optional/legacy.
android.clang.current=23
android.clang.required=23
# WASI SDK 34 exception-enabled sysroot requires LLVM >= 22 and Wasmtime.
wasi.exception.compiler.minimum=22
wasi.exception.flags=-fwasm-exceptions -mllvm -wasm-use-legacy-eh=false
wasi.exception.link=-fwasm-exceptions -lunwind
